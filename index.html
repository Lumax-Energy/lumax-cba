function solveLinearSystem(K, f) {
  const n = f.length;
  if (n === 0) return [];
  const a = Array.from({ length: n }, (_, i) => {
    const row = K[i].slice();
    row.push(f[i]);
    return row;
  });
  for (let k = 0; k < n; k++) {
    let piv = k;
    let max = Math.abs(a[k][k]);
    for (let i = k + 1; i < n; i++) {
      const v = Math.abs(a[i][k]);
      if (v > max) {
        max = v;
        piv = i;
      }
    }
    if (max < 1e-18) throw new Error("singular");
    if (piv !== k) {
      const tmp = a[k];
      a[k] = a[piv];
      a[piv] = tmp;
    }
    const diag = a[k][k];
    for (let i = k + 1; i < n; i++) {
      const factor = a[i][k] / diag;
      if (factor === 0) continue;
      for (let j = k; j <= n; j++) a[i][j] -= factor * a[k][j];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = a[i][n];
    for (let j = i + 1; j < n; j++) s -= a[i][j] * x[j];
    const diag = a[i][i];
    if (Math.abs(diag) < 1e-18) throw new Error("singular");
    x[i] = s / diag;
  }
  return x;
}

const G_ACCEL = 9.80665;
const EPS = 1e-9;
const zeros4 = () => [0, 0, 0, 0];
const emptyCaseMap = (v = 0) => ({ G: v, Q1: v, Q2: v, "W+": v, "W-": v, O: v });

function elementStiffness(L, E, I) {
  const a = (12 * E * I) / L ** 3;
  const b = (6 * E * I) / L ** 2;
  const c = (4 * E * I) / L;
  const d = (2 * E * I) / L;
  return [
    [a, b, -a, b],
    [b, c, -b, d],
    [-a, -b, a, -b],
    [b, d, -b, c],
  ];
}
function eqPoint(Pdown, xi, L) {
  const P = -Pdown;
  const N1 = 1 - 3 * xi ** 2 + 2 * xi ** 3;
  const N2 = L * (xi - 2 * xi ** 2 + xi ** 3);
  const N3 = 3 * xi ** 2 - 2 * xi ** 3;
  const N4 = L * (xi ** 3 - xi ** 2);
  return [P * N1, P * N2, P * N3, P * N4];
}

    (M * (-6 * xi + 6 * xi ** 2)) / L,
    M * (1 - 4 * xi + 3 * xi ** 2),
    (M * (6 * xi - 6 * xi ** 2)) / L,
    M * (-2 * xi + 3 * xi ** 2),
  ];
}
function eqUdl(wDown, xi1, xi2, L) {
  const p1 = (s) => s - s ** 3 + s ** 4 / 2;
  const p2 = (s) => s ** 2 / 2 - (2 * s ** 3) / 3 + s ** 4 / 4;
  const p3 = (s) => s ** 3 - s ** 4 / 2;
  const p4 = (s) => -(s ** 3) / 3 + s ** 4 / 4;
  return [
    -wDown * L * (p1(xi2) - p1(xi1)),
    -wDown * L ** 2 * (p2(xi2) - p2(xi1)),
    -wDown * L * (p3(xi2) - p3(xi1)),
    -wDown * L ** 2 * (p4(xi2) - p4(xi1)),
  ];
}
function add4(a, b) {

  a[1] += b[1];
  a[2] += b[2];
  a[3] += b[3];
}
function loadApplies(load, x0, x1, isFirst) {
  if (!load.active) return false;
  if (!(Number.isFinite(load.magnitude) && load.magnitude !== 0)) return false;
  if (load.type === "Point" || load.type === "Moment") {
    const x = load.x1;
    const eps0 = isFirst ? 1e-9 : 0;
    return x > x0 - eps0 && x <= x1 + 1e-9;
  }
  return load.x2 > x0 && load.x1 < x1 && load.x2 > load.x1;
}
function validateLoad(load, totalLength) {
  if (!load.active) return null;
  if (!Number.isFinite(load.magnitude)) return `${load.id}: magnitude is not a number`;
  if (load.type === "UDL") {
    if (!Number.isFinite(load.x1) || !Number.isFinite(load.x2)) return `${load.id}: coordinates missing`;
    if (load.x2 <= load.x1) return `${load.id}: UDL x2 must be greater than x1`;
    if (load.x2 <= 0 || load.x1 >= totalLength) return `${load.id}: UDL does not overlap the beam`;
  } else {
    if (!Number.isFinite(load.x1)) return `${load.id}: x1 missing`;

  return s;
}

    if (values[i] < values[imin]) imin = i;
  }
  return { imax, imin };
}
function macaulay(el, c, x, wSelf, includeSW, rightLimit) {

  // rightLimit = true evaluates the limit from inside the element, so a point load or
  // moment sitting exactly at x is included. Used at the very start of the beam, where
  // there is no preceding element to carry the other face of the discontinuity.
  const past = rightLimit ? (a) => x >= a : (a) => x > a;
  for (const m of el.mapped) {
    if (m.load.case !== c) continue;
    const r1 = Math.max(x - m.a, 0);
    const r2 = Math.max(x - m.b, 0);
    if (m.load.type === "Point") {
      const P = m.load.magnitude * 1000;
      if (past(m.a)) dV += -P;
      dM += -P * r1;
      dS += (-P * r1 * r1) / 2;
      dD += (-P * r1 * r1 * r1) / 6;
    } else if (m.load.type === "Moment") {
      const M = m.load.magnitude * 1000;
      if (past(m.a)) dM += -M;
      dS += -M * r1;
      dD += (-M * r1 * r1) / 2;
    } else {
      const w = m.load.magnitude * 1000;
      dV += -w * (r1 - r2);
      dM += (-w * (r1 * r1 - r2 * r2)) / 2;

      dD += (-w * (r1 ** 4 - r2 ** 4)) / 24;

    dM += (-wSelf * x * x) / 2;

function analyze(model) {
  const nEl = Math.max(1, Math.min(24, model.nElements));
  const elements = model.elements.slice(0, nEl);
  const nNodes = nEl + 1;
  const supports = Array.from({ length: nNodes }, (_, i) => model.supports[i] ?? "Free");
  const E_mpa = materialE(model.material, model.customE);
  const density = materialDensity(model.material, model.customDensity);
  const E = E_mpa * 1e6;
  const custom = { I: model.customI, Z: model.customZ, A: model.customA, Av: model.customAv };
  const nodeX = [0];
  const sectionAt = [];
  for (let i = 0; i < nEl; i++) {
    const L = Math.max(elements[i]?.length ?? 0, 0);
    nodeX.push(nodeX[i] + L);
    const sec = resolveSection(elements[i]?.section || model.defaultSection, custom);
    sectionAt.push({ I: sec.I, Z: sec.Z, A: sec.A, Av: sec.Av, name: sec.name });
  }
  const totalLength = nodeX[nEl];
  const invalidLoads = [];
  for (const ld of model.loads) {
    const msg = validateLoad(ld, totalLength);
    if (msg) invalidLoads.push(msg);
  }
  const nVert = supports.filter((s) => s === "Pinned" || s === "Roller" || s === "Fixed").length;
  const nFixed = supports.filter((s) => s === "Fixed").length;
  const supportStable = nVert >= 2 || nFixed >= 1;
  const warnings = [];
  if (totalLength <= 0) warnings.push("Total beam length is zero.");
  if (model.nElements > 24) warnings.push(`Model declares ${model.nElements} elements; only the first 24 are analysed.`);
  for (let i = 0; i < nEl; i++) {
    if ((elements[i]?.length ?? 0) <= 0) warnings.push(`Element ${i + 1} has non-positive length.`);
    if (sectionAt[i].I <= 0) warnings.push(`Element ${i + 1} has I ≤ 0.`);
    if (sectionAt[i].Z <= 0) warnings.push(`Element ${i + 1} has Z ≤ 0 — bending stress is reported as zero there.`);
    if (sectionAt[i].Av <= 0) warnings.push(`Element ${i + 1} has Av ≤ 0 — shear stress is reported as zero there.`);
  }
  for (const ld of model.loads) {
    if (!ld.active || !Number.isFinite(ld.magnitude) || ld.magnitude === 0) continue;
    if (ld.type !== "UDL") continue;
    if (ld.x1 < -1e-9 || ld.x2 > totalLength + 1e-9) {
      warnings.push(`${ld.id}: UDL runs from ${formatNum(ld.x1, 3)} to ${formatNum(ld.x2, 3)} m; only the part on the beam (0 to ${formatNum(totalLength, 3)} m) is applied.`);
    }
  }
  const emptySelected = {
    id: model.selectedComboId,
    name: model.combinations.find((c) => c.id === model.selectedComboId)?.name ?? "",
    factors: emptyCaseMap(0),
    V: [], M: [], v: [], slopeDeg: [], tau: [], sigmaTop: [], sigmaBot: [], extrema: [],
  };
  const fail = (status) => ({
    ok: false, status, solverReady: false, supportStable, invalidLoads, warnings, totalLength,
    E: E_mpa, density, nElements: nEl, nNodes, nodeX, stations: [], reactions: [],
    selected: emptySelected, envelope: [],
    equilibrium: LOAD_CASES.map((c) => ({ case: c, applied: 0, reactions: 0, residual: 0, ok: true })),
    continuity: [],
    deflectionCheck: { longestSpan: 0, limitN: model.deflectionLimitN, allowableMm: 0, maxAbsMm: 0, utilisation: 0, spans: [], governingLabel: "—", status: "N/A" },
    sectionAt, defaultI: resolveSection(model.defaultSection, custom).I,
  });
  if (!supportStable) return fail("UNSTABLE SUPPORTS");
  if (totalLength <= 0 || warnings.some((w) => w.includes("I ≤ 0") || w.includes("non-positive"))) return fail("INVALID GEOMETRY");

  const nDof = nNodes * 2;
  const K = Array.from({ length: nDof }, () => new Array(nDof).fill(0));
  const F = { G: new Array(nDof).fill(0), Q1: new Array(nDof).fill(0), Q2: new Array(nDof).fill(0), "W+": new Array(nDof).fill(0), "W-": new Array(nDof).fill(0), O: new Array(nDof).fill(0) };
  const elems = [];
  for (let e = 0; e < nEl; e++) {
    const L = elements[e].length;
    const x0 = nodeX[e];
    const x1 = nodeX[e + 1];
    const I = sectionAt[e].I * 1e-12;
    const Z = sectionAt[e].Z * 1e-9;
    const A = sectionAt[e].A * 1e-6;
    const Av = sectionAt[e].Av * 1e-6;
    const ke = elementStiffness(L, E, I);
    const dofs = [2 * e, 2 * e + 1, 2 * e + 2, 2 * e + 3];
    for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) K[dofs[a]][dofs[b]] += ke[a][b];
    const f = { G: zeros4(), Q1: zeros4(), Q2: zeros4(), "W+": zeros4(), "W-": zeros4(), O: zeros4() };
    const mapped = [];
    for (const ld of model.loads) {
      if (!loadApplies(ld, x0, x1, e === 0)) continue;
      let fe, a = 0, b = 0;
      if (ld.type === "UDL") {
        a = Math.max(0, ld.x1 - x0);
        b = Math.min(L, ld.x2 - x0);

      } else if (ld.type === "Point") {
        a = ld.x1 - x0;
        b = a;
        fe = eqPoint(ld.magnitude * 1000, a / L, L);
      } else {
        a = ld.x1 - x0;
        b = a;
        fe = eqMoment(ld.magnitude * 1000, a / L, L);
      }
      add4(f[ld.case], fe);
      mapped.push({ load: ld, a, b });
    }
    const wSelf = density * (sectionAt[e].A * 1e-6) * G_ACCEL;
    if (model.includeSelfWeight) add4(f.G, eqUdl(wSelf, 0, 1, L));
    for (const c of LOAD_CASES) for (let a = 0; a < 4; a++) F[c][dofs[a]] += f[c][a];
    elems.push({
      L, x0, x1, E, I, Z, A, Av, name: sectionAt[e].name, ke, f,
      q: { G: zeros4(), Q1: zeros4(), Q2: zeros4(), "W+": zeros4(), "W-": zeros4(), O: zeros4() },
      dofs, mapped,

    constrained.push(s === "Fixed");

  const free = [];
  for (let i = 0; i < nDof; i++) if (!constrained[i]) free.push(i);

  const U = { G: new Array(nDof).fill(0), Q1: new Array(nDof).fill(0), Q2: new Array(nDof).fill(0), "W+": new Array(nDof).fill(0), "W-": new Array(nDof).fill(0), O: new Array(nDof).fill(0) };
  try {
    if (free.length === 0) throw new Error("singular");
    const Kff = free.map((i) => free.map((j) => K[i][j]));
    for (const c of LOAD_CASES) {
      const ff = free.map((i) => F[c][i]);
      const uf = solveLinearSystem(Kff, ff);
      for (let k = 0; k < free.length; k++) U[c][free[k]] = uf[k];
    }
  } catch {
    solverReady = false;
  }
  if (!solverReady) return fail("SOLVER ERROR");
  const R = { G: new Array(nDof).fill(0), Q1: new Array(nDof).fill(0), Q2: new Array(nDof).fill(0), "W+": new Array(nDof).fill(0), "W-": new Array(nDof).fill(0), O: new Array(nDof).fill(0) };
  for (const c of LOAD_CASES) {
    for (let i = 0; i < nDof; i++) {
      let s = 0;
      for (let j = 0; j < nDof; j++) s += K[i][j] * U[c][j];
      R[c][i] = s - F[c][i];
    }
  }
  for (const el of elems) {
    for (const c of LOAD_CASES) {
      const ue = el.dofs.map((d) => U[c][d]);
      const q = zeros4();
      for (let a = 0; a < 4; a++) {
        let s = 0;
        for (let b = 0; b < 4; b++) s += el.ke[a][b] * ue[b];
        q[a] = s - el.f[c][a];
      }
      el.q[c] = q;
    }
  }
  const comboById = new Map(model.combinations.map((c) => [c.id, c]));
  const selectedCombo = comboById.get(model.selectedComboId) ?? model.combinations[0] ?? {
    id: "none", name: "None", class: "User", factors: emptyCaseMap(0), notes: "",
  };
  const combos = model.combinations.filter((c) => LOAD_CASES.some((k) => (c.factors[k] ?? 0) !== 0));
  const refineCombos = combos.slice();
  if (!refineCombos.some((c) => c.id === selectedCombo.id)) refineCombos.push(selectedCombo);

  const nStat = model.stationsPerElement;
  const stations = [];
  for (let e = 0; e < nEl; e++) {
    const el = elems[e];
    const wSelf = density * el.A * G_ACCEL;
    const makeRec = (xi) => {
      const xloc = xi * el.L;
      const rec = {
        elementIndex: e, station: 0, xi, x: el.x0 + xloc,
        V: emptyCaseMap(), M: emptyCaseMap(), v: emptyCaseMap(), theta: emptyCaseMap(),
        side: xi <= EPS ? "left" : xi >= 1 - EPS ? "right" : "interior",
      };
      // At the very start of the beam there is no element to the left, so report the
      // limit from inside the beam; anywhere else the two faces sit on adjacent stations.
      const rightLimit = e === 0 && xi <= EPS;
      for (const c of LOAD_CASES) {
        const q = el.q[c];
        const { dV, dM, dS, dD } = macaulay(el, c, xloc, wSelf, model.includeSelfWeight, rightLimit);
        const V = q[0] + dV;
        const M = -q[1] + q[0] * xloc + dM;
        const th0 = U[c][el.dofs[1]];
        const v0 = U[c][el.dofs[0]];
        const EI = el.E * el.I;
        const th = th0 + (-q[1] * xloc + (q[0] * xloc * xloc) / 2 + dS) / EI;
        const v = v0 + th0 * xloc + ((-q[1] * xloc * xloc) / 2 + (q[0] * xloc ** 3) / 6 + dD) / EI;
        rec.V[c] = V / 1000;
        rec.M[c] = M / 1000;
        rec.v[c] = v * 1000;
        rec.theta[c] = th;
      }
      return rec;
    };
    // Combined rotation only, skipping cases the combination does not use — this is the
    // inner loop of the deflection-peak search, so it is worth keeping narrow.
    const thetaAt = (xi, f) => {
      const xloc = xi * el.L;
      let th = 0;
      for (const c of LOAD_CASES) {
        const g = f[c] ?? 0;
        if (g === 0) continue;
        const q = el.q[c];
        const { dS } = macaulay(el, c, xloc, wSelf, model.includeSelfWeight);
        th += g * (U[c][el.dofs[1]] + (-q[1] * xloc + (q[0] * xloc * xloc) / 2 + dS) / (el.E * el.I));
      }
      return th;
    };
    const xiSet = Array.from({ length: nStat }, (_, i) => i / (nStat - 1));
    for (const m of el.mapped) {
      if (m.load.type === "UDL") {
        if (m.a > EPS && m.a < el.L - EPS) xiSet.push(m.a / el.L - 1e-12, m.a / el.L + 1e-12);
        if (m.b > EPS && m.b < el.L - EPS) xiSet.push(m.b / el.L - 1e-12, m.b / el.L + 1e-12);
      } else if (m.a > EPS && m.a < el.L - EPS) {
        xiSet.push(m.a / el.L - 1e-12, m.a / el.L + 1e-12);
      }
    }
    let xis = uniqueSorted(xiSet.map((x) => Math.min(1, Math.max(0, x))));
    let recs = xis.map(makeRec);
    // Peak refinement. Between two neighbouring stations the combined shear is linear, so
    // its zero is the exact location of a stationary bending moment; the zero of the
    // combined rotation is the exact location of a stationary deflection. Without these
    // the reported extrema are only as good as the station spacing.
    const extra = [];
    for (const combo of refineCombos) {
      const f = combo.factors;
      const Vs = recs.map((r) => combine(r.V, f));
      const Ts = recs.map((r) => combine(r.theta, f));
      for (let i = 0; i + 1 < recs.length; i++) {
        const xa = recs[i].xi;
        const xb = recs[i + 1].xi;
        if (xb - xa < 1e-9) continue;
        if ((Vs[i] > 0 && Vs[i + 1] < 0) || (Vs[i] < 0 && Vs[i + 1] > 0)) {
          const t = Vs[i] / (Vs[i] - Vs[i + 1]);
          if (t > 0 && t < 1) extra.push(xa + t * (xb - xa));
        }
        if ((Ts[i] > 0 && Ts[i + 1] < 0) || (Ts[i] < 0 && Ts[i + 1] > 0)) {
          let lo = xa, hi = xb, flo = Ts[i];
          for (let k = 0; k < 30; k++) {
            const mid = (lo + hi) / 2;
            const fm = thetaAt(mid, f);
            if (fm === 0) { lo = mid; hi = mid; break; }
            if (flo < 0 === fm < 0) { lo = mid; flo = fm; } else hi = mid;
          }
          const t = (lo + hi) / 2;
          if (t > xa && t < xb) extra.push(t);
        }
      }
    }
    if (extra.length) {
      xis = uniqueSorted(xis.concat(extra.filter((t) => t > EPS && t < 1 - EPS)));
      recs = xis.map(makeRec);
    }
    recs.forEach((rec, idx) => {
      rec.station = idx;
      stations.push(rec);
    });
  }
  const reactions = supports
    .map((support, i) => ({ node: i + 1, x: nodeX[i], support, vertical: emptyCaseMap(), moment: emptyCaseMap() }))
    .filter((r) => r.support !== "Free")
    .map((r) => {
      const i = r.node - 1;
      for (const c of LOAD_CASES) {
        r.vertical[c] = R[c][2 * i] / 1000;
        r.moment[c] = R[c][2 * i + 1] / 1000;
      }
      return r;
    });
  const equilibrium = LOAD_CASES.map((c) => {
    let applied = 0;
    for (let i = 0; i < nDof; i += 2) applied += F[c][i] / 1000;
    let react = 0;
    for (let i = 0; i < nDof; i += 2) react += R[c][i] / 1000;
    const residual = applied + react;
    return { case: c, applied, reactions: react, residual, ok: Math.abs(residual) <= 1e-4 * (1 + Math.abs(applied)) };
  });
  const continuity = elems.map((el) => {
    let vRec = 0, vNod = 0;
    for (const c of LOAD_CASES) {
      const f = selectedCombo.factors[c] ?? 0;
      if (f === 0) continue;
      const q = el.q[c];
      const wSelf = density * el.A * G_ACCEL;
      const { dD } = macaulay(el, c, el.L, wSelf, model.includeSelfWeight);
      const th0 = U[c][el.dofs[1]];
      const v0 = U[c][el.dofs[0]];
      const EI = el.E * el.I;
      const v = v0 + th0 * el.L + ((-q[1] * el.L * el.L) / 2 + (q[0] * el.L ** 3) / 6 + dD) / EI;
      vRec += v * f;
      vNod += U[c][el.dofs[2]] * f;
    }
    const diffMm = (vRec - vNod) * 1000;
    return { element: elems.indexOf(el) + 1, diffMm, ok: Math.abs(diffMm) < 1e-6 };
  });
  const Vsel = stations.map((s) => combine(s.V, selectedCombo.factors));
  const Msel = stations.map((s) => combine(s.M, selectedCombo.factors));
  const vsel = stations.map((s) => combine(s.v, selectedCombo.factors));
  const thsel = stations.map((s) => -combine(s.theta, selectedCombo.factors) * (180 / Math.PI));
  const tau = stations.map((s, i) => {
    const Av_mm2 = elems[s.elementIndex].Av * 1e6;
    return Av_mm2 > 0 ? Math.abs((Vsel[i] * 1000) / Av_mm2) : 0;
  });
  const sigmaTop = stations.map((s, i) => {
    const Z_mm3 = elems[s.elementIndex].Z * 1e9;
    return Z_mm3 > 0 ? -(Msel[i] * 1e6) / Z_mm3 : 0;
  });
  const sigmaBot = stations.map((s, i) => {
    const Z_mm3 = elems[s.elementIndex].Z * 1e9;
    return Z_mm3 > 0 ? (Msel[i] * 1e6) / Z_mm3 : 0;
  });
  const xOf = (i) => stations[i]?.x ?? 0;
  const ext = (label, values, pick, unit) => {
    if (!values.length) return { label, value: 0, x: 0, combination: selectedCombo.name, unit };
    if (pick === "max") {
      const { imax } = argExtrema(values);
      return { label, value: values[imax], x: xOf(imax), combination: selectedCombo.name, unit };
    }
    if (pick === "min") {
      const { imin } = argExtrema(values);
      return { label, value: values[imin], x: xOf(imin), combination: selectedCombo.name, unit };
    }
    let ibest = 0;
    for (let i = 1; i < values.length; i++) if (Math.abs(values[i]) > Math.abs(values[ibest])) ibest = i;
    return { label, value: values[ibest], x: xOf(ibest), combination: selectedCombo.name, unit };
  };
  const extrema = [
    ext("Maximum positive shear", Vsel, "max", "kN"),
    ext("Maximum negative shear", Vsel, "min", "kN"),
    ext("Maximum sagging moment", Msel, "max", "kNm"),
    ext("Maximum hogging moment", Msel, "min", "kNm"),
    ext("Maximum upward deflection", vsel, "max", "mm"),
    ext("Maximum downward deflection", vsel, "min", "mm"),
    ext("Maximum clockwise slope", thsel, "max", "deg"),
    ext("Maximum counter-clockwise slope", thsel, "min", "deg"),
    ext("Maximum average shear stress", tau, "max", "MPa"),
    ext("Maximum absolute bending stress", sigmaTop.map((t, i) => Math.max(Math.abs(t), Math.abs(sigmaBot[i]))), "max", "MPa"),
  ];
  const envVmax = [], envVmin = [], envMmax = [], envMmin = [];
  const envVmaxC = [], envVminC = [], envMmaxC = [], envMminC = [];
  const envVup = [], envVdn = [], envVupC = [], envVdnC = [], envSig = [], envSigC = [];
  for (let i = 0; i < stations.length; i++) {
    let vmax = -Infinity, vmin = Infinity, mmax = -Infinity, mmin = Infinity;
    let vup = -Infinity, vdn = Infinity, sig = -Infinity;
    let cvmax = "", cvmin = "", cmmax = "", cmmin = "", cvup = "", cvdn = "", csig = "";
    for (const combo of combos) {
      const V = combine(stations[i].V, combo.factors);
      const M = combine(stations[i].M, combo.factors);
      const v = combine(stations[i].v, combo.factors);
      const Z_mm3 = elems[stations[i].elementIndex].Z * 1e9;
      const sAbs = Z_mm3 > 0 ? Math.abs((M * 1e6) / Z_mm3) : 0;
      if (V > vmax) { vmax = V; cvmax = combo.name; }
      if (V < vmin) { vmin = V; cvmin = combo.name; }
      if (M > mmax) { mmax = M; cmmax = combo.name; }
      if (M < mmin) { mmin = M; cmmin = combo.name; }
      if (v > vup) { vup = v; cvup = combo.name; }
      if (v < vdn) { vdn = v; cvdn = combo.name; }
      if (sAbs > sig) { sig = sAbs; csig = combo.name; }
    }
    envVmax.push(vmax); envVmin.push(vmin);
    envMmax.push(mmax); envMmin.push(mmin);
    envVup.push(vup); envVdn.push(vdn); envSig.push(sig);
    envVmaxC.push(cvmax); envVminC.push(cvmin);
    envMmaxC.push(cmmax); envMminC.push(cmmin);
    envVupC.push(cvup); envVdnC.push(cvdn); envSigC.push(csig);
  }
  const envItem = (label, values, names, pick, unit) => {
    if (!values.length || !Number.isFinite(values[0])) return { label, value: 0, x: 0, combination: "—", governing: "—", unit };
    const { imax, imin } = argExtrema(values);
    const i = pick === "max" ? imax : imin;
    return { label, value: values[i], x: xOf(i), combination: names[i], governing: names[i], unit };
  };
  const envelope = [
    envItem("Maximum shear", envVmax, envVmaxC, "max", "kN"),
    envItem("Minimum shear", envVmin, envVminC, "min", "kN"),
    envItem("Maximum moment", envMmax, envMmaxC, "max", "kNm"),
    envItem("Minimum moment", envMmin, envMminC, "min", "kNm"),
    envItem("Maximum deflection", envVup, envVupC, "max", "mm"),
    envItem("Minimum deflection", envVdn, envVdnC, "min", "mm"),
    envItem("Maximum absolute bending stress", envSig, envSigC, "max", "MPa"),
  ];
  const verticalXs = nodeX.filter((_, i) => {
    const s = supports[i];
    return s === "Pinned" || s === "Roller" || s === "Fixed";
  });
  let longestSpan = 0;
  for (let i = 1; i < verticalXs.length; i++) longestSpan = Math.max(longestSpan, verticalXs[i] - verticalXs[i - 1]);
  // Each span is checked against its own length. Comparing the worst deflection anywhere
  // on the beam against the longest span mixes up unrelated quantities: an overhang tip
  // would be judged against a span it has nothing to do with.
  const segments = [];
  for (let i = 1; i < verticalXs.length; i++) {
    segments.push({ kind: "Span", x0: verticalXs[i - 1], x1: verticalXs[i] });
  }
  if (verticalXs.length) {
    const first = verticalXs[0];
    const last = verticalXs[verticalXs.length - 1];
    if (first > EPS) segments.push({ kind: "Cantilever", x0: 0, x1: first });
    if (last < totalLength - EPS) segments.push({ kind: "Cantilever", x0: last, x1: totalLength });
  }
  const spanChecks = segments
    .map((seg) => {
      const len = seg.x1 - seg.x0;
      let peak = 0;
      let peakX = seg.x0;
      for (let i = 0; i < stations.length; i++) {
        const x = stations[i].x;
        if (x < seg.x0 - 1e-9 || x > seg.x1 + 1e-9) continue;
        if (Math.abs(vsel[i]) > Math.abs(peak)) { peak = vsel[i]; peakX = x; }
      }
      const allow = len > 0 && model.deflectionLimitN > 0 ? (len * 1000) / model.deflectionLimitN : 0;
      return {
        kind: seg.kind, x0: seg.x0, x1: seg.x1, length: len,
        maxAbsMm: Math.abs(peak), peakMm: peak, peakX, allowableMm: allow,
        utilisation: allow > 0 ? Math.abs(peak) / allow : 0,
      };
    })
    .sort((a, b) => a.x0 - b.x0);
  const governing = spanChecks.reduce((a, b) => (b.utilisation > (a?.utilisation ?? -1) ? b : a), null);
  const maxAbsMm = governing ? governing.maxAbsMm : 0;
  const allowableMm = governing ? governing.allowableMm : 0;
  const utilisation = governing ? governing.utilisation : 0;
  const status = invalidLoads.length > 0 ? "INVALID LOAD INPUT" : equilibrium.every((e) => e.ok) ? "OK" : "EQUILIBRIUM CHECK";
  return {
    ok: status === "OK" || status === "INVALID LOAD INPUT",
    status, solverReady, supportStable, invalidLoads, warnings, totalLength,
    E: E_mpa, density, nElements: nEl, nNodes, nodeX, stations, reactions,
    selected: {
      id: selectedCombo.id, name: selectedCombo.name, factors: selectedCombo.factors,
      V: Vsel, M: Msel, v: vsel, slopeDeg: thsel, tau, sigmaTop, sigmaBot, extrema,
    },
    envelope, equilibrium, continuity,
    deflectionCheck: {
      longestSpan, limitN: model.deflectionLimitN, allowableMm, maxAbsMm, utilisation,
      spans: spanChecks,
      governingLabel: governing ? `${governing.kind} ${formatNum(governing.x0, 3)}–${formatNum(governing.x1, 3)} m` : "—",
      status: allowableMm <= 0 ? "N/A" : utilisation <= 1 ? "PASS" : "FAIL",
    },
    sectionAt, defaultI: resolveSection(model.defaultSection, custom).I,
  };
}

const STORAGE_KEY = "cba-model-v1";
const STORAGE_KEY_LEGACY = "spanline-model-v1";
const TABS = [
  { id: "geometry", label: "Geometry" },
  { id: "loads", label: "Loads" },
  { id: "combos", label: "Combinations" },
  { id: "results", label: "Results" },
  { id: "qa", label: "QA" },
];
const CASE_LANE = { G: 0, Q1: 1, Q2: 2, "W+": 0, "W-": 1, O: 2 };

const ui = {
  tab: "results",
  probeX: null,
  showInactive: false,
  hover: {},
};

let model = excelExample();

function hydrate() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY_LEGACY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.elements) || !Array.isArray(parsed.loads)) return;
    const base = excelExample();
    const zero = LOAD_CASES.reduce((acc, k) => ((acc[k] = 0), acc), {});
    model = resizeElements(
      {
        ...base,
        ...parsed,
        combinations: (parsed.combinations ?? base.combinations).map((c) => ({
          ...c,
          factors: { ...zero, ...c.factors },
        })),
      },
      parsed.nElements ?? base.nElements,
    );
  } catch {
    /* keep default */
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(model));
  } catch {
    /* ignore */
  }
}

function esc(s) {
  return String(s)
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}

function badge(text, tone) {
  return `<span class="badge ${tone || "muted"}">${esc(text)}</span>`;
}

function iconDownload() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`;
}
function iconUpload() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>`;
}
function iconReset() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`;
}
function iconPlus() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`;
}
function iconTrash() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`;
}

function options(list, selected) {
  return list
    .map((v) => {
      const val = typeof v === "object" ? v.value : v;
      const lab = typeof v === "object" ? v.label : v;
      return `<option value="${esc(val)}"${String(val) === String(selected) ? " selected" : ""}>${esc(lab)}</option>`;
    })
    .join("");
}

function magUnit(type) {
  if (type === "UDL") return "kN/m";
  if (type === "Moment") return "kNm";
  return "kN";
}

function combinedReaction(r, factors) {
  let V = 0;
  let M = 0;
  for (const c of LOAD_CASES) {
    V += r.vertical[c] * (factors[c] ?? 0);
    M += r.moment[c] * (factors[c] ?? 0);
  }
  return { V, M };
}

function seriesFrom(result, field) {
  return result.stations.map((s, i) => ({ x: s.x, y: result.selected[field][i] ?? 0 }));
}

function envelopeTrace(stations, combos, field, pick) {
  return stations.map((s) => {
    let best = pick === "max" ? -Infinity : Infinity;
    for (const c of combos) {
      let v = 0;
      for (const k of LOAD_CASES) v += s[field][k] * (c.factors[k] ?? 0);
      if (pick === "max") best = Math.max(best, v);
      else best = Math.min(best, v);
    }
    return { x: s.x, y: Number.isFinite(best) ? best : 0 };
  });
}

function nearest(points, x) {
  if (!points.length) return null;
  let best = points[0];
  let bestD = Math.abs(best.x - x);
  for (const p of points) {
    const d = Math.abs(p.x - x);
    if (d < bestD) {
      best = p;
      bestD = d;
    }
  }
  return best;
}

function supportMark(x, y, type) {
  if (type === "Fixed") {
    const ticks = [-8, -4, 0, 4, 8]
      .map((dx) => `<line x1="${x + dx - 3}" y1="${y + 28}" x2="${x + dx + 3}" y2="${y + 18}" stroke="var(--color-muted)" stroke-width="1"/>`)
      .join("");
    return `<g><line x1="${x}" y1="${y + 3}" x2="${x}" y2="${y + 22}" stroke="var(--color-fg)" stroke-width="1.4"/>${ticks}</g>`;
  }
  const tri = `<polygon points="${x},${y + 4} ${x - 8},${y + 18} ${x + 8},${y + 18}" fill="none" stroke="var(--color-fg)" stroke-width="1.3"/>`;
  if (type === "Roller") {
    return `<g>${tri}<circle cx="${x - 5}" cy="${y + 22}" r="3" fill="none" stroke="var(--color-muted)" stroke-width="1.1"/><circle cx="${x + 5}" cy="${y + 22}" r="3" fill="none" stroke="var(--color-muted)" stroke-width="1.1"/></g>`;
  }
  return `<g>${tri}<line x1="${x - 10}" y1="${y + 18}" x2="${x + 10}" y2="${y + 18}" stroke="var(--color-muted)" stroke-width="1.1"/></g>`;
}

function schematicSvg(mod, result) {
  const n = result.nElements;
  const L = Math.max(result.totalLength, 1e-6);
  const W = 920;
  const H = 204;
  const padX = 36;
  const beamY = 92;
  const inner = W - padX * 2;
  const xAt = (x) => padX + (x / L) * inner;
  const loads = mod.loads.filter((l) => l.active && Number.isFinite(l.magnitude) && l.magnitude !== 0);
  const maxUdl = Math.max(0.001, ...loads.filter((l) => l.type === "UDL").map((l) => Math.abs(l.magnitude)));
  const reactionAt = new Map();
  for (const r of result.reactions) {
    reactionAt.set(r.node, combinedReaction(r, result.selected.factors).V);
  }

  const elLabels = result.nodeX
    .slice(0, n)
    .map((x0, i) => {
      const x1 = result.nodeX[i + 1];
      const cx = (xAt(x0) + xAt(x1)) / 2;
      return `<text x="${cx}" y="16" text-anchor="middle" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(mod.elements[i]?.description || "E" + (i + 1))} · ${esc(formatNum(x1 - x0, 2))} m</text>`;
    })
    .join("");

  const loadDraw = loads
    .map((ld) => {
      if (ld.type === "UDL") {
        const a = Math.max(0, ld.x1);
        const b = Math.min(L, ld.x2);
        const x1 = xAt(a);
        const x2 = xAt(b);
        const up = ld.magnitude < 0;
        const lane = CASE_LANE[ld.case] ?? 0;
        const h = 8 + (Math.abs(ld.magnitude) / maxUdl) * 14;
        const y0 = up ? beamY + 8 + lane * 3 : beamY - 8 - lane * 3;
        const y1 = up ? y0 + h : y0 - h;
        const fill = ld.case.startsWith("W") ? "var(--color-shear)" : "var(--color-moment)";
        const steps = Math.max(3, Math.min(24, Math.round((x2 - x1) / 28)));
        const pts = [];
        const lines = [];
        for (let i = 0; i <= steps; i++) {
          const x = x1 + ((x2 - x1) * i) / steps;
          pts.push(`${x},${y1}`);
          lines.push(`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${fill}" stroke-width="0.7"/>`);
        }
        return `<g opacity="0.85"><polygon points="${x1},${y0} ${pts.join(" ")} ${x2},${y0}" fill="${fill}" fill-opacity="0.18" stroke="${fill}" stroke-width="0.8"/>${lines.join("")}</g>`;
      }
      const x = xAt(Math.min(L, Math.max(0, ld.x1)));
      if (ld.type === "Moment") {
        const poly = ld.magnitude >= 0 ? "10,-14 6,-8 14,-10" : "-10,-14 -6,-8 -14,-10";
        return `<g transform="translate(${x} ${beamY})"><path d="M -10 -14 A 12 12 0 1 1 10 -14" fill="none" stroke="var(--color-moment)" stroke-width="1.4"/><polygon points="${poly}" fill="var(--color-moment)"/></g>`;
      }
      const down = ld.magnitude >= 0;
      const y1 = down ? beamY - 36 : beamY + 36;
      const arrow = down
        ? `${x},${beamY - 4} ${x - 4},${beamY - 12} ${x + 4},${beamY - 12}`
        : `${x},${beamY + 4} ${x - 4},${beamY + 12} ${x + 4},${beamY + 12}`;
      return `<g><line x1="${x}" y1="${y1}" x2="${x}" y2="${down ? beamY - 6 : beamY + 6}" stroke="var(--color-fg)" stroke-width="1.3"/><polygon points="${arrow}" fill="var(--color-fg)"/></g>`;
    })
    .join("");

  const nodes = result.nodeX
    .map((x, i) => {
      const px = xAt(x);
      const s = mod.supports[i] ?? "Free";
      const Rv = reactionAt.get(i + 1);
      const end = i === 0 || i === result.nodeX.length - 1;
      const rvTxt =
        Rv != null && Math.abs(Rv) >= 1e-6
          ? `<text x="${px}" y="${beamY + 36}" text-anchor="middle" fill="var(--color-shear)" font-size="8" font-family="var(--font-mono)">${esc(formatNum(Rv, 2))}</text>`
          : "";
      const xTxt = end
        ? `<text x="${px}" y="${s === "Free" ? beamY + 28 : beamY + 50}" text-anchor="${i === 0 ? "start" : "end"}" fill="var(--color-muted)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(x, 2))}</text>`
        : "";
      return `<g><circle cx="${px}" cy="${beamY}" r="2.6" fill="var(--color-bg)" stroke="var(--color-beam)" stroke-width="1.2"/>${s !== "Free" ? supportMark(px, beamY, s) : ""}${rvTxt}${xTxt}</g>`;
    })
    .join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Beam elevation">
    <line x1="${padX}" y1="${beamY}" x2="${W - padX}" y2="${beamY}" stroke="var(--color-beam)" stroke-width="3.5" stroke-linecap="round"/>
    ${elLabels}${loadDraw}${nodes}
    <text x="${padX}" y="${H - 10}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">x = 0</text>
    <text x="${W - padX}" y="${H - 10}" text-anchor="end" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(L, 3))} m</text>
  </svg>`;
}

function forceDiagramHtml(id, title, unit, color, points, nodeX, envelopeMax, envelopeMin) {
  const W = 920;
  const H = 168;
  const pad = { l: 52, r: 16, t: 18, b: 28 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const ys = points.map((p) => p.y);
  const envYs = [...(envelopeMax ?? []).map((p) => p.y), ...(envelopeMin ?? []).map((p) => p.y)];
  const all = ys.concat(envYs);
  let min = Math.min(0, ...all);
  let max = Math.max(0, ...all);
  if (min === max) {
    min -= 1;
    max += 1;
  }
  const span = max - min;
  min -= span * 0.08;
  max += span * 0.08;
  const L = Math.max(points[points.length - 1]?.x ?? 1, 1e-6);
  const xAt = (x) => pad.l + (x / L) * innerW;
  const yAt = (y) => pad.t + ((max - y) / (max - min)) * innerH;
  const toPath = (pts) => {
    if (!pts.length) return "";
    return pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xAt(p.x).toFixed(2)} ${yAt(p.y).toFixed(2)}`).join(" ");
  };
  const areaPath = (pts) => {
    if (!pts.length) return "";
    const z = yAt(0);
    const body = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xAt(p.x).toFixed(2)} ${yAt(p.y).toFixed(2)}`).join(" ");
    const last = pts[pts.length - 1];
    const first = pts[0];
    return `${body} L ${xAt(last.x).toFixed(2)} ${z.toFixed(2)} L ${xAt(first.x).toFixed(2)} ${z.toFixed(2)} Z`;
  };
  const maxPt = points.reduce((a, b) => (b.y > a.y ? b : a), points[0] ?? { x: 0, y: 0 });
  const minPt = points.reduce((a, b) => (b.y < a.y ? b : a), points[0] ?? { x: 0, y: 0 });
  const hover = ui.hover[id];
  const probe = ui.probeX == null ? null : nearest(points, ui.probeX);
  const shown = hover ?? (probe ? { x: probe.x, y: probe.y } : null);
  const pinX = hover?.x ?? probe?.x;
  const nodeLines = nodeX
    .map(
      (x, i) =>
        `<line x1="${xAt(x)}" y1="${pad.t}" x2="${xAt(x)}" y2="${H - pad.b}" stroke="var(--color-border)" stroke-width="1"${i === 0 || i === nodeX.length - 1 ? "" : ' stroke-dasharray="2 4"'}/>`,
    )
    .join("");
  const env =
    envelopeMax && envelopeMin
      ? `<path d="${toPath(envelopeMax)}" fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="1"/><path d="${toPath(envelopeMin)}" fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="1"/>`
      : "";
  const pin =
    pinX != null
      ? `<line x1="${xAt(pinX)}" y1="${pad.t}" x2="${xAt(pinX)}" y2="${H - pad.b}" stroke="var(--color-fg)" stroke-opacity="0.45"/>${shown ? `<circle cx="${xAt(shown.x)}" cy="${yAt(shown.y)}" r="3.2" fill="${color}" stroke="var(--color-bg)" stroke-width="1"/>` : ""}`
      : "";
  const read = shown
    ? `x ${formatNum(shown.x, 3)} m · ${formatNum(shown.y, 3)} ${unit}`
    : `max ${formatNum(maxPt?.y ?? 0, 3)} · min ${formatNum(minPt?.y ?? 0, 3)}`;
  return `<div class="diagram" data-diagram="${esc(id)}">
    <div class="diagram-head">
      <div><h3>${esc(title)}</h3><span class="unit">${esc(unit)}</span></div>
      <p class="read" data-readout>${esc(read)}</p>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} diagram" data-diagram-svg="${esc(id)}">
      <line x1="${pad.l}" y1="${yAt(0)}" x2="${W - pad.r}" y2="${yAt(0)}" stroke="var(--color-border-strong)" stroke-width="1"/>
      ${nodeLines}${env}
      <path d="${areaPath(points)}" fill="${color}" fill-opacity="0.22"/>
      <path d="${toPath(points)}" fill="none" stroke="${color}" stroke-width="1.6"/>
      ${pin}
      <text x="4" y="${yAt(max) + 8}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(max, 2))}</text>
      <text x="4" y="${yAt(min)}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(min, 2))}</text>
    </svg>
  </div>`;
}

  const combos = mod.combinations.filter((c) => LOAD_CASES.some((k) => (c.factors[k] ?? 0) !== 0));

  const M = seriesFrom(result, "M");
  const v = seriesFrom(result, "v");
  const slope = seriesFrom(result, "slopeDeg");
  const tau = seriesFrom(result, "tau");
  const sigma = seriesFrom(result, "sigmaTop");
  const dc = result.deflectionCheck;
  const cards = result.selected.extrema
    .map((e) => {
      const on = ui.probeX != null && Math.abs(e.x - ui.probeX) < 1e-9 ? " on" : "";

  if (ui.probeX != null && result.stations.length) {

    for (const s of result.stations) best = Math.min(best, Math.abs(s.x - ui.probeX));
    const bits = result.stations
      .map((s, i) => ({ s, i }))
      .filter(({ s }) => Math.abs(s.x - ui.probeX) <= best + 1e-12)
      .map(({ s, i }) => {
        const face = s.side !== "interior" ? ` · ${s.side}` : "";
        return `<span>V ${esc(formatNum(result.selected.V[i], 3))} kN · M ${esc(formatNum(result.selected.M[i], 3))} kNm · δ ${esc(formatNum(result.selected.v[i], 3))} mm${esc(face)}</span>`;
      })
      .join("");
    pin = `<div class="pinbar"><p class="vals">Pinned x = ${esc(formatNum(ui.probeX, 3))} m${bits}</p><button class="btn ghost" type="button" data-act="clear-probe">Clear pin</button></div>`;
  }

  const reactRows = result.reactions
    .map((r) => {
      const { V: Vv, M: Mv } = combinedReaction(r, result.selected.factors);
      return `<tr class="clickable" data-act="probe" data-x="${r.x}">
        <td class="num">${esc(formatNum(r.x, 3))}</td>
        <td>${esc(r.support)}</td>

        <td class="num">${esc(formatNum(Mv, 4))}</td>

    })
    .join("");

  const envRows = result.envelope
    .map(
      (e) => `<tr class="clickable" data-act="probe" data-x="${e.x}">
        <td>${esc(e.label)}</td>
        <td class="num">${esc(formatNum(e.value, 3))} ${esc(e.unit)}</td>
        <td class="num">${esc(formatNum(e.x, 3))}</td>
        <td>${esc(e.governing)}</td>
      </tr>`,
    )
    .join("");

  const stRows = result.stations
    .map((s, i) => {
      const on = ui.probeX != null && Math.abs(s.x - ui.probeX) < 1e-9 ? " on" : "";
      return `<tr class="clickable${on}" data-act="probe" data-x="${s.x}">
        <td class="num">${esc(formatNum(s.x, 3))}</td>
        <td class="num">${s.elementIndex + 1}</td>
        <td class="muted">${s.side === "interior" ? "—" : esc(s.side)}</td>
        <td class="num">${esc(formatNum(result.selected.V[i], 3))}</td>
        <td class="num">${esc(formatNum(result.selected.M[i], 3))}</td>
        <td class="num">${esc(formatNum(result.selected.v[i], 3))}</td>
        <td class="num">${esc(formatNum(result.selected.slopeDeg[i], 4))}</td>
        <td class="num">${esc(formatNum(result.selected.tau[i], 3))}</td>
        <td class="num">${esc(formatNum(result.selected.sigmaTop[i], 3))}</td>
      </tr>`;
    })
    .join("");

  const dcTone = dc.status === "PASS" ? "ok" : dc.status === "FAIL" ? "danger" : "muted";

  const deflRows = (dc.spans ?? [])
    .map((s) => {
      const gov = s === dc.spans.reduce((a, b) => (b.utilisation > (a?.utilisation ?? -1) ? b : a), null);
      return `<tr class="clickable${gov ? " on" : ""}" data-act="probe" data-x="${s.peakX}">
        <td>${esc(s.kind)} ${esc(formatNum(s.x0, 2))}–${esc(formatNum(s.x1, 2))}</td>
        <td class="num">${esc(formatNum(s.length, 3))}</td>
        <td class="num">${esc(formatNum(s.peakMm, 3))}</td>
        <td class="num">${esc(formatNum(s.allowableMm, 2))}</td>
        <td class="num">${esc(formatNum(s.utilisation, 3))}</td>
      </tr>`;
    })
    .join("");

  return `<div class="space-y">
    <div class="extrema">${cards}</div>
    ${pin}
    ${forceDiagramHtml("V", "Shear", "kN", "var(--color-shear)", V, result.nodeX, envelopeTrace(result.stations, combos, "V", "max"), envelopeTrace(result.stations, combos, "V", "min"))}
    ${forceDiagramHtml("M", "Bending moment (sagging +)", "kNm", "var(--color-moment)", M, result.nodeX, envelopeTrace(result.stations, combos, "M", "max"), envelopeTrace(result.stations, combos, "M", "min"))}
    ${forceDiagramHtml("v", "Deflection (up +)", "mm", "var(--color-defl)", v, result.nodeX, envelopeTrace(result.stations, combos, "v", "max"), envelopeTrace(result.stations, combos, "v", "min"))}
    ${forceDiagramHtml("slope", "Slope (clockwise +)", "deg", "var(--color-accent)", slope, result.nodeX)}
    ${forceDiagramHtml("tau", "Average shear stress", "MPa", "var(--color-shear)", tau, result.nodeX)}
    ${forceDiagramHtml("sigma", "Bending stress, top fibre", "MPa", "var(--color-moment)", sigma, result.nodeX)}
    <div class="split-2">
      <section class="card">
        <h2>Support reactions — ${esc(result.selected.name)}</h2>
        <p class="hint">Vertical positive upward. Moment positive counter-clockwise.</p>
        <div class="scroll">
          <table class="data">
            <thead><tr><th>x (m)</th><th>Support</th><th>V (kN)</th><th>M (kNm)</th></tr></thead>
            <tbody>${reactRows}</tbody>
          </table>
        </div>
      </section>
      <section class="card">
        <div class="row-head">
          <h2>Deflection check</h2>
          ${badge(dc.status, dcTone)}
        </div>
        <p class="hint">Each span between consecutive vertical supports is checked against its own length. Overhangs are checked separately against the overhang length — confirm that convention suits the project. Deflections are those of the selected combination, so select an unfactored serviceability combination for this check to mean anything.</p>
        <label class="label w-40" style="margin-top:1rem">
          <span>Limit span / n</span>
          <input class="field" type="number" min="50" max="1000" data-act="patch" data-field="deflectionLimitN" value="${esc(inputValue(mod.deflectionLimitN, 0))}">
        </label>
        <div class="scroll">
          <table class="data tight">
            <thead><tr><th>Segment</th><th>L (m)</th><th>δ (mm)</th><th>Allowable</th><th>Util.</th></tr></thead>
            <tbody>${deflRows}</tbody>
          </table>
        </div>
        <p class="mono-note">Governing: ${esc(dc.governingLabel)} · utilisation ${esc(formatNum(dc.utilisation, 3))}</p>
      </section>
    </div>
    <section class="card">
      <h2>All-combination envelope</h2>
      <p class="hint">Maxima and minima of every non-zero combination at every station. Faint traces on shear, moment and deflection.</p>
      <div class="scroll">
        <table class="data">
          <thead><tr><th>Result</th><th>Value</th><th>x (m)</th><th>Governing</th></tr></thead>
          <tbody>${envRows}</tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>Station results — ${esc(result.selected.name)}</h2>
      <p class="hint">${result.stations.length} stations. Duplicate rows at a node are the left and right faces of a discontinuity. Click a row to pin.</p>
      <div class="scroll-y">
        <table class="data min-48 tight">
          <thead class="sticky"><tr>
            <th>x (m)</th><th>El</th><th>Face</th><th>V (kN)</th><th>M (kNm)</th><th>δ (mm)</th><th>θ (deg)</th><th>τ (MPa)</th><th>σ top (MPa)</th>
          </tr></thead>
          <tbody>${stRows}</tbody>
        </table>
      </div>
    </section>
  </div>`;
}

function renderQa(result) {
  const tone = result.status === "OK" ? "ok" : "danger";
  const invalid = result.invalidLoads.length
    ? `<ul class="warn-list">${result.invalidLoads.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`
    : "";
  const warns = result.warnings.length
    ? `<ul class="warn-list">${result.warnings.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`
    : "";
  const eqRows = result.equilibrium
    .map(
      (row) => `<tr>
        <td class="mono">${esc(row.case)}</td>
        <td class="num">${esc(formatNum(row.applied, 4))}</td>
        <td class="num">${esc(formatNum(row.reactions, 4))}</td>
        <td class="num">${esc(formatNum(row.residual, 6))}</td>
        <td>${badge(row.ok ? "PASS" : "CHECK", row.ok ? "ok" : "danger")}</td>
      </tr>`,
    )
    .join("");
  const contRows = result.continuity
    .map(
      (c) => `<tr>
        <td class="mono">${c.element}</td>
        <td class="num">${esc(formatNum(c.diffMm, 9))}</td>
        <td>${badge(c.ok ? "PASS" : "CHECK", c.ok ? "ok" : "danger")}</td>
      </tr>`,
    )
    .join("");
  return `<div class="qa-grid">
    <section class="card">
      <h2>Engine status</h2>
      <dl class="status-rows">
        <div class="status-row"><dt>Overall</dt><dd>${badge(result.status, tone)}</dd></div>
        <div class="status-row"><dt>Solver ready</dt><dd>${badge(result.solverReady ? "True" : "False", result.solverReady ? "ok" : "danger")}</dd></div>
        <div class="status-row"><dt>Support stability</dt><dd>${badge(result.supportStable ? "True" : "False", result.supportStable ? "ok" : "danger")}</dd></div>
        <div class="status-row"><dt>Invalid active loads</dt><dd>${badge(String(result.invalidLoads.length), result.invalidLoads.length ? "warn" : "ok")}</dd></div>
        <div class="status-row"><dt>Selected combination</dt><dd><span class="mono-note" style="margin:0;color:var(--color-fg)">${esc(result.selected.name)}</span></dd></div>
      </dl>
      ${invalid}${warns}
    </section>
    <section class="card">
      <h2>Vertical equilibrium by load case</h2>
      <p class="hint">Applied FEA vertical load (up positive) versus support reactions.</p>
      <div class="scroll">
        <table class="data">
          <thead><tr><th>Case</th><th>Applied (kN)</th><th>Reactions (kN)</th><th>Residual</th><th>Status</th></tr></thead>
          <tbody>${eqRows}</tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>Element-end displacement continuity</h2>
      <p class="hint">Recovered Macaulay deflection at the right end of each element versus the nodal DOF.</p>
      <div class="scroll">
        <table class="data">
          <thead><tr><th>Element</th><th>Right-end difference (mm)</th><th>Status</th></tr></thead>
          <tbody>${contRows}</tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>Sign conventions</h2>
      <ul class="sign-list">
        <li>Solver: vertical displacement up positive, rotation counter-clockwise positive.</li>
        <li>Point loads and UDLs: downward positive in the input. Equivalent nodal loads reverse that into the FEA sign.</li>
        <li>Point moments: counter-clockwise positive.</li>
        <li>Bending moment: sagging positive (tension on the bottom fibre).</li>
        <li>Slope diagrams: clockwise positive (= −θ_ccw · 180/π).</li>
        <li>Support reactions: vertical upward positive, moment counter-clockwise positive.</li>
        <li>Top-fibre stress: −M/Z. Bottom-fibre stress: +M/Z.</li>
      </ul>
    </section>
    <section class="card span-2">
      <h2>Scope and limitations</h2>
      <ul class="scope-list">
        <li>Linear-elastic Euler–Bernoulli beam finite-element analysis. No shear deformation in the stiffness.</li>
        <li>Capacity: up to 24 sequential elements and 25 nodes. Supports: Free, Pinned, Roller, Fixed.</li>
        <li>Interior point loads, moments and partial UDLs recovered with equivalent nodal loading and exact Macaulay terms.</li>
        <li>No plasticity, second-order effects, lateral-torsional buckling, or uplift/contact nonlinearity.</li>
        <li>Section library: nominal IPE properties (EN 10365). Verify against the project-approved source before design use.</li>
        <li>Deflection check uses the longest distance between consecutive vertical supports, not element length.</li>
        <li>Combination factors remain the user’s design-basis responsibility.</li>
      </ul>
    </section>
  </div>`;
}

function panelHtml(mod, result) {
  if (ui.tab === "geometry") return renderGeometry(mod, result);
  if (ui.tab === "loads") return renderLoads(mod, result);
  if (ui.tab === "combos") return renderCombos(mod);
  if (ui.tab === "qa") return renderQa(result);
  return renderResults(mod, result);
}

function loadLegend(mod, result) {
  const loads = mod.loads.filter((l) => l.active && Number.isFinite(l.magnitude) && l.magnitude !== 0);
  if (!loads.length) return "";
  const items = loads
    .map((ld) => {
      const u = ld.type === "UDL" ? " kN/m" : ld.type === "Moment" ? " kNm" : " kN";
      return `<span>${esc(ld.id)} ${esc(ld.case)} ${esc(ld.type)} ${esc(formatNum(ld.magnitude, 3))}${u}</span>`;
    })
    .join("");
  const rx = result.reactions.length ? `<span class="subtle">Reactions ↑ kN under supports</span>` : "";
  return `<div class="load-legend">${items}${rx}</div>`;
}

function statusTone(result) {
  if (result.status === "OK") return "ok";
  if (result.ok) return "warn";
  return "danger";
}

function factorsLine(result) {
  const bits = LOAD_CASES.filter((k) => (result.selected.factors[k] ?? 0) !== 0).map(
    (k) => `${formatNum(result.selected.factors[k], 2)} ${k}`,
  );
  return bits.join(" + ") || "zero factors";
}

function render() {
  const result = analyze(model);
  const tabs = TABS.map(
    (t) => `<button class="tab${ui.tab === t.id ? " active" : ""}" type="button" data-act="tab" data-tab="${t.id}">${esc(t.label)}</button>`,
  ).join("");
  const comboOpts = options(
    model.combinations.map((c) => ({ value: c.id, label: c.name })),
    model.selectedComboId,
  );
  document.getElementById("app").innerHTML = `
    <header class="header">
      <div class="wrap header-inner">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M3 12h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M7 12v5M12 12v5M17 12v5" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
              <path d="M7 17.5 5.2 20h3.6L7 17.5zM12 17.5 10.2 20h3.6L12 17.5zM17 17.5 15.2 20h3.6L17 17.5z" fill="currentColor"/>
              <path d="M5 9.2c2.2-2.8 5-4 9-4s6.8 1.2 9 4" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
            </svg>
          </div>
          <div>
            <p class="brand-title">CBA</p>
            <p class="brand-sub">Continuous Beam Analysis · Lumax Energy</p>
          </div>
        </div>
        <div class="header-actions">
          ${badge(result.status, statusTone(result))}
          <select class="sel sm w-36" data-act="patch" data-field="selectedComboId" aria-label="Selected combination">${comboOpts}</select>
          <button class="btn hide-sm" type="button" data-act="preset" data-preset="example">${iconReset()} Example</button>
          <button class="btn hide-sm" type="button" data-act="preset" data-preset="three">3-span</button>
          <select class="sel sm w-preset show-sm" data-act="preset-select" aria-label="Load a preset">
            <option value="" selected disabled>Presets</option>
            <option value="example">12-span example</option>
            <option value="three">3-span floor</option>
          </select>
          <button class="btn hide-sm" type="button" data-act="import">${iconUpload()} Import</button>
          <button class="btn hide-sm" type="button" data-act="export-json">${iconDownload()} JSON</button>
          <button class="btn primary" type="button" data-act="export-csv">${iconDownload()} CSV</button>
        </div>
      </div>
    </header>
    <main class="wrap main">
      <p class="kicker">Selected combination</p>
      <h1 class="page-title">${esc(result.selected.name)}</h1>
      <p class="meta">${result.nElements} elements · ${esc(formatNum(result.totalLength, 3))} m · E = ${esc(formatNum(result.E, 0))} MPa · default section ${esc(model.defaultSection)}, I = ${esc(formatNum(result.defaultI, 0))} mm⁴ · ${esc(factorsLine(result))}</p>
      <div class="schematic">${schematicSvg(model, result)}${loadLegend(model, result)}</div>
      <nav class="tabs-wrap" aria-label="Sections"><div class="tabs">${tabs}</div></nav>
      <div class="panel">${panelHtml(model, result)}</div>
      <footer class="foot"><span>Analysis only. Confirm section properties, load factors, strength, stability, buckling, support behaviour and serviceability independently before design use.</span><span class="foot-brand">Lumax Energy · CBA</span></footer>
    </main>
    <input class="file-input" id="import-file" type="file" accept="application/json">
  `;
  bindDiagrams(result);
}

function bindDiagrams(result) {
  const combos = model.combinations.filter((c) => LOAD_CASES.some((k) => (c.factors[k] ?? 0) !== 0));
  const catalog = {
    V: { points: seriesFrom(result, "V"), unit: "kN" },
    M: { points: seriesFrom(result, "M"), unit: "kNm" },
    v: { points: seriesFrom(result, "v"), unit: "mm" },
    slope: { points: seriesFrom(result, "slopeDeg"), unit: "deg" },
    tau: { points: seriesFrom(result, "tau"), unit: "MPa" },
    sigma: { points: seriesFrom(result, "sigmaTop"), unit: "MPa" },
  };
  document.querySelectorAll("[data-diagram-svg]").forEach((svg) => {
    const id = svg.getAttribute("data-diagram-svg");
    const spec = catalog[id];
    if (!spec || !spec.points.length) return;
    const W = 920;
    const padL = 52;
    const padR = 16;
    const innerW = W - padL - padR;
    const L = Math.max(spec.points[spec.points.length - 1].x, 1e-6);
    const pick = (ev) => {
      const rect = svg.getBoundingClientRect();
      const px = ((ev.clientX - rect.left) / rect.width) * W;
      const x = ((px - padL) / innerW) * L;
      if (x < 0 || x > L) return null;
      return nearest(spec.points, x);
    };
    svg.addEventListener("mousemove", (ev) => {
      const p = pick(ev);
      ui.hover[id] = p ? { x: p.x, y: p.y } : null;
      const read = svg.closest(".diagram")?.querySelector("[data-readout]");
      if (read && p) read.textContent = `x ${formatNum(p.x, 3)} m · ${formatNum(p.y, 3)} ${spec.unit}`;
    });
    svg.addEventListener("mouseleave", () => {
      ui.hover[id] = null;
    });
    svg.addEventListener("click", (ev) => {
      const p = pick(ev);
      if (p) {
        ui.probeX = p.x;
        render();
      }
    });
  });
  void combos;
}

function setModel(next) {
  model = resizeElements(next, next.nElements);
  persist();
  ui.probeX = null;
  render();
}

function patch(partial) {
  let next = { ...model, ...partial };
  if (partial.nElements !== undefined) next = resizeElements(next, partial.nElements);
  model = next;
  persist();
  render();
}

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function downloadBlob(content, type, name) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function exportJson() {
  downloadBlob(JSON.stringify(model, null, 2), "application/json", "cba-model.json");
}

function exportCsv() {
  const result = analyze(model);
  const lines = ["x_m,V_kN,M_kNm,defl_mm,slope_deg,tau_MPa,sigma_top_MPa,sigma_bot_MPa"];
  for (let i = 0; i < result.stations.length; i++) {
    lines.push(
      [
        result.stations[i].x,
        result.selected.V[i],
        result.selected.M[i],
        result.selected.v[i],
        result.selected.slopeDeg[i],
        result.selected.tau[i],
        result.selected.sigmaTop[i],
        result.selected.sigmaBot[i],
      ].join(","),
    );
  }
  downloadBlob(lines.join("\n"), "text/csv", `cba-${result.selected.name.replace(/\s+/g, "_")}.csv`);
}

function importJsonFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (parsed && Array.isArray(parsed.elements)) setModel(parsed);
    } catch {
      /* ignore */
    }
  };
  reader.readAsText(file);
}

function onClick(ev) {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  const act = t.getAttribute("data-act");
  if (act === "tab") {
    ui.tab = t.getAttribute("data-tab");
    render();
  } else if (act === "preset") {
    const p = t.getAttribute("data-preset");
    setModel(p === "three" ? simpleThreeSpan() : excelExample());
  } else if (act === "import") {
    document.getElementById("import-file")?.click();
  } else if (act === "export-json") {
    exportJson();
  } else if (act === "export-csv") {
    exportCsv();
  } else if (act === "add-span") {
    patch({ nElements: Math.min(24, model.nElements + 1) });
  } else if (act === "add-load") {
    const loads = model.loads.slice();
    loads.push({ ...blankLoad(loads.length + 1), active: true });
    patch({ loads });
  } else if (act === "remove-load") {
    const i = Number(t.getAttribute("data-index"));
    patch({ loads: model.loads.filter((_, j) => j !== i) });
  } else if (act === "probe") {
    ui.probeX = Number(t.getAttribute("data-x"));
    render();
  } else if (act === "clear-probe") {
    ui.probeX = null;
    render();
  } else if (act === "select-combo") {
    if (ev.target.closest("input,select,button")) return;
    patch({ selectedComboId: t.getAttribute("data-id") });
  }
}

function onChange(ev) {
  const t = ev.target;
  if (!(t instanceof HTMLElement)) return;
  const act = t.getAttribute("data-act");
  if (!act) return;
  if (act === "patch") {
    const field = t.getAttribute("data-field");
    const raw = t.value;
    const numeric = ["nElements", "customE", "customDensity", "customI", "customZ", "customA", "customAv", "stationsPerElement", "deflectionLimitN"].includes(field);
    patch({ [field]: numeric ? num(raw) : raw });
  } else if (act === "patch-bool") {
    patch({ [t.getAttribute("data-field")]: t.checked });
  } else if (act === "default-section") {
    const name = t.value;
    const els = model.elements.map((el) => (el.section === model.defaultSection ? { ...el, section: name } : el));
    patch({ defaultSection: name, elements: els });
  } else if (act === "element") {
    const i = Number(t.getAttribute("data-index"));
    const field = t.getAttribute("data-field");
    const value = field === "length" ? num(t.value) : t.value;
    const elements = model.elements.map((el, j) => (j === i ? { ...el, [field]: value } : el));
    patch({ elements });
  } else if (act === "support") {
    const i = Number(t.getAttribute("data-index"));
    const supports = model.supports.slice();
    supports[i] = t.value;
    patch({ supports });
  } else if (act === "load") {
    const i = Number(t.getAttribute("data-index"));
    const field = t.getAttribute("data-field");
    let value;
    if (t.getAttribute("data-type") === "bool") value = t.checked;
    else if (["x1", "x2", "magnitude"].includes(field)) value = num(t.value);
    else value = t.value;
    const loads = model.loads.map((ld, j) => (j === i ? { ...ld, [field]: value } : ld));
    patch({ loads });
  } else if (act === "show-inactive") {
    ui.showInactive = t.checked;
    render();
  } else if (act === "combo-field") {
    const id = t.getAttribute("data-id");
    const field = t.getAttribute("data-field");
    const combinations = model.combinations.map((c) => (c.id === id ? { ...c, [field]: t.value } : c));
    patch({ combinations });
  } else if (act === "combo-factor") {
    const id = t.getAttribute("data-id");
    const factor = t.getAttribute("data-factor");
    const combinations = model.combinations.map((c) =>
      c.id === id ? { ...c, factors: { ...c.factors, [factor]: num(t.value) } } : c,
    );
    patch({ combinations });
  } else if (act === "preset-select") {
    if (t.value === "example") setModel(excelExample());
    if (t.value === "three") setModel(simpleThreeSpan());
    t.value = "";
  }
}

document.addEventListener("click", onClick);
document.addEventListener("change", onChange);
document.addEventListener("change", (ev) => {
  if (ev.target && ev.target.id === "import-file" && ev.target.files?.[0]) {
    importJsonFile(ev.target.files[0]);
    ev.target.value = "";
  }
});

hydrate();
render();

  </script>
</body>
</html>
