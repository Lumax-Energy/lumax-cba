      </div>
    </div>
    <div class="chips">${chips}</div>
    <p class="hint" style="margin:0">Click a combination to hide or show it; hover it to pick it out on every diagram. Combinations whose factors are all zero are not listed.</p>
  </section>`;
}

function renderResultsAll(mod, result) {
  const bar = viewBar(mod, result);
  const shown = shownComboResults(mod, result);
  if (!shown.length) {
    let why = "Every combination is hidden. Click one above, or Show all.";
    if (!result.stations.length) why = `The model cannot be analysed (${result.status}). See the QA tab.`;
    else if (!result.comboResults.length) why = "Every combination has all-zero factors. Enter factors on the Combinations tab.";
    return `<div class="space-y">${bar}<section class="card"><h2>Nothing to plot</h2><p class="hint">${esc(why)}</p></section></div>`;
  }
  const xs = result.stations.map((s) => s.x);
  const keyed = (r) => `<span class="key-inline">${comboKey(comboStyle(mod, r.id))}${esc(r.name)}</span>`;
  const probeOn = (x) => ui.probeX != null && Math.abs(x - ui.probeX) < 1e-9;

  // For each extremum, the shown combination that governs it. These are the envelope
  // extrema of the shown set, and the cells highlighted in the per-combination table.
  const governing = shown[0].extrema.map((_, k) => {
    let best = shown[0];
    for (const r of shown) {
      const e = r.extrema[k];
      const b = best.extrema[k];
      if (e.pick === "min" ? e.value < b.value : e.value > b.value) best = r;
    }
    return best;
  });
  const cards = governing
    .map((r, k) => {
      const e = r.extrema[k];
      return `<button class="ext-card${probeOn(e.x) ? " on" : ""}" type="button" data-act="probe" data-x="${e.x}">
        <p class="k">${esc(e.label)}</p>
        <p class="v">${esc(formatNum(e.value, 3))}<span>${esc(e.unit)}</span></p>
        <p class="x key-inline">x = ${esc(formatNum(e.x, 3))} m · ${comboKey(comboStyle(mod, r.id))}${esc(r.name)}</p>
      </button>`;
    })
    .join("");

  let pin = `<p class="hint">Click a diagram, extrema card or table value to pin a station and read every combination there.</p>`;
  if (ui.probeX != null) {
    let best = Infinity;
    for (const x of xs) best = Math.min(best, Math.abs(x - ui.probeX));
    const idx = xs.map((_, i) => i).filter((i) => Math.abs(xs[i] - ui.probeX) <= best + 1e-12);
    const faceName = (s) => `${s.side === "right" ? "end" : s.side === "left" ? "start" : "inside"} of El ${s.elementIndex + 1}`;
    const faces = idx.length > 1 ? ` · ${idx.map((i) => faceName(result.stations[i])).join(" / ")}` : "";
    const cell = (r, field, d) => `<td class="num r nw">${esc(idx.map((i) => formatNum(r[field][i], d)).join(" / "))}</td>`;
    const rows = shown
      .map((r) => `<tr><td>${keyed(r)}</td>${cell(r, "V", 3)}${cell(r, "M", 3)}${cell(r, "v", 3)}${cell(r, "slopeDeg", 4)}${cell(r, "tau", 3)}${cell(r, "sigmaTop", 3)}</tr>`)
      .join("");
    pin = `<section class="card">
      <div class="row-head" style="align-items:center">
        <h2>Pinned x = ${esc(formatNum(ui.probeX, 3))} m${esc(faces)}</h2>
        <button class="btn ghost" type="button" data-act="clear-probe">Clear pin</button>
      </div>
      <div class="scroll">
        <table class="data tight">
          <thead><tr><th>Combination</th><th class="r">V (kN)</th><th class="r">M (kNm)</th><th class="r">δ (mm)</th><th class="r">θ (deg)</th><th class="r">τ (MPa)</th><th class="r">σ top (MPa)</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>`;
  }

  const diagram = (id, title, unit, field) =>
    multiDiagramHtml(id, title, unit, xs, shown.map((r) => ({ id: r.id, name: r.name, style: comboStyle(mod, r.id), ys: r[field] })), result.nodeX);

  const EXT_HEAD = ["V max", "V min", "M sag", "M hog", "δ up", "δ down", "θ cw", "θ ccw", "τ max", "|σ| max"];
  const extHead = shown[0].extrema.map((e, k) => `<th class="r">${esc(EXT_HEAD[k] ?? e.label)} (${esc(e.unit)})</th>`).join("");
  const extRows = shown
    .map((r) => {
      const cells = r.extrema
        .map((e, k) => `<td class="num r pick${governing[k] === r ? " gov" : ""}" data-act="probe" data-x="${e.x}" title="x = ${esc(formatNum(e.x, 3))} m">${esc(formatNum(e.value, 3))}</td>`)
        .join("");
      return `<tr><td>${keyed(r)}</td><td class="muted">${esc(r.class)}</td>${cells}</tr>`;
    })
    .join("");

  const comboHead = shown.map((r) => `<th class="r">${keyed(r)}</th>`).join("");
  const reactRows = (part, only) =>
    result.reactions
      .filter((rx) => !only || only(rx))
      .map((rx) => {
        const vals = shown.map((r) => combinedReaction(rx, r.factors)[part]);
        const cells = vals.map((v) => `<td class="num r">${esc(formatNum(v, 3))}</td>`).join("");
        return `<tr class="clickable" data-act="probe" data-x="${rx.x}">
          <td class="num">${esc(formatNum(rx.x, 3))}</td><td>${esc(rx.support)}</td>${cells}
          <td class="num r">${esc(formatNum(Math.max(...vals), 3))}</td><td class="num r">${esc(formatNum(Math.min(...vals), 3))}</td>
        </tr>`;
      })
      .join("");
  const fixedRows = reactRows("M", (rx) => rx.support === "Fixed");
  const reactTable = (rows) => `<div class="scroll">
      <table class="data tight">
        <thead><tr><th>x (m)</th><th>Support</th>${comboHead}<th class="r">Max</th><th class="r">Min</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  const deflRows = shown
    .map((r) => {
      const dc = r.deflectionCheck;
      const gov = dc.spans.reduce((a, b) => (b.utilisation > (a?.utilisation ?? -1) ? b : a), null);
      const tone = dc.status === "PASS" ? "ok" : dc.status === "FAIL" ? "danger" : "muted";
      return `<tr${gov ? ` class="clickable" data-act="probe" data-x="${gov.peakX}"` : ""}>
        <td>${keyed(r)}</td><td class="muted">${esc(r.class)}</td><td class="nw">${esc(dc.governingLabel)}</td>
        <td class="num r">${esc(formatNum(gov ? gov.peakMm : 0, 3))}</td>
        <td class="num r">${esc(formatNum(dc.allowableMm, 2))}</td>
        <td class="num r">${esc(formatNum(dc.utilisation, 3))}</td>
        <td>${badge(dc.status, tone)}</td>
      </tr>`;
    })
    .join("");

  const sf = STATION_FIELDS.find((f) => f.value === ui.stationField) ?? STATION_FIELDS[1];
  const stRows = result.stations
    .map((s, i) => {
      const cells = shown.map((r) => `<td class="num r">${esc(formatNum(r[sf.value][i], sf.digits))}</td>`).join("");
      return `<tr class="clickable${probeOn(s.x) ? " on" : ""}" data-act="probe" data-x="${s.x}">
        <td class="num">${esc(formatNum(s.x, 3))}</td><td class="num">${s.elementIndex + 1}</td>
        <td class="muted">${s.side === "interior" ? "—" : esc(s.side)}</td>${cells}
      </tr>`;
    })
    .join("");

  const nHidden = result.comboResults.length - shown.length;
  const hiddenNote = nHidden
    ? `<p class="hint" style="margin:0;color:var(--color-warn)">${nHidden} combination${nHidden > 1 ? "s are" : " is"} hidden. The governing values below leave ${nHidden > 1 ? "them" : "it"} out.</p>`
    : "";
  return `<div class="space-y">
    ${bar}
    <div style="display:grid;gap:0.5rem">${hiddenNote}<div class="extrema">${cards}</div></div>
    ${pin}
    ${diagram("V", "Shear", "kN", "V")}
    ${diagram("M", "Bending moment (sagging +)", "kNm", "M")}
    ${diagram("v", "Deflection (up +)", "mm", "v")}
    ${diagram("slope", "Slope (clockwise +)", "deg", "slopeDeg")}
    ${diagram("tau", "Average shear stress", "MPa", "tau")}
    ${diagram("sigma", "Bending stress, top fibre", "MPa", "sigmaTop")}
    <section class="card">
      <h2>Extrema by combination</h2>
      <p class="hint">Highlighted values govern across the shown combinations — they are the values on the cards above. Click a value to pin its station.</p>
      <div class="scroll">
        <table class="data tight min-64">
          <thead><tr><th>Combination</th><th>Class</th>${extHead}</tr></thead>
          <tbody>${extRows}</tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>Support reactions — all combinations</h2>
      <p class="hint">Vertical reaction, kN, positive upward. Max and min are taken over the shown combinations.</p>
      ${reactTable(reactRows("V"))}
      ${fixedRows ? `<p class="hint" style="margin-top:1rem">Moment reaction at fixed supports, kNm, positive counter-clockwise.</p>${reactTable(fixedRows)}` : ""}
    </section>
    <section class="card">
      <div class="row-head">
        <div>
          <h2>Deflection check — all combinations</h2>
          <p class="hint">Each combination checked span by span against L / ${esc(formatNum(mod.deflectionLimitN, 0))}. Only unfactored serviceability combinations give a meaningful result; factored rows are listed for reference.</p>
        </div>
        <label class="label w-40">
          <span>Limit span / n</span>
          <input class="field" type="number" min="50" max="1000" data-act="patch" data-field="deflectionLimitN" value="${esc(inputValue(mod.deflectionLimitN, 0))}">
        </label>
      </div>
      <div class="scroll">
        <table class="data tight">
          <thead><tr><th>Combination</th><th>Class</th><th>Governing segment</th><th class="r">δ (mm)</th><th class="r">Allowable</th><th class="r">Util.</th><th>Status</th></tr></thead>
          <tbody>${deflRows}</tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <div class="row-head">
        <div>
          <h2>Station results — all combinations</h2>
          <p class="hint">${esc(sf.label)} at ${result.stations.length} stations × ${shown.length} combinations. Duplicate rows at a node are the left and right faces of a discontinuity. Click a row to pin.</p>
        </div>
        <label class="label w-52">
          <span>Quantity</span>
          <select class="sel sm" data-act="station-field">${options(STATION_FIELDS.map((f) => ({ value: f.value, label: f.label })), sf.value)}</select>
        </label>
      </div>
      <div class="scroll-y">
        <table class="data tight">
          <thead class="sticky"><tr><th>x (m)</th><th>El</th><th>Face</th>${comboHead}</tr></thead>
          <tbody>${stRows}</tbody>
        </table>
      </div>
    </section>
  </div>`;
}

function renderResults(mod, result) {
  const combos = activeCombos(mod);
  const V = seriesFrom(result, "V");
  const M = seriesFrom(result, "M");
  const v = seriesFrom(result, "v");
  const slope = seriesFrom(result, "slopeDeg");
  const tau = seriesFrom(result, "tau");
  const sigma = seriesFrom(result, "sigmaTop");
  const dc = result.deflectionCheck;
  const cards = result.selected.extrema
    .map((e) => {
      const on = ui.probeX != null && Math.abs(e.x - ui.probeX) < 1e-9 ? " on" : "";
      return `<button class="ext-card${on}" type="button" data-act="probe" data-x="${e.x}">
        <p class="k">${esc(e.label)}</p>
        <p class="v">${esc(formatNum(e.value, 3))}<span>${esc(e.unit)}</span></p>
        <p class="x">x = ${esc(formatNum(e.x, 3))} m · ${esc(e.combination)}</p>
      </button>`;
    })
    .join("");

  let pin = `<p class="hint">Click a diagram or extrema card to pin a station.</p>`;
  if (ui.probeX != null && result.stations.length) {
    let best = Infinity;
    for (const s of result.stations) best = Math.min(best, Math.abs(s.x - ui.probeX));
    const bits = result.stations
      .map((s, i) => ({ s, i }))
      .filter(({ s }) => Math.abs(s.x - ui.probeX) <= best + 1e-12)
      .map(({ s, i }) => {
        const face = s.side !== "interior" ? ` · ${s.side}` : "";
        return `<span>V ${esc(formatNum(result.selected.V[i], 3))} kN · M ${esc(formatNum(result.selected.M[i], 3))} kNm · δ ${esc(formatNum(result.selected.v[i], 3))} mm${esc(face)}</span>`;
      })
      .join("");
    pin = `<div class="pinbar"><p class="vals">Pinned x = ${esc(formatNum(ui.probeX, 3))} m${bits}</p><button class="btn ghost" type="button" data-act="clear-probe">Clear pin</button></div>`;
  }

  const reactRows = result.reactions
    .map((r) => {
      const { V: Vv, M: Mv } = combinedReaction(r, result.selected.factors);
      return `<tr class="clickable" data-act="probe" data-x="${r.x}">
        <td class="num">${esc(formatNum(r.x, 3))}</td>
        <td>${esc(r.support)}</td>
        <td class="num">${esc(formatNum(Vv, 4))}</td>
        <td class="num">${esc(formatNum(Mv, 4))}</td>
      </tr>`;
    })
    .join("");

  const envRows = result.envelope
    .map(
      (e) => `<tr class="clickable" data-act="probe" data-x="${e.x}">
        <td>${esc(e.label)}</td>
        <td class="num nw">${esc(formatNum(e.value, 3))} ${esc(e.unit)}</td>
        <td class="num">${esc(formatNum(e.x, 3))}</td>
        <td>${esc(e.governing)}</td>
      </tr>`,
    )
    .join("");

  const stRows = result.stations
    .map((s, i) => {
      const on = ui.probeX != null && Math.abs(s.x - ui.probeX) < 1e-9 ? " on" : "";
      return `<tr class="clickable${on}" data-act="probe" data-x="${s.x}">
        <td class="num">${esc(formatNum(s.x, 3))}</td>
        <td class="num">${s.elementIndex + 1}</td>
        <td class="muted">${s.side === "interior" ? "—" : esc(s.side)}</td>
        <td class="num">${esc(formatNum(result.selected.V[i], 3))}</td>
        <td class="num">${esc(formatNum(result.selected.M[i], 3))}</td>
        <td class="num">${esc(formatNum(result.selected.v[i], 3))}</td>
        <td class="num">${esc(formatNum(result.selected.slopeDeg[i], 4))}</td>
        <td class="num">${esc(formatNum(result.selected.tau[i], 3))}</td>
        <td class="num">${esc(formatNum(result.selected.sigmaTop[i], 3))}</td>
      </tr>`;
    })
    .join("");

  const dcTone = dc.status === "PASS" ? "ok" : dc.status === "FAIL" ? "danger" : "muted";

  const deflRows = (dc.spans ?? [])
    .map((s) => {
      const gov = s === dc.spans.reduce((a, b) => (b.utilisation > (a?.utilisation ?? -1) ? b : a), null);
      return `<tr class="clickable${gov ? " on" : ""}" data-act="probe" data-x="${s.peakX}">
        <td>${esc(s.kind)} ${esc(formatNum(s.x0, 2))}–${esc(formatNum(s.x1, 2))}</td>
        <td class="num">${esc(formatNum(s.length, 3))}</td>
        <td class="num">${esc(formatNum(s.peakMm, 3))}</td>
        <td class="num">${esc(formatNum(s.allowableMm, 2))}</td>
        <td class="num">${esc(formatNum(s.utilisation, 3))}</td>
      </tr>`;
    })
    .join("");

  return `<div class="space-y">
    ${viewBar(mod, result)}
    <div class="extrema">${cards}</div>
    ${pin}
    ${forceDiagramHtml("V", "Shear", "kN", "var(--color-shear)", V, result.nodeX, envelopeTrace(result.stations, combos, "V", "max"), envelopeTrace(result.stations, combos, "V", "min"))}
    ${forceDiagramHtml("M", "Bending moment (sagging +)", "kNm", "var(--color-moment)", M, result.nodeX, envelopeTrace(result.stations, combos, "M", "max"), envelopeTrace(result.stations, combos, "M", "min"))}
    ${forceDiagramHtml("v", "Deflection (up +)", "mm", "var(--color-defl)", v, result.nodeX, envelopeTrace(result.stations, combos, "v", "max"), envelopeTrace(result.stations, combos, "v", "min"))}
    ${forceDiagramHtml("slope", "Slope (clockwise +)", "deg", "var(--color-accent)", slope, result.nodeX)}
    ${forceDiagramHtml("tau", "Average shear stress", "MPa", "var(--color-shear)", tau, result.nodeX)}
    ${forceDiagramHtml("sigma", "Bending stress, top fibre", "MPa", "var(--color-moment)", sigma, result.nodeX)}
    <div class="split-2">
      <section class="card">
        <h2>Support reactions — ${esc(result.selected.name)}</h2>
        <p class="hint">Vertical positive upward. Moment positive counter-clockwise.</p>
        <div class="scroll">
          <table class="data">
            <thead><tr><th>x (m)</th><th>Support</th><th>V (kN)</th><th>M (kNm)</th></tr></thead>
            <tbody>${reactRows}</tbody>
          </table>
        </div>
      </section>
      <section class="card">
        <div class="row-head">
          <h2>Deflection check</h2>
          ${badge(dc.status, dcTone)}
        </div>
        <p class="hint">Each span between consecutive vertical supports is checked against its own length. Overhangs are checked separately against the overhang length — confirm that convention suits the project. Deflections are those of the selected combination, so select an unfactored serviceability combination for this check to mean anything.</p>
        <label class="label w-40" style="margin-top:1rem">
          <span>Limit span / n</span>
          <input class="field" type="number" min="50" max="1000" data-act="patch" data-field="deflectionLimitN" value="${esc(inputValue(mod.deflectionLimitN, 0))}">
        </label>
        <div class="scroll">
          <table class="data tight">
            <thead><tr><th>Segment</th><th>L (m)</th><th>δ (mm)</th><th>Allowable</th><th>Util.</th></tr></thead>
            <tbody>${deflRows}</tbody>
          </table>
        </div>
        <p class="mono-note">Governing: ${esc(dc.governingLabel)} · utilisation ${esc(formatNum(dc.utilisation, 3))}</p>
      </section>
    </div>
    <section class="card">
      <h2>All-combination envelope</h2>
      <p class="hint">Maxima and minima of every non-zero combination at every station. Faint traces on shear, moment and deflection.</p>
      <div class="scroll">
        <table class="data">
          <thead><tr><th>Result</th><th>Value</th><th>x (m)</th><th>Governing</th></tr></thead>
          <tbody>${envRows}</tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>Station results — ${esc(result.selected.name)}</h2>
      <p class="hint">${result.stations.length} stations. Duplicate rows at a node are the left and right faces of a discontinuity. Click a row to pin.</p>
      <div class="scroll-y">
        <table class="data min-48 tight">
          <thead class="sticky"><tr>
            <th>x (m)</th><th>El</th><th>Face</th><th>V (kN)</th><th>M (kNm)</th><th>δ (mm)</th><th>θ (deg)</th><th>τ (MPa)</th><th>σ top (MPa)</th>
          </tr></thead>
          <tbody>${stRows}</tbody>
        </table>
      </div>
    </section>
  </div>`;
}

function renderQa(mod, result) {
  const tone = result.status === "OK" ? "ok" : "danger";
  const viewRow = isAllView(mod)
    ? `<div class="status-row"><dt>Result view</dt><dd><span class="mono-note" style="margin:0;color:var(--color-fg)">All combinations · ${shownComboResults(mod, result).length} of ${result.comboResults.length} shown</span></dd></div>`
    : "";
  const invalid = result.invalidLoads.length
    ? `<ul class="warn-list">${result.invalidLoads.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`
    : "";
  const warns = result.warnings.length
    ? `<ul class="warn-list">${result.warnings.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`
    : "";
  const eqRows = result.equilibrium
    .map(
      (row) => `<tr>
        <td class="mono">${esc(row.case)}</td>
        <td class="num">${esc(formatNum(row.applied, 4))}</td>
        <td class="num">${esc(formatNum(row.reactions, 4))}</td>
        <td class="num">${esc(formatNum(row.residual, 6))}</td>
        <td>${badge(row.ok ? "PASS" : "CHECK", row.ok ? "ok" : "danger")}</td>
      </tr>`,
    )
    .join("");
  const contRows = result.continuity
    .map(
      (c) => `<tr>
        <td class="mono">${c.element}</td>
        <td class="num">${esc(formatNum(c.diffMm, 9))}</td>
        <td>${badge(c.ok ? "PASS" : "CHECK", c.ok ? "ok" : "danger")}</td>
      </tr>`,
    )
    .join("");
  return `<div class="qa-grid">
    <section class="card">
      <h2>Engine status</h2>
      <dl class="status-rows">
        <div class="status-row"><dt>Overall</dt><dd>${badge(result.status, tone)}</dd></div>
        <div class="status-row"><dt>Solver ready</dt><dd>${badge(result.solverReady ? "True" : "False", result.solverReady ? "ok" : "danger")}</dd></div>
        <div class="status-row"><dt>Support stability</dt><dd>${badge(result.supportStable ? "True" : "False", result.supportStable ? "ok" : "danger")}</dd></div>
        <div class="status-row"><dt>Invalid active loads</dt><dd>${badge(String(result.invalidLoads.length), result.invalidLoads.length ? "warn" : "ok")}</dd></div>
        <div class="status-row"><dt>Selected combination</dt><dd><span class="mono-note" style="margin:0;color:var(--color-fg)">${esc(result.selected.name)}</span></dd></div>
        ${viewRow}
      </dl>
      ${invalid}${warns}
    </section>
    <section class="card">
      <h2>Vertical equilibrium by load case</h2>
      <p class="hint">Applied FEA vertical load (up positive) versus support reactions.</p>
      <div class="scroll">
        <table class="data">
          <thead><tr><th>Case</th><th>Applied (kN)</th><th>Reactions (kN)</th><th>Residual</th><th>Status</th></tr></thead>
          <tbody>${eqRows}</tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>Element-end displacement continuity</h2>
      <p class="hint">Recovered Macaulay deflection at the right end of each element versus the nodal DOF.</p>
      <div class="scroll">
        <table class="data">
          <thead><tr><th>Element</th><th>Right-end difference (mm)</th><th>Status</th></tr></thead>
          <tbody>${contRows}</tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>Sign conventions</h2>
      <ul class="sign-list">
        <li>Solver: vertical displacement up positive, rotation counter-clockwise positive.</li>
        <li>Point loads and UDLs: downward positive in the input. Equivalent nodal loads reverse that into the FEA sign.</li>
        <li>Point moments: counter-clockwise positive.</li>
        <li>Bending moment: sagging positive (tension on the bottom fibre).</li>
        <li>Slope diagrams: clockwise positive (= −θ_ccw · 180/π).</li>
        <li>Support reactions: vertical upward positive, moment counter-clockwise positive.</li>
        <li>Top-fibre stress: −M/Z. Bottom-fibre stress: +M/Z.</li>
      </ul>
    </section>
    <section class="card span-2">
      <h2>Scope and limitations</h2>
      <ul class="scope-list">
        <li>Linear-elastic Euler–Bernoulli beam finite-element analysis. No shear deformation in the stiffness.</li>
        <li>Capacity: up to 24 sequential elements and 25 nodes. Supports: Free, Pinned, Roller, Fixed.</li>
        <li>Interior point loads, moments and partial UDLs recovered with equivalent nodal loading and exact Macaulay terms.</li>
        <li>No plasticity, second-order effects, lateral-torsional buckling, or uplift/contact nonlinearity.</li>
        <li>Beam library: beams.json in the ${esc(BEAM_REPO.owner)}/${esc(BEAM_REPO.repo)} GitHub repository, maintained on the Beams tab. Calculated properties are nominal gross-section values. Verify against the project-approved source before design use.</li>
        <li>Deflection is checked on each span between consecutive vertical supports, and on each overhang, against that segment's own length.</li>
        <li>Combination factors remain the user’s design-basis responsibility.</li>
      </ul>
    </section>
  </div>`;
}

function panelHtml(mod, result) {
  if (ui.tab === "geometry") return renderGeometry(mod, result);
  if (ui.tab === "beams") return renderBeams(mod);
  if (ui.tab === "loads") return renderLoads(mod, result);
  if (ui.tab === "combos") return renderCombos(mod);
  if (ui.tab === "qa") return renderQa(mod, result);
  return isAllView(mod) ? renderResultsAll(mod, result) : renderResults(mod, result);
}

function loadLegend(mod, result) {
  const loads = mod.loads.filter((l) => l.active && Number.isFinite(l.magnitude) && l.magnitude !== 0);
  if (!loads.length) return "";
  const items = loads
    .map((ld) => {
      const u = ld.type === "UDL" ? " kN/m" : ld.type === "Moment" ? " kNm" : " kN";
      return `<span>${esc(ld.id)} ${esc(ld.case)} ${esc(ld.type)} ${esc(formatNum(ld.magnitude, 3))}${u}</span>`;
    })
    .join("");
  const rxNote = isAllView(mod) ? "Reactions ↑ kN under supports: max over min of the shown combinations" : "Reactions ↑ kN under supports";
  const rx = result.reactions.length ? `<span class="subtle">${rxNote}</span>` : "";
  return `<div class="load-legend">${items}${rx}</div>`;
}

function statusTone(result) {
  if (result.status === "OK") return "ok";
  if (result.ok) return "warn";
  return "danger";
}

function factorsText(factors) {
  const bits = LOAD_CASES.filter((k) => (factors[k] ?? 0) !== 0).map((k) => `${formatNum(factors[k], 2)} ${k}`);
  return bits.join(" + ") || "zero factors";
}

function factorsLine(result) {
  return factorsText(result.selected.factors);
}

const FOCUS_ATTRS = ["data-act", "data-id", "data-view", "data-show", "data-tab", "data-preset", "data-field", "data-index", "data-factor", "data-x", "data-name"];

// render() replaces every element, which would drop keyboard focus to the top of the page.
// Buttons, selects and checkboxes keep focus while they act, so put it back on their
// replacement. Text fields are left alone: they commit on blur, when focus is already moving.
// Controls can share every attribute (the two combination selects, extrema cards at the same
// x), so the position among identical controls is part of the key.
function sameControls(key) {
  return [...document.querySelectorAll("[data-act]")].filter((el) => FOCUS_ATTRS.every((a, i) => el.getAttribute(a) === key[i]));
}

function focusedControl(anyField = false) {
  const el = document.activeElement;
  if (!el || !el.hasAttribute?.("data-act")) return null;
  if (!anyField && !(el.tagName === "BUTTON" || el.tagName === "A" || el.tagName === "SELECT" || (el.tagName === "INPUT" && el.type === "checkbox"))) return null;
  const key = FOCUS_ATTRS.map((a) => el.getAttribute(a));
  return { key, index: sameControls(key).indexOf(el) };
}

function restoreFocus(focus) {
  if (!focus) return;
  const matches = sameControls(focus.key);
  (matches[focus.index] ?? matches[0])?.focus({ preventScroll: true });
}

// Library messages are spoken through one live region that is never rebuilt; a region created
// together with its text is not announced, and one rebuilt on every render repeats itself.
// Once per message: re-rendering never repeats it, while a new message with the same text (a
// second paste, a second edit) is announced again by clearing the region first.
function announce(msg) {
  const el = document.getElementById("sr-status");
  if (!el || msg === ui.announced) return;
  ui.announced = msg;
  const text = msg?.text || "";
  if (el.textContent !== text) el.textContent = text;
  else if (text) {
    el.textContent = "";
    setTimeout(() => {
      if (ui.announced === msg) el.textContent = text;
    }, 60);
  }
}

function metaHtml(result) {
  const viewMeta = isAllView(model) ? `${shownComboResults(model, result).length} of ${result.comboResults.length} combinations shown` : factorsLine(result);
  return `${result.nElements} elements · ${esc(formatNum(result.totalLength, 3))} m · E = ${esc(formatNum(result.E, 0))} MPa · default section ${esc(model.defaultSection)}, ${result.defaultI === null ? "not found" : `I = ${esc(formatNum(result.defaultI, 0))} mm⁴`} · ${esc(viewMeta)}`;
}

function bindDiagrams(result) {
  const catalog = {
    V: { points: seriesFrom(result, "V"), unit: "kN" },
    M: { points: seriesFrom(result, "M"), unit: "kNm" },
    v: { points: seriesFrom(result, "v"), unit: "mm" },
    slope: { points: seriesFrom(result, "slopeDeg"), unit: "deg" },
    tau: { points: seriesFrom(result, "tau"), unit: "MPa" },
    sigma: { points: seriesFrom(result, "sigmaTop"), unit: "MPa" },
  };
  document.querySelectorAll("[data-diagram-svg]").forEach((svg) => {
    const id = svg.getAttribute("data-diagram-svg");
    const spec = catalog[id];
    if (!spec || !spec.points.length) return;
    const padL = 52;
    const padR = 16;
    const L = Math.max(spec.points[spec.points.length - 1].x, 1e-6);
    const pick = (ev) => {
      const innerW = viewBoxSize(svg).W - padL - padR;
      const x = ((svgPointerX(svg, ev) - padL) / innerW) * L;
      if (x < 0 || x > L) return null;
      return nearest(spec.points, x);
    };
    svg.addEventListener("mousemove", (ev) => {
      const p = pick(ev);
      ui.hover[id] = p ? { x: p.x, y: p.y } : null;
      const read = svg.closest(".diagram")?.querySelector("[data-readout]");
      if (read && p) read.textContent = `x ${formatNum(p.x, 3)} m · ${formatNum(p.y, 3)} ${spec.unit}`;
    });
    svg.addEventListener("mouseleave", () => {
      ui.hover[id] = null;
    });
    svg.addEventListener("click", (ev) => {
      const p = pick(ev);
      if (p) {
        ui.probeX = p.x;
        renderInPlace(svg);
      }
    });
  });
}

function bindMultiDiagrams(result) {
  const shown = shownComboResults(model, result);
  const xs = result.stations.map((s) => s.x);
  const tip = document.getElementById("mtip");
  if (!shown.length || !xs.length || !tip) return;
  const fields = {
    V: { field: "V", unit: "kN", digits: 3 },
    M: { field: "M", unit: "kNm", digits: 3 },
    v: { field: "v", unit: "mm", digits: 3 },
    slope: { field: "slopeDeg", unit: "deg", digits: 4 },
    tau: { field: "tau", unit: "MPa", digits: 3 },
    sigma: { field: "sigmaTop", unit: "MPa", digits: 3 },
  };
  const L = Math.max(xs[xs.length - 1], 1e-6);
  document.querySelectorAll(".diagram.multi [data-diagram-svg]").forEach((svg) => {
    const spec = fields[svg.getAttribute("data-diagram-svg")];
    if (!spec) return;
    // Padding must match multiDiagramHtml. Width and crosshair are looked up per event: a
    // resize across the phone breakpoint redraws the inside of this svg.
    const padL = 52;
    const innerW = () => viewBoxSize(svg).W - padL - 16;
    const pick = (ev) => {
      const x = ((svgPointerX(svg, ev) - padL) / innerW()) * L;
      return x < 0 || x > L ? null : nearestIndex(xs, x);
    };
    const hide = () => {
      tip.hidden = true;
      svg.querySelector("[data-cross]")?.setAttribute("visibility", "hidden");
    };
    svg.addEventListener("mousemove", (ev) => {
      const i = pick(ev);
      if (i == null) return hide();
      const cross = svg.querySelector("[data-cross]");
      const px = (padL + (xs[i] / L) * innerW()).toFixed(1);
      cross?.setAttribute("x1", px);
      cross?.setAttribute("x2", px);
      cross?.setAttribute("visibility", "visible");
      // Every shown combination at this station, largest first. Names are user input, so
      // they go in through textContent.
      const head = document.createElement("p");
      head.className = "t";
      head.textContent = `x = ${formatNum(xs[i], 3)} m · ${spec.unit}`;
      const rows = shown
        .map((r) => ({ r, y: r[spec.field][i] }))
        .sort((a, b) => b.y - a.y)
        .map(({ r, y }) => {
          const row = document.createElement("p");
          row.className = "r";
          row.innerHTML = comboKey(comboStyle(model, r.id));
          const val = document.createElement("b");
          val.textContent = formatNum(y, spec.digits);
          const name = document.createElement("span");
          name.textContent = r.name;
          row.append(val, name);
          return row;
        });
      tip.replaceChildren(head, ...rows);
      tip.hidden = false;
      const tw = tip.offsetWidth;
      const th = tip.offsetHeight;
      let left = ev.clientX + 16;
      if (left + tw > window.innerWidth - 8) left = ev.clientX - tw - 16;
      const top = Math.min(Math.max(8, ev.clientY - th / 2), window.innerHeight - th - 8);
      tip.style.left = `${Math.max(8, left)}px`;
      tip.style.top = `${Math.max(8, top)}px`;
    });
    svg.addEventListener("mouseleave", hide);
    svg.addEventListener("click", (ev) => {
      const i = pick(ev);
      if (i != null) {
        ui.probeX = xs[i];
        renderInPlace(svg);
      }
    });
  });
  // Hovering or focusing a legend chip picks that combination out on every diagram.
  const highlight = (id) => {
    document.querySelectorAll(".diagram.multi").forEach((d) => {
      d.classList.toggle("has-hl", id != null);
      d.querySelectorAll(".series").forEach((p) => p.classList.toggle("hl", p.getAttribute("data-combo") === id));
    });
  };
  document.querySelectorAll('[data-act="toggle-combo"][aria-pressed="true"]').forEach((chip) => {
    const id = chip.getAttribute("data-id");
    chip.addEventListener("mouseenter", () => highlight(id));
    chip.addEventListener("mouseleave", () => highlight(null));
    chip.addEventListener("focus", () => highlight(id));
    chip.addEventListener("blur", () => highlight(null));
  });
}

// "custom" in any capitals, or no name, is the model's own section: written "Custom", as the
// selects show it.
function withCustomNames(m) {
  const fix = (n) => (isCustomName(n) ? "Custom" : n);
  return {
    ...m,
    defaultSection: fix(m.defaultSection),
    // An element section that is empty or null follows the default section (analyze uses
    // section || defaultSection); only a written "custom" is rewritten.
    elements: Array.isArray(m.elements) ? m.elements.map((el) => (el && typeof el.section === "string" && el.section.trim() !== "" && isCustomName(el.section) && el.section !== "Custom" ? { ...el, section: "Custom" } : el)) : m.elements,
  };
}

function setModel(next) {
  // Presets, and files saved before the all-combinations view existed, carry no view
  // settings; keep the ones in use rather than dropping back to a single combination.
  next = withUniqueComboIds({ comboView: model.comboView, hiddenComboIds: model.hiddenComboIds, ...next });
  model = syncSectionDefs(resizeElements(withCustomNames(next), next.nElements));
  persist();
  ui.probeX = null;
  render();
}

function patch(partial) {
  let next = { ...model, ...partial };
  if (partial.nElements !== undefined) next = resizeElements(next, partial.nElements);
  model = syncSectionDefs(next);
  persist();
  render();
}

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function downloadBlob(content, type, name) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function exportJson() {
  downloadBlob(JSON.stringify(model, null, 2), "application/json", "cba-model.json");
}

function exportCsv() {
  const result = analyze(model);
  if (isAllView(model)) {
    // Long format, one block of stations per shown combination. Element and face tell apart
    // the two rows that share an x at a node, so (combination, element, face, x) is unique.
    const lines = ["combination,x_m,element,face,V_kN,M_kNm,defl_mm,slope_deg,tau_MPa,sigma_top_MPa,sigma_bot_MPa"];
    for (const r of shownComboResults(model, result)) {
      const name = `"${String(r.name).replace(/"/g, '""')}"`;
      for (let i = 0; i < result.stations.length; i++) {
        const s = result.stations[i];
        lines.push([name, s.x, s.elementIndex + 1, s.side, r.V[i], r.M[i], r.v[i], r.slopeDeg[i], r.tau[i], r.sigmaTop[i], r.sigmaBot[i]].join(","));
      }
    }
    downloadBlob(lines.join("\n"), "text/csv", "cba-all-combinations.csv");
    return;
  }
  const lines = ["x_m,V_kN,M_kNm,defl_mm,slope_deg,tau_MPa,sigma_top_MPa,sigma_bot_MPa"];
  for (let i = 0; i < result.stations.length; i++) {
    lines.push(
      [
        result.stations[i].x,
        result.selected.V[i],
        result.selected.M[i],
        result.selected.v[i],
        result.selected.slopeDeg[i],
        result.selected.tau[i],
        result.selected.sigmaTop[i],
        result.selected.sigmaBot[i],
      ].join(","),
    );
  }
  downloadBlob(lines.join("\n"), "text/csv", `cba-${result.selected.name.replace(/\s+/g, "_")}.csv`);
}

function importJsonFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (parsed && Array.isArray(parsed.elements)) setModel(parsed);
    } catch {
      /* ignore */
    }
  };
  reader.readAsText(file);
}

function setDefaultSection(name) {
  const els = model.elements.map((el) => (el.section === model.defaultSection ? { ...el, section: name } : el));
  patch({ defaultSection: name, elements: els });
}

function showBeamForm() {
  render();
  const form = document.getElementById("beam-form");
  form?.scrollIntoView?.({ block: "start", behavior: "smooth" });
  form?.querySelector('[data-act="beam-dim"], [data-act="beam-prop"]')?.focus({ preventScroll: true });
}

// After an action removes or disables the control that had keyboard focus (a deleted row, a
// closed form, "Use" turning into "Default"), focus moves to a nearby control instead of
// dropping to the top of the page.
function focusIfLost(act, name) {
  focusFirst([act, name]);
}
// The first of the candidates ([act, name?]) that exists and can take focus, if focus was lost.
function focusFirst(...candidates) {
  for (const [act, name] of candidates) {
    const a = document.activeElement;
    if (a && a !== document.body) return;
    const el = [...document.querySelectorAll(`[data-act="${act}"]`)].find((x) => !x.disabled && (name === undefined || x.getAttribute("data-name") === name));
    el?.focus({ preventScroll: true });
  }
}

function onBeamClick(act, t) {
  const name = t.getAttribute("data-name");
  const d = ui.beamDraft;
  if (act === "new-beam") {
    ui.tab = "beams";
    ui.beamDraft = newBeamDraft(null);
    showBeamForm();
  } else if (act === "beam-add-named") {
    // A section the model uses but nobody has: open the form under its name, cleaned up so the
    // form can accept it, and point the model at the beam once added (repoint).
    ui.tab = "beams";
    const clean = String(name).trim().slice(0, BEAM_NAME_MAX).trim();
    ui.beamDraft = { ...newBeamDraft(null), name: clean, nameTouched: true, repoint: name };
    showBeamForm();
  } else if (act === "beam-edit") {
    ui.beamDraft = newBeamDraft(name);
    showBeamForm();
  } else if (act === "beam-cancel") {
    const from = d?.from;
    ui.beamDraft = null;
    render();
    if (from) focusIfLost("beam-edit", from);
    focusIfLost("new-beam");
  } else if (act === "beam-suggest-name") {
    if (!d) return true;
    d.nameTouched = false;
    d.name = suggestBeamName(d.shape, d.dims);
    const input = document.querySelector('#beam-form [data-act="beam-text"][data-field="name"]');
    if (input) input.value = d.name;
    updateBeamForm();
  } else if (act === "beam-submit") {
    if (!d) return true;
    const res = draftResult(d);
    if (!res.beam) {
      updateBeamForm();
      return true;
    }
    const op = d.mode === "edit" ? { op: "upsert", from: d.from, beam: res.beam, base: d.base } : { op: "upsert", beam: res.beam };
    const renames = d.mode === "edit" ? [[d.from, res.beam.name]] : d.repoint && d.repoint !== res.beam.name ? [[d.repoint, res.beam.name]] : [];
    commitBeamOps([op], renames);
    lib.message = { tone: "ok", text: `${res.beam.name} ${d.mode === "edit" ? "updated" : "added"} in this browser. Press "Save to GitHub" to share it.` };
    ui.beamDraft = null;
    render();
    focusIfLost("beam-edit", res.beam.name);
  } else if (act === "beam-delete") {
    if (ui.confirmDelete !== name) {
      ui.confirmDelete = name;
      render();
      return true;
    }
    ui.confirmDelete = null;
    const used = sectionNamesUsed(model).includes(name);
    commitBeamOps([{ op: "delete", name }]);
    if (d?.from === name) ui.beamDraft = null;
    lib.message = { tone: "ok", text: `${name} deleted in this browser.${used ? " The current model keeps its copy of the properties." : ""} Press "Save to GitHub" to delete it for everyone.` };
    render();
    focusIfLost("new-beam");
  } else if (act === "beam-restore") {
    const b = lib.base.beams.find((x) => x.name === name);
    const taken = b ? effectiveBeams().find((x) => lower(x.name) === lower(name) && x.name !== name) : null;
    if (taken) {
      // Restoring would replace the newer beam that now has this name in other capitals.
      lib.message = { tone: "warn", text: `Can't undo: "${taken.name}" now uses that name. Rename or delete "${taken.name}" first.` };
    } else if (b) {
      commitBeamOps([{ op: "upsert", beam: b }]);
    }
    render();
    focusIfLost("beam-edit", name);
    focusIfLost("new-beam");
  } else if (act === "beam-use") {
    lib.message = { tone: "ok", text: `${name} is now the model's default section.` };
    setDefaultSection(name);
    focusIfLost("beam-edit", name);
  } else if (act === "beams-discard") {
    if (lib.saving) return true;
    if (!ui.confirmDiscard) {
      ui.confirmDiscard = true;
      render();
      return true;
    }
    ui.confirmDiscard = false;
    // The model's saved copies of the discarded beams go back to GitHub's values too.
    const diff = pendingDiff();
    const touched = new Set([...diff.added, ...diff.changed, ...diff.removed]);
    lib.pending = [];
    lib.editSeq++;
    persistLibrary();
    applyLibrary(touched, true);
    lib.message = { tone: "muted", text: "Local changes discarded. The library matches GitHub." };
    render();
    focusIfLost("new-beam");
  } else if (act === "conflict-theirs" || act === "conflict-mine") {
    const ops = lib.pending.filter((op) => lower(opName(op)) === lower(name));
    noteTouched(ops.map(opName));
    if (act === "conflict-theirs") {
      lib.pending = lib.pending.filter((op) => !ops.includes(op));
      lib.message = { tone: "muted", text: `Kept GitHub's version of ${name}.` };
    } else {
      // Now based on GitHub's current version, so saving replaces it with this one.
      for (const op of ops) op.base = beamNamed(lib.base.beams, opName(op));
      lib.message = { tone: "muted", text: `Kept your version of ${name}. Press "Save to GitHub" to replace GitHub's.` };
    }
    lib.editSeq++;
    compactPending();
    persistLibrary();
    applyLibrary(act === "conflict-theirs" ? new Set(ops.map(opName)) : null, true);
    render();
    // The next choice to make, or Save once none are left.
    focusFirst([act], ["conflict-mine"], ["beams-save"], ["new-beam"]);
  } else if (act === "sections-accept") {
    const names = staleSectionNames(model);
    applyLibrary(new Set(names), true);
    lib.message = { tone: "ok", text: `The model now keeps the library's values for ${names.join(", ")}.` };
    render();
    focusIfLost("new-beam");
  } else if (act === "beam-respell") {
    const libName = beamNamed(effectiveBeams(), name)?.name;
    if (libName && libName !== name) {
      setModelQuietly(syncSectionDefs(renameModelSections(model, [[name, libName]])));
      lib.message = { tone: "ok", text: `The model now uses the library's ${libName}.` };
    }
    render();
    focusIfLost("new-beam");
  } else if (act === "beams-reload") {
    loadLibrary();
  } else if (act === "beams-save") {
    saveLibraryToGitHub();
  } else if (act === "beams-download") {
    downloadBeamFile();
  } else if (act === "gh-forget") {
    lib.token = "";
    lib.remember = false;
    storageSet(GH_TOKEN_KEY, null);
    render();
    focusIfLost("gh-token");
  } else if (act === "copies-remove") {
    // Saved copies the model no longer uses (see syncSectionDefs) are dropped on request.
    const used = new Set(sectionNamesUsed(model));
    const defs = Object.fromEntries(Object.entries(model.sectionDefs || {}).filter(([n]) => used.has(n)));
    const gone = Object.keys(model.sectionDefs || {}).filter((n) => !used.has(n));
    setModelQuietly({ ...model, sectionDefs: defs });
    lib.message = { tone: "ok", text: `Removed the unused saved ${gone.length === 1 ? "copy" : "copies"} of ${gone.join(", ")} from this model.` };
    render();
    focusIfLost("new-beam");
  } else if (act === "beams-from-model") {
    // The sections the note lists: used by the model, saved with it, and not in the library
    // under any capitalisation.
    const beams = effectiveBeams();
    const ops = modelOnlySections(model)
      .filter((n) => !beamNamed(beams, n))
      .map((n) => normaliseBeam({ ...model.sectionDefs[n], name: n }))
      .filter(Boolean)
      .map((beam) => ({ op: "upsert", beam }));
    commitBeamOps(ops);
    lib.message = { tone: "ok", text: `${ops.length} section${ops.length === 1 ? "" : "s"} from this model added in this browser. Press "Save to GitHub" to share ${ops.length === 1 ? "it" : "them"}.` };
    render();
    focusIfLost("new-beam");
  } else if (act === "paste-toggle") {
    ui.pasteOpen = !ui.pasteOpen;
    ui.pasteResult = null;
    render();
  } else if (act === "paste-check") {
    ui.pasteResult = parseBeamTable(ui.pasteText, ui.pasteUnits, ui.pasteMaterial);
    render();
  } else if (act === "paste-apply") {
    const r = ui.pasteResult;
    if (!r?.beams.length) return true;
    const existing = new Map(effectiveBeams().map((b) => [b.name.toLowerCase(), b.name]));
    const renames = [];
    const ops = r.beams.map((beam) => {
      const from = existing.get(beam.name.toLowerCase());
      if (from && from !== beam.name) renames.push([from, beam.name]);
      return from ? { op: "upsert", from, beam } : { op: "upsert", beam };
    });
    commitBeamOps(ops, renames);
    lib.message = { tone: "ok", text: `${ops.length} beam${ops.length === 1 ? "" : "s"} added in this browser. Press "Save to GitHub" to share ${ops.length === 1 ? "it" : "them"}.` };
    ui.pasteResult = null;
    ui.pasteText = "";
    ui.pasteOpen = false;
    render();
    focusFirst(["paste-toggle"], ["new-beam"]);
  } else {
    return false;
  }
  return true;
}

// Two-step confirmations (Delete, Discard) lapse as soon as anything else is clicked, changed or
// typed. Returns whether one was armed, so its button can be redrawn.
function lapseConfirmations(act) {
  const lapsed = (ui.confirmDelete !== null && act !== "beam-delete") || (ui.confirmDiscard && act !== "beams-discard");
  if (act !== "beam-delete") ui.confirmDelete = null;
  if (act !== "beams-discard") ui.confirmDiscard = false;
  return lapsed;
}

function onClick(ev) {
  const t = ev.target.closest("[data-act]");
  const act = t ? t.getAttribute("data-act") : null;
  const lapsed = lapseConfirmations(act);
  const renders = ui.renderCount;
  if (t) handleClick(ev, t, act);
  if (lapsed && ui.renderCount === renders) renderWhenIdle();
}

function handleClick(ev, t, act) {
  if (onBeamClick(act, t)) return;
  if (act === "tab") {
    ui.tab = t.getAttribute("data-tab");
    render();
  } else if (act === "preset") {
    const p = t.getAttribute("data-preset");
    setModel(p === "three" ? simpleThreeSpan() : excelExample());
  } else if (act === "import") {
    document.getElementById("import-file")?.click();
  } else if (act === "export-json") {
    exportJson();
  } else if (act === "export-csv") {
    exportCsv();
  } else if (act === "add-span") {
    patch({ nElements: Math.min(24, model.nElements + 1) });
  } else if (act === "add-load") {
    const loads = model.loads.slice();
    loads.push({ ...blankLoad(loads.length + 1), active: true });
    patch({ loads });
  } else if (act === "remove-load") {
    const i = Number(t.getAttribute("data-index"));
    patch({ loads: model.loads.filter((_, j) => j !== i) });
  } else if (act === "probe") {
    ui.probeX = Number(t.getAttribute("data-x"));
    renderInPlace(t);
  } else if (act === "clear-probe") {
    ui.probeX = null;
    renderInPlace(t);
  } else if (act === "select-combo") {
    if (ev.target.closest("input,select,button,label,.plot-cell")) return;
    patch({ comboView: "single", selectedComboId: t.getAttribute("data-id") });
  } else if (act === "view") {
    patch({ comboView: t.getAttribute("data-view") === "all" ? "all" : "single" });
  } else if (act === "toggle-combo") {
    const id = t.getAttribute("data-id");
    setComboHidden([id], !hiddenSet(model).has(id));
  } else if (act === "show-combos") {
    showAllCombos(t.getAttribute("data-show") !== "none");
  }
}

// Every row, including ones whose factors are zero right now, so a later factor edit does not
// bring back a choice the user has since overridden.
function showAllCombos(show) {
  patch({ hiddenComboIds: show ? [] : model.combinations.map((c) => c.id) });
}

// render() rebuilds the page. When a click pins a station, the pin readout above the diagrams
// changes height; keep the block that was clicked where it was on screen, and keep each
// table's own scroll position, across and down. The pin readout always fills one block slot,
// so a scroller is identified by its block and its position inside that block.
function renderInPlace(el) {
  const blocks = () => [...document.querySelectorAll(".panel > .space-y > *")];
  const scrollers = () => blocks().flatMap((b, bi) => [...b.querySelectorAll(".scroll, .scroll-y")].map((s, k) => ({ key: `${bi}:${k}`, s })));
  const i = blocks().findIndex((b) => b.contains(el));
  const top = i >= 0 ? blocks()[i].getBoundingClientRect().top : 0;
  const saved = new Map(scrollers().filter(({ s }) => s.scrollTop || s.scrollLeft).map(({ key, s }) => [key, [s.scrollTop, s.scrollLeft]]));
  render();
  for (const { key, s } of scrollers()) {
    const at = saved.get(key);
    if (!at) continue;
    // A fresh station table is skipped by content-visibility until painted and would clamp
    // the offset to 0; lay it out now. It was on screen anyway if it had been scrolled.
    s.style.contentVisibility = "visible";
    s.scrollTop = at[0];
    s.scrollLeft = at[1];
  }
  const shift = i >= 0 && blocks()[i] ? blocks()[i].getBoundingClientRect().top - top : 0;
  if (shift) window.scrollBy(0, shift);
}

function setComboHidden(ids, hide) {
  const hidden = hiddenSet(model);
  for (const id of ids) {
    if (hide) hidden.add(id);
    else hidden.delete(id);
  }
  patch({ hiddenComboIds: [...hidden] });
}

function onChange(ev) {
  const t = ev.target;
  if (!(t instanceof HTMLElement)) return;
  const act = t.getAttribute("data-act");
  if (!act) return;
  const lapsed = lapseConfirmations(act);
  const renders = ui.renderCount;
  handleChange(t, act);
  if (lapsed && ui.renderCount === renders) renderWhenIdle();
}

function handleChange(t, act) {
  if (act === "patch") {
    const field = t.getAttribute("data-field");
    const raw = t.value;
    const numeric = ["nElements", "customE", "customDensity", "customI", "customZ", "customA", "customAv", "stationsPerElement", "deflectionLimitN"].includes(field);
    patch({ [field]: numeric ? num(raw) : raw });
  } else if (act === "patch-bool") {
    patch({ [t.getAttribute("data-field")]: t.checked });
  } else if (act === "default-section") {
    setDefaultSection(t.value);
  } else if (act === "element") {
    const i = Number(t.getAttribute("data-index"));
    const field = t.getAttribute("data-field");
    const value = field === "length" ? num(t.value) : t.value;
    const elements = model.elements.map((el, j) => (j === i ? { ...el, [field]: value } : el));
    patch({ elements });
  } else if (act === "support") {
    const i = Number(t.getAttribute("data-index"));
    const supports = model.supports.slice();
    supports[i] = t.value;
    patch({ supports });
  } else if (act === "load") {
    const i = Number(t.getAttribute("data-index"));
    const field = t.getAttribute("data-field");
    let value;
    if (t.getAttribute("data-type") === "bool") value = t.checked;
    else if (["x1", "x2", "magnitude"].includes(field)) value = num(t.value);
    else value = t.value;
    const loads = model.loads.map((ld, j) => (j === i ? { ...ld, [field]: value } : ld));
    patch({ loads });
  } else if (act === "show-inactive") {
    ui.showInactive = t.checked;
    render();
  } else if (act === "combo-field") {
    const id = t.getAttribute("data-id");
    const field = t.getAttribute("data-field");
    const combinations = model.combinations.map((c) => (c.id === id ? { ...c, [field]: t.value } : c));
    patch({ combinations });
  } else if (act === "combo-factor") {
    const id = t.getAttribute("data-id");
    const factor = t.getAttribute("data-factor");
    const combinations = model.combinations.map((c) =>
      c.id === id ? { ...c, factors: { ...c.factors, [factor]: num(t.value) } } : c,
    );
    patch({ combinations });
  } else if (act === "preset-select") {
    if (t.value === "example") setModel(excelExample());
    if (t.value === "three") setModel(simpleThreeSpan());
    t.value = "";
  } else if (act === "pick-combo") {
    if (t.value === ALL_COMBOS) patch({ comboView: "all" });
    else patch({ comboView: "single", selectedComboId: t.value });
  } else if (act === "plot-combo") {
    setComboHidden([t.getAttribute("data-id")], !t.checked);
  } else if (act === "plot-all") {
    showAllCombos(t.checked);
  } else if (act === "station-field") {
    ui.stationField = t.value;
    render();
  } else if (act === "beam-shape") {
    if (!ui.beamDraft) return;
    ui.beamDraft.shape = t.value;
    refreshAutoProps(ui.beamDraft);
    render();
  } else if (act === "beam-material") {
    if (!ui.beamDraft) return;
    ui.beamDraft.material = t.value;
    updateBeamForm();
  } else if (act === "beam-override") {
    const d = ui.beamDraft;
    if (!d) return;
    d.override = t.checked;
    // Start from the calculated values, so only the ones that differ need typing; the fields not
    // typed in keep following the dimensions.
    refreshAutoProps(d);
    render();
  } else if (act === "gh-token") {
    lib.token = t.value.trim();
    if (lib.remember && lib.token) storageSet(GH_TOKEN_KEY, lib.token);
    // No re-render here: this change fires when the user clicks "Save to GitHub" or "Remember"
    // straight after pasting, and rebuilding the page would swallow that click. The next render
    // shows the token as set.
  } else if (act === "gh-remember") {
    lib.remember = t.checked;
    storageSet(GH_TOKEN_KEY, lib.remember && lib.token ? lib.token : null);
    render();
  } else if (act === "paste-units" || act === "paste-material") {
    if (act === "paste-units") ui.pasteUnits = t.value;
    else ui.pasteMaterial = t.value;
    if (ui.pasteResult) ui.pasteResult = parseBeamTable(ui.pasteText, ui.pasteUnits, ui.pasteMaterial);
    render();
  }
  // beam-dim, beam-prop, beam-text and paste-text are handled as they are typed (onInput).
}

// Typing in the beam form recalculates in place; nothing else on the page is rebuilt.
function onInput(ev) {
  const t = ev.target;
  if (!(t instanceof HTMLElement)) return;
  const act = t.getAttribute("data-act");
  if (lapseConfirmations(act)) renderWhenIdle();
  const d = ui.beamDraft;
  if (act === "beam-dim" && d) {
    const k = t.getAttribute("data-field");
    d.raw[k] = t.value;
    d.rawTyped[k] = true;
    syncDraftDims(d);
    updateBeamForm();
  } else if (act === "beam-prop" && d) {
    const k = t.getAttribute("data-field");
    d.props[k] = t.value;
    d.typed[k] = t.value.trim() !== "";
    d.typedNow[k] = true;
    syncDraftDims(d);
    updateBeamForm();
  } else if (act === "beam-text" && d) {
    const k = t.getAttribute("data-field");
    d[k] = t.value;
    // Editing never renames a beam behind the user's back: an emptied name stays empty.
    if (k === "name") d.nameTouched = d.mode === "edit" || t.value.trim() !== "";
    updateBeamForm();
  } else if (act === "paste-text") {
    ui.pasteText = t.value;
  } else if (act === "gh-token") {
    lib.token = t.value.trim();
  }
}

document.addEventListener("click", onClick);
document.addEventListener("change", onChange);
document.addEventListener("input", onInput);
window.addEventListener("storage", onLibraryStorage);
for (const [type, down] of [["pointerdown", true], ["pointerup", false], ["pointercancel", false], ["mousedown", true], ["mouseup", false]]) {
  document.addEventListener(type, () => {
    ui.pointerDown = down;
  }, true);
}
document.addEventListener("change", (ev) => {
  if (ev.target && ev.target.id === "import-file" && ev.target.files?.[0]) {
    importJsonFile(ev.target.files[0]);
    ev.target.value = "";
  }
});
// diagramWidth() depends on the viewport, so redraw the diagrams when a resize crosses its
// breakpoint. A full render() here would throw away a field being typed in (rotating a
// phone mid-edit), and replacing elements would break the browser's scroll anchoring and
// jump the page; so the SVG elements stay and only their drawing is swapped. Their event
// handlers read the viewBox on each event, so they need no rebinding.
let lastDiagramWidth = diagramWidth();
window.addEventListener("resize", () => {
  if (diagramWidth() === lastDiagramWidth) return;
  lastDiagramWidth = diagramWidth();
  const live = document.querySelectorAll(".panel [data-diagram-svg]");
  if (!live.length) return;
  const fresh = document.createElement("template");
  fresh.innerHTML = panelHtml(model, analyze(model));
  const drawn = [...fresh.content.querySelectorAll("[data-diagram-svg]")];
  live.forEach((svg) => {
    const next = drawn.find((n) => n.getAttribute("data-diagram-svg") === svg.getAttribute("data-diagram-svg"));
    if (!next) return;
    svg.setAttribute("viewBox", next.getAttribute("viewBox"));
    svg.innerHTML = next.innerHTML;
  });
});

hydrateLibrary();
hydrate();
ui.bootCopies = new Set(sectionNamesUsed(model).filter((n) => !Object.prototype.hasOwnProperty.call(model.sectionDefs || {}, n)));
model = syncSectionDefs(model);
render();
loadLibrary();

  </script>
</body>
</html>
