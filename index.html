<body>
  <div id="app" class="app"></div>
  <div id="sr-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
"use strict";
/** CBA FEA engine — Continuous Beam Analysis · Lumax Energy · plain JS, no deps. */

const LOAD_CASES = ["G", "Q1", "Q2", "W+", "W-", "O"];
const SUPPORT_TYPES = ["Free", "Pinned", "Roller", "Fixed"];
const LOAD_TYPES = ["Point", "Moment", "UDL"];
const MATERIALS = ["Steel", "Aluminium", "Custom"];

const CUSTOM_SECTION = { name: "Custom", mass: null, h: null, I: 0, Z: 0, A: 0, Av: 0 };
// The beam library is not hardcoded: it lives in beams.json in the GitHub repository and is
// edited on the Beams tab. "Custom" (the model's own I, Z, A, Av) is always first. The array
// is filled in place by setSectionLibrary() so every reference to it sees the current list.
const SECTION_LIBRARY = [CUSTOM_SECTION];
const BEAM_MATERIALS = ["Steel", "Aluminium", "Other"];
const BEAM_NAME_MAX = 60;

function isFinitePositive(v) {
  return typeof v === "number" && Number.isFinite(v) && v > 0;
}
function optNum(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

// Returns a clean beam record, or null when the entry cannot be used for analysis.
function normaliseBeam(raw) {
  if (!raw || typeof raw !== "object") return null;
  // Runs of spaces and line breaks (a wrapped spreadsheet cell) become one space, so names that
  // look the same are the same.
  const name = typeof raw.name === "string" ? raw.name.replace(/\s+/g, " ").trim() : "";
  if (!name || name.length > BEAM_NAME_MAX || name.toLowerCase() === "custom") return null;
  const I = Number(raw.I), Z = Number(raw.Z), A = Number(raw.A);
  const Av = raw.Av === undefined || raw.Av === null || raw.Av === "" ? 0 : Number(raw.Av);
  if (!isFinitePositive(I) || !isFinitePositive(Z) || !isFinitePositive(A) || !Number.isFinite(Av) || Av < 0) return null;
  const beam = { name, shape: typeof raw.shape === "string" ? raw.shape : "manual" };
  if (raw.dims && typeof raw.dims === "object") {
    const dims = {};
    for (const [k, v] of Object.entries(raw.dims)) if (typeof v === "number" && Number.isFinite(v)) dims[k] = v;
    if (Object.keys(dims).length) beam.dims = dims;
  }
  beam.material = matchMaterial(raw.material) || "Other";
  beam.h = optNum(raw.h);
  beam.mass = optNum(raw.mass);
  Object.assign(beam, { A, I, Z, Av });
  for (const k of ["source", "notes", "addedBy", "updated"]) {
    if (typeof raw[k] === "string" && raw[k].trim()) beam[k] = raw[k].trim();
  }
  // Extra fields someone added to beams.json by hand (a steel grade, a part number, a list of
  // tags) are kept as they are, so editing or saving from the app does not strip them.
  let extras = 0;
  for (const [k, v] of Object.entries(raw)) {
    if (BEAM_KNOWN_KEYS.has(k) || k.length > 100 || extras >= 200 || v === undefined || typeof v === "function") continue;
    if (typeof v === "number" && !Number.isFinite(v)) continue;
    let json;
    try {
      json = JSON.stringify(v);
    } catch {
      continue;
    }
    if (json === undefined || json.length > 100000) continue;
    beam[k] = v !== null && typeof v === "object" ? JSON.parse(json) : v;
    extras++;
  }
  return beam;
}

// "steel", "Aluminum", "ALU" and so on map to the app's names; anything else is not a material
// the app knows (null).
function matchMaterial(v) {
  const s = typeof v === "string" ? v.trim().toLowerCase() : "";
  if (s === "steel") return "Steel";
  if (s === "aluminium" || s === "aluminum" || s === "alu") return "Aluminium";
  if (s === "other") return "Other";
  return null;
}

// Fields a beam record carries that the app does not edit itself (hand-added grade, tags, …).
function beamExtras(b) {
  const out = {};
  for (const [k, v] of Object.entries(b || {})) if (!BEAM_KNOWN_KEYS.has(k)) out[k] = v;
  return out;
}

// Physical consistency of a set of section properties (mm units). With r the radius of gyration
// and c the distance to the extreme fibre, A·I/Z² = (c/r)². c ≥ r for any section, so
// Z² ≤ A·I; and c/r stays small for beam sections (about 1.1 for a wide-flange I, 1.7 for a
// solid bar, 2 for a solid round, up to about 3.7 for a tee cut from a wide column section, where
// A·I/Z² reaches 13.7), so A·I ≤ 20·Z², while a table read in 10³ units by mistake gives 1000 or
// more. (A table read in cm instead of mm, or the reverse, keeps the ratio: only a depth or a
// mass shows it.) The extreme fibre I/Z lies
// between h/2 and h. A mass, with a known material, must match the area. Values that break these
// are a unit or typing slip (cm⁴ against mm³, a table read in the wrong units) or a thousands
// separator read as a decimal mark.
const BEAM_MAX_SHAPE_RATIO = 20;
function beamPlausibility({ A, I, Z, Av, h, mass, material }) {
  const problems = [];
  if (!(A > 0 && I > 0 && Z > 0)) return problems;
  const units = "Check that A is in mm², I in mm⁴ and Z in mm³.";
  if (Z * Z > 1.02 * A * I) {
    problems.push(`Z is too large for this A and I (Z² must not exceed A × I). ${units}`);
  } else if (A * I > BEAM_MAX_SHAPE_RATIO * Z * Z) {
    problems.push(`A and I are too large for this Z (A × I is ${formatNum((A * I) / (Z * Z), 1)} × Z²; beam sections stay under ${BEAM_MAX_SHAPE_RATIO} × Z²). ${units}`);
  }
  const density = BEAM_DENSITY[material];
  if (mass > 0 && density) {
    const ratio = mass / (A * 1e-6 * density);
    if (ratio < 0.7 || ratio > 1.4) {
      problems.push(`The mass ${formatNum(mass, 3)} kg/m does not match A = ${formatNum(A, 1)} mm² for ${material.toLowerCase()} (${formatNum(A * 1e-6 * density, 3)} kg/m). Check the units of A, the mass and the material.`);
    }
  }
  if (h > 0) {
    const c = I / Z;
    if (c < 0.475 * h || c > 1.05 * h) {
      problems.push(`I / Z = ${formatNum(c, 1)} mm, but for a section ${formatNum(h, 1)} mm deep it must lie between h/2 and h. Check the units of I and Z, and h.`);
    }
  }
  if (Av > 1.02 * A) problems.push("Av is larger than A.");
  return problems;
}
const BEAM_KNOWN_KEYS = new Set(["name", "shape", "dims", "material", "h", "mass", "A", "I", "Z", "Av", "source", "notes", "addedBy", "updated", "embedded", "missing"]);

// Parses the beams.json document. Bad entries and repeated names are dropped and counted, never
// guessed at.
function normaliseBeamFile(doc) {
  const list = Array.isArray(doc) ? doc : Array.isArray(doc?.beams) ? doc.beams : null;
  if (!list) return null;
  const beams = [];
  const seen = new Set();
  let skipped = 0;
  for (const raw of list) {
    const b = normaliseBeam(raw);
    if (!b || seen.has(b.name.toLowerCase())) {
      skipped++;
      continue;
    }
    seen.add(b.name.toLowerCase());
    beams.push(b);
  }
  const revision = Number.isInteger(doc?.revision) && doc.revision >= 0 ? doc.revision : 0;
  const updated = typeof doc?.updated === "string" ? doc.updated : null;
  return { revision, updated, beams, skipped };
}

function setSectionLibrary(beams) {
  SECTION_LIBRARY.splice(1, SECTION_LIBRARY.length - 1, ...beams);
}

// Pending library edits are kept as operations so they can be replayed on top of whatever is on
// GitHub at the moment of saving; a colleague's additions made in the meantime are kept.
function applyBeamOps(beams, ops) {
  let out = beams.slice();
  for (const op of ops || []) {
    if (op?.op === "delete") {
      // Names are unique regardless of case, so a delete still finds a beam re-capitalised since.
      out = out.filter((b) => b.name.toLowerCase() !== String(op.name).toLowerCase());
    } else if (op?.op === "upsert" && op.beam) {
      const key = op.from ?? op.beam.name;
      const at = out.findIndex((b) => b.name === key);
      out = out.filter((b) => b.name !== key && b.name.toLowerCase() !== op.beam.name.toLowerCase());
      if (at >= 0) out.splice(Math.min(at, out.length), 0, op.beam);
      else out.push(op.beam);
    }
  }
  return out;
}

function sameBeam(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

function beamDiff(before, after) {
  const was = new Map(before.map((b) => [b.name, b]));
  const now = new Map(after.map((b) => [b.name, b]));
  const added = after.filter((b) => !was.has(b.name)).map((b) => b.name);
  const removed = before.filter((b) => !now.has(b.name)).map((b) => b.name);
  const changed = after.filter((b) => was.has(b.name) && !sameBeam(was.get(b.name), b)).map((b) => b.name);
  return { added, removed, changed, count: added.length + removed.length + changed.length };
}

/* ---- Section-property helper ------------------------------------------------------------
   Major-axis properties of sections that are symmetric about the bending axis, so the top and
   bottom fibres share one elastic modulus Z, as the analysis assumes. Every shape is built
   from rectangles and annular circular sectors (bends, root fillets as square minus quarter
   disc) whose area, first and second moments about y = 0 have exact closed forms. y is measured
   up from the underside; units are mm. */
const BEAM_SHAPES = [
  { id: "i", label: "I / H section (rolled)", prefix: "I", dims: [["h", "Depth h"], ["b", "Flange width b"], ["tw", "Web thickness tw"], ["tf", "Flange thickness tf"], ["r", "Root radius r"]], av: "h × tw" },
  { id: "channel", label: "Channel, parallel flange (rolled)", prefix: "PFC", dims: [["h", "Depth h"], ["b", "Flange width b"], ["tw", "Web thickness tw"], ["tf", "Flange thickness tf"], ["r", "Root radius r"]], av: "h × tw" },
  { id: "lipped", label: "Lipped channel (cold-formed C)", prefix: "C", dims: [["h", "Depth h"], ["b", "Flange width b"], ["c", "Lip length c (0 = plain)"], ["t", "Thickness t"], ["ri", "Inside bend radius ri"]], av: "h × t" },
  { id: "rhs", label: "RHS / SHS (hollow)", prefix: "RHS", dims: [["h", "Depth h"], ["b", "Width b"], ["t", "Wall thickness t"], ["ro", "Outside corner radius ro"]], av: "2 × h × t" },
  { id: "chs", label: "CHS (circular hollow)", prefix: "CHS", dims: [["d", "Outside diameter D"], ["t", "Wall thickness t"]], av: "2A / π" },
  { id: "rect", label: "Solid rectangle / flat bar", prefix: "Bar", dims: [["h", "Depth h"], ["b", "Width b"]], av: "A" },
  { id: "manual", label: "Enter properties directly", prefix: "", dims: [], av: "" },
];
const BEAM_DENSITY = { Steel: 7850, Aluminium: 2700 };

function rectMoments(width, y0, y1) {
  return { A: width * (y1 - y0), S: (width * (y1 * y1 - y0 * y0)) / 2, J: (width * (y1 ** 3 - y0 ** 3)) / 3 };
}
// Annular sector ri..ro, angles th0..th1 (radians, from +x, anticlockwise), centre at height cy.
function sectorMoments(cy, ri, ro, th0, th1) {
  const A = ((th1 - th0) * (ro * ro - ri * ri)) / 2;
  const Q = ((ro ** 3 - ri ** 3) / 3) * (Math.cos(th0) - Math.cos(th1));
  const Ic = ((ro ** 4 - ri ** 4) / 4) * ((th1 - th0) / 2 - (Math.sin(2 * th1) - Math.sin(2 * th0)) / 4);
  return { A, S: cy * A + Q, J: cy * cy * A + 2 * cy * Q + Ic };
}
// Root fillet of radius r filling the corner whose square spans y0..y0 + r; the arc's centre is
// at the far corner (cy) and the fillet is the square less the quarter disc.
function filletMoments(y0, r, upper) {
  if (!(r > 0)) return { A: 0, S: 0, J: 0 };
  const sq = rectMoments(r, y0, y0 + r);
  const disc = upper ? sectorMoments(y0, 0, r, 0, Math.PI / 2) : sectorMoments(y0 + r, 0, r, Math.PI, 1.5 * Math.PI);
  return { A: sq.A - disc.A, S: sq.S - disc.S, J: sq.J - disc.J };
}
function sumMoments(parts) {
  return parts.reduce((t, p) => ({ A: t.A + p.A, S: t.S + p.S, J: t.J + p.J }), { A: 0, S: 0, J: 0 });
}
function roundedRectParts(width, height, R, y0) {
  // A rectangle of width × height with corner radius R, its underside at y0.
  if (!(R > 0)) return [rectMoments(width, y0, y0 + height)];
  return [
    rectMoments(width, y0 + R, y0 + height - R),
    rectMoments(width - 2 * R, y0, y0 + R),
    rectMoments(width - 2 * R, y0 + height - R, y0 + height),
    sectorMoments(y0 + R, 0, R, Math.PI, 1.5 * Math.PI),
    sectorMoments(y0 + R, 0, R, 1.5 * Math.PI, 2 * Math.PI),
    sectorMoments(y0 + height - R, 0, R, 0, Math.PI / 2),
    sectorMoments(y0 + height - R, 0, R, Math.PI / 2, Math.PI),
  ];
}

function shapeSpec(id) {
  return BEAM_SHAPES.find((s) => s.id === id) || null;
}

// Checks the dimensions of a shape. Returns a list of problems (empty when usable).
function shapeProblems(shape, d) {
  const spec = shapeSpec(shape);
  if (!spec) return ["Unknown shape."];
  const problems = [];
  for (const [k, label] of spec.dims) {
    const v = d?.[k];
    const zeroOk = k === "r" || k === "c" || k === "ri" || k === "ro";
    if (typeof v !== "number" || !Number.isFinite(v)) problems.push(`Enter ${label.replace(/ \(.*\)$/, "")}.`);
    else if (zeroOk ? v < 0 : v <= 0) problems.push(`${label.replace(/ \(.*\)$/, "")} must be ${zeroOk ? "zero or more" : "greater than zero"}.`);
  }
  if (problems.length) return problems;
  const { h, b, tw, tf, r, c, t, ri, ro } = d;
  if (shape === "i") {
    if (2 * tf >= h) problems.push("Two flange thicknesses must be less than the depth.");
    if (tw >= b) problems.push("The web must be thinner than the flange width.");
    if (tw + 2 * r > b) problems.push("Web plus two root radii is wider than the flange.");
    if (2 * tf + 2 * r > h) problems.push("Flanges plus root radii are deeper than the section.");
  } else if (shape === "channel") {
    if (2 * tf >= h) problems.push("Two flange thicknesses must be less than the depth.");
    if (tw >= b) problems.push("The web must be thinner than the flange width.");
    if (tw + r > b) problems.push("Web plus root radius is wider than the flange.");
    if (2 * tf + 2 * r > h) problems.push("Flanges plus root radii are deeper than the section.");
  } else if (shape === "lipped") {
    const Ro = ri + t;
    if (2 * Ro > h) problems.push("Depth must be at least 2 × (ri + t).");
    if (c > 0 && 2 * Ro > b) problems.push("Flange width must be at least 2 × (ri + t) when there is a lip.");
    if (c === 0 && Ro > b) problems.push("Flange width must be at least ri + t.");
    if (c > 0 && c < Ro) problems.push("Lip must be at least ri + t long (or 0 for a plain channel).");
    if (2 * c > h) problems.push("Lips longer than half the depth would overlap.");
  } else if (shape === "rhs") {
    if (2 * t >= h || 2 * t >= b) problems.push("Wall thickness must be less than half the depth and width.");
    if (2 * ro > h || 2 * ro > b) problems.push("Corner radius must be at most half the depth and width.");
  } else if (shape === "chs") {
    if (2 * t >= d.d) problems.push("Wall thickness must be less than the radius.");
  }
  return problems;
}

// Section properties from dimensions. { ok, problems, A, I, Z, Av, h, yc }.
function sectionFromShape(shape, dims) {
  const problems = shapeProblems(shape, dims);
  if (shape === "manual") return { ok: false, problems: ["Enter the properties directly."] };
  if (problems.length) return { ok: false, problems };
  const d = dims;
  let parts;
  let depth;
  let Av;
  if (shape === "i" || shape === "channel") {
    const { h, b, tw, tf, r } = d;
    const n = shape === "i" ? 2 : 1; // fillets per flange
    depth = h;
    parts = [rectMoments(b, 0, tf), rectMoments(b, h - tf, h), rectMoments(tw, tf, h - tf)];
    for (let k = 0; k < n; k++) parts.push(filletMoments(tf, r, false), filletMoments(h - tf - r, r, true));
    Av = h * tw;
  } else if (shape === "lipped") {
    const { h, b, c, t, ri } = d;
    const Ro = ri + t;
    depth = h;
    const bend = (cy, lower) => (lower ? sectorMoments(cy, ri, Ro, Math.PI, 1.5 * Math.PI) : sectorMoments(cy, ri, Ro, Math.PI / 2, Math.PI));
    parts = [
      rectMoments(t, Ro, h - Ro), // web
      bend(Ro, true), bend(h - Ro, false), // web-to-flange bends
    ];
    if (c > 0) {
      parts.push(
        rectMoments(b - 2 * Ro, 0, t), rectMoments(b - 2 * Ro, h - t, h), // flanges between bends
        bend(Ro, true), bend(h - Ro, false), // flange-to-lip bends (same heights as the web bends)
        rectMoments(t, Ro, c), rectMoments(t, h - c, h - Ro), // lips
      );
    } else {
      parts.push(rectMoments(b - Ro, 0, t), rectMoments(b - Ro, h - t, h));

        ...arc(b - Ro, Ro, ri, 1.5 * P, 2 * P),

      [b, t], [b, 0],
      ...arc(Ro, Ro, Ro, -P / 2, -P),
      ...arc(Ro, h - Ro, Ro, P, P / 2),
      [b, h], [b, h - t],
      ...arc(Ro, h - Ro, ri, P / 2, P),
      ...arc(Ro, Ro, ri, P, 1.5 * P),
    ]];
  }
  if (shape === "rhs") {
    const { h, b, t, ro } = d;
    return [roundRect(0, 0, b, h, ro), roundRect(t, t, b - 2 * t, h - 2 * t, Math.max(ro - t, 0))];

  // Matched by identity, not id: an imported file may repeat an id, and each row still needs
  // its own results.
  const comboResults = combos.map((c) => (c === selectedCombo ? selected : comboResult(c)));
  const envVmax = [], envVmin = [], envMmax = [], envMmin = [];
  const envVmaxC = [], envVminC = [], envMmaxC = [], envMminC = [];
  const envVup = [], envVdn = [], envVupC = [], envVdnC = [], envSig = [], envSigC = [];
  for (let i = 0; i < stations.length; i++) {
    let vmax = -Infinity, vmin = Infinity, mmax = -Infinity, mmin = Infinity;
    let vup = -Infinity, vdn = Infinity, sig = -Infinity;
    let cvmax = "", cvmin = "", cmmax = "", cmmin = "", cvup = "", cvdn = "", csig = "";
    for (const combo of combos) {
      const V = combine(stations[i].V, combo.factors);
      const M = combine(stations[i].M, combo.factors);
      const v = combine(stations[i].v, combo.factors);
      const Z_mm3 = elems[stations[i].elementIndex].Z * 1e9;
      const sAbs = Z_mm3 > 0 ? Math.abs((M * 1e6) / Z_mm3) : 0;
      if (V > vmax) { vmax = V; cvmax = combo.name; }
      if (V < vmin) { vmin = V; cvmin = combo.name; }
      if (M > mmax) { mmax = M; cmmax = combo.name; }
      if (M < mmin) { mmin = M; cmmin = combo.name; }
      if (v > vup) { vup = v; cvup = combo.name; }
      if (v < vdn) { vdn = v; cvdn = combo.name; }
      if (sAbs > sig) { sig = sAbs; csig = combo.name; }
    }
    envVmax.push(vmax); envVmin.push(vmin);
    envMmax.push(mmax); envMmin.push(mmin);
    envVup.push(vup); envVdn.push(vdn); envSig.push(sig);
    envVmaxC.push(cvmax); envVminC.push(cvmin);
    envMmaxC.push(cmmax); envMminC.push(cmmin);
    envVupC.push(cvup); envVdnC.push(cvdn); envSigC.push(csig);
  }
  const envItem = (label, values, names, pick, unit) => {
    if (!values.length || !Number.isFinite(values[0])) return { label, value: 0, x: 0, combination: "—", governing: "—", unit };
    const { imax, imin } = argExtrema(values);
    const i = pick === "max" ? imax : imin;
    return { label, value: values[i], x: xOf(i), combination: names[i], governing: names[i], unit };
  };
  const envelope = [
    envItem("Maximum shear", envVmax, envVmaxC, "max", "kN"),
    envItem("Minimum shear", envVmin, envVminC, "min", "kN"),
    envItem("Maximum moment", envMmax, envMmaxC, "max", "kNm"),
    envItem("Minimum moment", envMmin, envMminC, "min", "kNm"),
    envItem("Maximum deflection", envVup, envVupC, "max", "mm"),
    envItem("Minimum deflection", envVdn, envVdnC, "min", "mm"),
    envItem("Maximum absolute bending stress", envSig, envSigC, "max", "MPa"),
  ];
  const status = invalidLoads.length > 0 ? "INVALID LOAD INPUT" : equilibrium.every((e) => e.ok) ? "OK" : "EQUILIBRIUM CHECK";
  return {
    ok: status === "OK" || status === "INVALID LOAD INPUT",
    status, solverReady, supportStable, invalidLoads, warnings, totalLength,
    E: E_mpa, density, nElements: nEl, nNodes, nodeX, stations, reactions,
    selected, comboResults, envelope, equilibrium, continuity,
    deflectionCheck: selected.deflectionCheck,
    sectionAt, defaultI, missingSections, staleSections,
  };
}

/* ---- Beam library: local state and GitHub sync ------------------------------------------ */

const lib = {
  base: { revision: 0, updated: null, beams: [], savedAt: 0 }, // beams.json as last seen on GitHub
  pending: [], // edits made in this browser and not yet on GitHub (see applyBeamOps)
  editSeq: 0, // bumped by every local edit, so a save can tell which edits it did not include
  touched: null, // while saving: lower-cased names of beams edited since the save began
  uncertain: null, // a save whose reply was lost: { merged, sha, ops }, checked at the next read
  missing: false, // beams.json was seen on GitHub and is now gone
  source: "none", // "none" | "cache" | "github"
  loading: false,
  saving: false,
  message: null, // { tone, text, link?, linkText? }
  token: "",
  remember: false,
};

function storageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}
function storageSet(key, value) {
  try {
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, value);
  } catch {
    /* storage unavailable: the library still works for this page view */
  }
}
function parseJson(raw) {
  if (typeof raw !== "string" || !raw) return null;
  try {
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

function effectiveBeams() {
  return applyBeamOps(lib.base.beams, lib.pending);
}
function pendingDiff() {
  return beamDiff(lib.base.beams, effectiveBeams());
}

const lower = (s) => String(s).toLowerCase();
function opName(op) {
  return op.op === "delete" ? op.name : op.beam.name;
}
// Names are unique regardless of case (and stored trimmed), so a beam is looked up the same way.
function beamNamed(beams, name) {
  const k = lower(String(name).replace(/\s+/g, " ").trim());
  return beams.find((b) => lower(b.name) === k) ?? null;
}
function sameBeamOrNone(a, b) {
  return a === null || b === null ? a === b : sameBeam(a, b);
}

// Rewrites the pending edits as the fewest operations that turn the GitHub copy into what this
// browser shows: deletes, then one upsert per new or changed beam. Each operation remembers the
// GitHub version of the beam it started from (base; null for a new name), so a save can tell
// when someone else has changed the same beam in the meantime.
function compactPending() {
  const started = new Map();
  for (const op of lib.pending) {
    if (!("base" in op)) continue;
    // An edit that renames a beam started from the old name's version; the new name did not
    // exist then (the form refuses names in use).
    const key = lower(op.from ?? opName(op));
    if (!started.has(key)) started.set(key, op.base);
    if (op.from && lower(op.from) !== lower(opName(op)) && !started.has(lower(opName(op)))) started.set(lower(opName(op)), null);
  }
  const baseOf = (name) => (started.has(lower(name)) ? started.get(lower(name)) : beamNamed(lib.base.beams, name));
  const now = effectiveBeams();
  const diff = beamDiff(lib.base.beams, now);
  const byName = new Map(now.map((b) => [b.name, b]));
  lib.pending = [
    ...diff.removed.map((name) => ({ op: "delete", name, base: baseOf(name) })),
    ...now.filter((b) => diff.added.includes(b.name) || diff.changed.includes(b.name)).map((b) => ({ op: "upsert", beam: byName.get(b.name), base: baseOf(b.name) })),
  ];
}

// Pending edits to beams that have changed on GitHub since the edit began, one per beam. A beam
// GitHub already holds exactly as this browser wants it (a save whose reply was lost, the same
// delete made by a colleague) is no conflict.
function pendingConflicts(beams = lib.base.beams) {
  const out = new Map();
  const want = effectiveBeams();
  // Upserts first, so a beam renamed here only in capitals is listed under the new spelling.
  const ops = [...lib.pending.filter((op) => op.op === "upsert"), ...lib.pending.filter((op) => op.op !== "upsert")];
  for (const op of ops) {
    if (!("base" in op)) continue;
    const theirs = beamNamed(beams, opName(op));
    if (sameBeamOrNone(op.base, theirs)) continue;
    const mine = beamNamed(want, opName(op));
    if (sameBeamOrNone(mine, theirs)) continue;
    const k = lower(opName(op));
    if (!out.has(k)) out.set(k, { name: opName(op), base: op.base, theirs, mine });
  }
  return [...out.values()];
}

// While a save is in flight, remember which beams are edited, so that the save's result does not
// undo those edits (see adoptSavedBase).
function noteTouched(names) {
  if (!lib.touched) return;
  for (const n of names) if (typeof n === "string") lib.touched.add(lower(n.trim()));
}

function normaliseOp(op) {
  const withBase = (o) => {
    if (!op || !("base" in op)) return o;
    const base = op.base === null ? null : normaliseBeam(op.base);
    return op.base === null || base ? { ...o, base } : o;
  };
  if (op?.op === "delete" && typeof op.name === "string") return withBase({ op: "delete", name: op.name });
  if (op?.op === "upsert") {
    const beam = normaliseBeam(op.beam);
    if (!beam) return null;
    return withBase(typeof op.from === "string" ? { op: "upsert", from: op.from, beam } : { op: "upsert", beam });
  }
  return null;
}

const BEAM_FILE_KEYS = ["schema", "revision", "updated", "note", "beams"];
// extra: top-level fields someone added to beams.json by hand, written back unchanged.
function beamFileDoc(f, extra = {}) {
  return { ...extra, schema: BEAM_FILE_SCHEMA, revision: f.revision, updated: f.updated, note: BEAM_FILE_NOTE, beams: f.beams };
}

function persistLibrary() {
  storageSet(BEAM_CACHE_KEY, JSON.stringify({ ...beamFileDoc(lib.base), savedAt: lib.base.savedAt || 0, source: lib.source }));
  storageSet(BEAM_PENDING_KEY, lib.pending.length ? JSON.stringify(lib.pending) : null);
}

// Replaces the model after an action the user took in this tab; it is written to storage only
// when it actually changed.
function setModelQuietly(next) {
  const changed = JSON.stringify(next) !== JSON.stringify(model);
  model = next;
  if (changed) persist();
}

// The beams the analysis sees, and the copies the current model keeps of the ones it uses.
// accept: see syncSectionDefs. Library updates that arrive by themselves (loading, another tab,
// a colleague's save merged in) change the model in memory only: this tab may hold an older
// model than the one saved by another tab, and must not write it back. The copies reach storage
// with this tab's next model edit, and start-up brings them up to date anyway. persistModel is
// for the user's own library actions in this tab.
function applyLibrary(accept = null, persistModel = false) {
  setSectionLibrary(effectiveBeams());
  const next = syncSectionDefs(model, accept);
  if (persistModel) setModelQuietly(next);
  else model = next;
}

// Reads the library and this browser's unsaved edits from storage: at start-up, and when another
// tab changes them.
function readLibraryStorage() {
  const cached = parseJson(storageGet(BEAM_CACHE_KEY));
  const file = cached ? normaliseBeamFile(cached) : null;
  if (file) {
    lib.base = { revision: file.revision, updated: file.updated, beams: file.beams, savedAt: Number(cached.savedAt) || 0 };
    lib.source = cached.source === "github" ? "github" : "cache";
  }
  const pend = parseJson(storageGet(BEAM_PENDING_KEY));
  lib.pending = Array.isArray(pend) ? pend.map(normaliseOp).filter(Boolean) : [];
}

function hydrateLibrary() {
  readLibraryStorage();
  const tok = storageGet(GH_TOKEN_KEY);
  if (tok) {
    lib.token = tok;
    lib.remember = true;
  }
  setSectionLibrary(effectiveBeams());
}

function sectionNamesUsed(m) {
  const n = Math.max(1, Math.min(24, Math.round(Number(m.nElements) || 1)));
  const names = new Set([m.defaultSection]);
  for (const el of (Array.isArray(m.elements) ? m.elements : []).slice(0, n)) names.add(el?.section || m.defaultSection);
  return [...names].filter((s) => typeof s === "string" && !isCustomName(s));
}

function sectionDefOf(b) {
  const { name, embedded, missing, ...rest } = b;
  return rest;
}

// A model carries the properties of every section it uses (sectionDefs), so an exported file
// or a saved model still analyses the same if that section later leaves the library.
//  - A library beam's copy follows the library, except when its A, I, Z or Av differ from the
//    copy already saved (a colleague's file, or a beam changed elsewhere since): then the saved
//    copy is kept and the analysis says the library's values are used, until the user accepts
//    them. accept: a Set of names whose copy should follow the library now (the user changed
//    that beam here), or true for all.
//  - Copies of sections that are in no library, or whose values differ from the library's, are
//    kept even while nothing uses them, so choosing another section and then going back does not
//    lose them. "Remove unused copies" on the Beams tab drops them.
function syncSectionDefs(m, accept = null) {
  const old = m.sectionDefs && typeof m.sectionDefs === "object" ? m.sectionDefs : {};
  const own = (o, n) => Object.prototype.hasOwnProperty.call(o, n);
  const takes = (n) => accept === true || (accept instanceof Set && accept.has(n));
  const kept = (n) => {
    const b = normaliseBeam({ ...old[n], name: n });
    return b ? sectionDefOf(b) : null;
  };
  const inLibrary = (n) => SECTION_LIBRARY.find((s) => s !== CUSTOM_SECTION && s.name === n) ?? null;
  const used = new Set(sectionNamesUsed(m));
  const defs = {};
  for (const name of used) {
    const lib1 = inLibrary(name);
    if (lib1 && (!own(old, name) || takes(name) || !sectionPropsDiffer(lib1, old[name]).length)) defs[name] = sectionDefOf(lib1);
    else if (own(old, name)) {
      const d = kept(name);
      if (d) defs[name] = d;
    }
  }
  for (const name of Object.keys(old)) {
    if (own(defs, name) || used.has(name)) continue;
    const lib1 = inLibrary(name);
    if (lib1 && (takes(name) || !sectionPropsDiffer(lib1, old[name]).length)) continue;
    const d = kept(name);
    if (d) defs[name] = d;
  }
  return { ...m, sectionDefs: defs };
}

async function fetchBeamDoc(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// Fetches beams.json: from the live site first (same origin, no rate limit), then straight
// from the repository (for a copy of the page opened from disk).
async function loadLibrary() {
  if (typeof fetch !== "function" || lib.saving || lib.loading) return;
  lib.loading = true;
  if (ui.tab === "beams") renderWhenIdle();
  let doc = null;
  let missing = false;
  for (const url of [`${BEAM_REPO.path}?t=${Date.now()}`, GH_RAW_URL]) {
    try {
      doc = await fetchBeamDoc(url);
      break;
    } catch (e) {
      if (/HTTP 404/.test(String(e?.message))) missing = true;
    }
  }
  lib.loading = false;
  if (!doc) {
    if (missing && lib.source === "none") {
      lib.message = { tone: "muted", text: "beams.json is not on GitHub yet. Add beams here and save them to create it." };
    } else if (missing) {
      lib.missing = true;
      lib.message = { tone: "warn", text: `beams.json is no longer on GitHub (deleted or reverted). The copy saved in this browser is shown (${effectiveBeams().length} beams); "Save to GitHub" writes it there again.` };
    } else {
      lib.message = {
        tone: "warn",
        text: lib.source === "cache"
          ? "Couldn't reach GitHub. Showing the copy of the beam library saved in this browser."
          : "Couldn't load the beam library from GitHub. Check the connection and press Reload.",
      };
    }
    renderWhenIdle();
    return;
  }
  const file = normaliseBeamFile(doc);
  if (!file) {
    lib.message = { tone: "danger", text: "beams.json on GitHub is not in the expected format. Fix or revert it on GitHub.", link: GH_HISTORY_URL, linkText: "File history" };
    renderWhenIdle();
    return;
  }
  const justSaved = lib.base.savedAt && Date.now() - lib.base.savedAt < PAGES_LAG_MS;
  if (justSaved && file.revision < lib.base.revision) {
    lib.message = { tone: "muted", text: `The live site is still publishing revision ${lib.base.revision} of the library; it is shown from this browser meanwhile.` };
  } else {
    lib.missing = false;
    const u = lib.uncertain;
    if (u && JSON.stringify(file.beams) === u.merged) {
      // A save whose reply was lost did go through: handle it as a save.
      lib.uncertain = null;
      adoptSavedBase(file, 0, u.ops, -1);
      lib.touched = null;
    } else {
      lib.base = { revision: file.revision, updated: file.updated, beams: file.beams, savedAt: 0 };
      lib.source = "github";
      compactPending();
    }
    if (lib.message?.tone !== "ok") lib.message = null;
    if (file.skipped) {
      lib.message = {
        tone: "warn",
        text: `${file.skipped} ${file.skipped === 1 ? "entry" : "entries"} in beams.json could not be used (no name, a repeated name, or I, Z or A not greater than zero) and ${file.skipped === 1 ? "was" : "were"} skipped. Saving from here is blocked until it is fixed on GitHub, so ${file.skipped === 1 ? "it is" : "they are"} not lost.`,
        link: GH_FILE_URL,
        linkText: "Open beams.json",
      };
    }
  }
  persistLibrary();
  // Copies start-up made from this browser's cached library were never saved with the model:
  // they follow GitHub's version, instead of being taken for "the copy saved with this model".
  applyLibrary(ui.bootCopies);
  ui.bootCopies = null;
  renderWhenIdle();
}

function utf8ToBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function base64ToUtf8(b64) {
  const bin = atob(String(b64).replace(/\s+/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghHeaders(json, accept = "application/vnd.github+json") {
  const h = { Accept: accept, Authorization: `Bearer ${lib.token}`, "X-GitHub-Api-Version": "2022-11-28" };
  if (json) h["Content-Type"] = "application/json";
  return h;
}

async function ghErrorText(res) {
  let body = null;
  try {
    body = await res.json();
  } catch {
    /* no body */
  }
  const detail = typeof body?.message === "string" ? body.message.split(/\s*\n+\s*/).filter(Boolean).join(" ").slice(0, 300) : "";
  const said = detail ? ` GitHub said: "${detail}"` : "";
  const repo = `${BEAM_REPO.owner}/${BEAM_REPO.repo}`;
  if (res.status === 401) return "GitHub did not accept the token. It may be mistyped, expired or revoked.";
  if (res.status === 403 && res.headers?.get?.("x-ratelimit-remaining") === "0") return "GitHub's rate limit was reached. Try again in a few minutes.";
  if (res.status === 403 && /too.?large/i.test(`${body?.errors?.map?.((e) => e?.code).join(" ") || ""} ${detail}`)) return `beams.json is too large for GitHub's contents API.${said}`;
  if (res.status === 403 || res.status === 404) {
    return `GitHub refused access to ${repo} (${res.status}). The token needs access to that repository with Contents: Read and write; an organisation's single sign-on or a branch rule can also block it.${said}`;
  }
  return `GitHub returned ${res.status}.${said}`;
}

function libraryCommitMessage(diff) {
  const parts = [];
  if (diff.added.length) parts.push(`add ${diff.added.join(", ")}`);
  if (diff.changed.length) parts.push(`update ${diff.changed.join(", ")}`);
  if (diff.removed.length) parts.push(`remove ${diff.removed.join(", ")}`);
  let subject = `Beam library: ${parts.join("; ")}`;
  if (subject.length > 72) subject = `Beam library: ${diff.count} change${diff.count === 1 ? "" : "s"}`;
  const lines = [
    ...diff.added.map((n) => `+ ${n}`),
    ...diff.changed.map((n) => `~ ${n}`),
    ...diff.removed.map((n) => `- ${n}`),
  ];
  return `${subject}\n\n${lines.join("\n")}\n\nSaved from the CBA app (Beams tab).`;
}

// beams.json as it is on GitHub now, through the API (always current, unlike the live site).
// rawOf maps each parsed beam to its entry exactly as written in the file, and extra holds
// top-level fields the app does not use, so a save writes both back untouched.
async function readRemoteLibrary() {
  const url = `${GH_CONTENTS_URL}?ref=${encodeURIComponent(BEAM_REPO.branch)}`;
  const getRes = await fetch(url, { headers: ghHeaders(false, "application/vnd.github.object+json"), cache: "no-store" });
  if (getRes.status === 404) {
    // Either the file does not exist yet (the save creates it), or the token cannot see the
    // repository. When this browser has seen the file, it is the token; say so rather than
    // treat the library as empty.
    if (lib.base.revision > 0 || lib.base.beams.length) {
      // This browser has seen the file: either it was deleted, or the token cannot see the
      // repository. The repository itself tells which.
      const repoRes = await fetch(GH_REPO_URL, { headers: ghHeaders(false), cache: "no-store" });
      if (!repoRes.ok) throw new Error(`${await ghErrorText(repoRes)} (beams.json was on GitHub at revision ${lib.base.revision}; this token cannot read the repository.)`);
      // Deleted. Saving re-creates it from the copy this browser shows (the last one seen on
      // GitHub, with this browser's edits), as the page says.
      return { revision: lib.base.revision, updated: lib.base.updated, beams: lib.base.beams, rawOf: new Map(), extra: {}, sha: null, deleted: true };
    }
    return { revision: 0, updated: null, beams: [], rawOf: new Map(), extra: {}, sha: null };
  }
  if (!getRes.ok) throw new Error(await ghErrorText(getRes));
  const body = await getRes.json();
  let text;
  if (body?.encoding === "none" || typeof body?.content !== "string") {
    // Over 1 MB the contents API leaves the content out; ask for the file itself.
    const rawRes = await fetch(url, { headers: ghHeaders(false, "application/vnd.github.raw+json"), cache: "no-store" });
    if (!rawRes.ok) throw new Error(await ghErrorText(rawRes));
    text = await rawRes.text();
  } else {
    text = base64ToUtf8(body.content);
  }
  let doc;
  try {
    doc = JSON.parse(text);
  } catch {
    throw new Error("beams.json on GitHub is not valid JSON. Fix or revert it on GitHub, then save again.");
  }
  const f = normaliseBeamFile(doc);
  if (!f) throw new Error("beams.json on GitHub is not in the expected format. Fix or revert it on GitHub, then save again.");
  if (f.skipped) throw new Error(`beams.json on GitHub has ${f.skipped} ${f.skipped === 1 ? "entry" : "entries"} the app cannot read. Fix ${f.skipped === 1 ? "it" : "them"} on GitHub first, so saving from here does not drop ${f.skipped === 1 ? "it" : "them"}.`);
  // Nothing was skipped, so the parsed beams and the file's entries correspond one to one.
  const list = Array.isArray(doc) ? doc : doc.beams;
  const rawOf = new Map(f.beams.map((b, i) => [b, list[i]]));
  const extra = {};
  if (!Array.isArray(doc)) for (const [k, v] of Object.entries(doc)) if (!BEAM_FILE_KEYS.includes(k)) extra[k] = v;
  return { ...f, rawOf, extra, sha: body.sha };
}

// GitHub's copy becomes the base. Edits made while the save was in flight are not in it: for
// each beam edited meanwhile, the pending edit becomes whatever turns GitHub's new copy into what
// this browser shows, even when that is the state before the save (a beam added by this save
// and deleted meanwhile is deleted again). An edit to a beam this save wrote starts from what was
// written; any other keeps the GitHub version it started from, so a colleague's change is still
// caught.
function adoptSavedBase(file, savedAt, savedOps, seq) {
  const want = effectiveBeams();
  const oldBase = lib.base.beams;
  const startedFrom = new Map();
  for (const op of lib.pending) if ("base" in op && !startedFrom.has(lower(opName(op)))) startedFrom.set(lower(opName(op)), op.base);
  const touched = lib.touched || new Set();
  lib.base = { revision: file.revision, updated: file.updated, beams: file.beams, savedAt };
  lib.source = "github";
  if (lib.editSeq === seq) {
    lib.pending = [];
    return;
  }
  const written = new Set(savedOps.map((op) => lower(opName(op))));
  const ops = [];
  for (const k of touched) {
    // Edited and put back meanwhile, and not part of this save: nothing to keep, and GitHub's
    // version (perhaps a colleague's change merged by this save) stands.
    if (!written.has(k) && !startedFrom.has(k)) continue;
    const mine = beamNamed(want, k);
    const theirs = beamNamed(file.beams, k);
    const base = written.has(k) ? theirs : startedFrom.has(k) ? startedFrom.get(k) : beamNamed(oldBase, k);
    if (!mine && theirs) ops.push({ op: "delete", name: theirs.name, base });
    else if (mine && !sameBeamOrNone(mine, theirs)) ops.push({ op: "upsert", beam: mine, base });
  }
  lib.pending = ops;
  compactPending();
}

// Commits this browser's library edits to beams.json on GitHub. The edits are replayed on the
// file as it is on GitHub at that moment, so beams a colleague saved meanwhile are kept. If a
// colleague changed or deleted a beam that was also edited here, nothing is written: both
// versions are shown and the user picks one. If someone saves between our read and our write,
// GitHub refuses the stale write and we read again.
async function saveLibraryToGitHub() {
  if (lib.saving) return;
  if (!lib.token) {
    lib.message = { tone: "warn", text: "Enter a GitHub token in the GitHub card first." };
    renderWhenIdle();
    return;
  }
  if (typeof fetch !== "function") return;
  lib.saving = true;
  // After a lost reply, keep tracking edits until it is known whether that save went through.
  if (!lib.uncertain) lib.touched = new Set();
  lib.message = { tone: "muted", text: "Saving to GitHub…" };
  renderWhenIdle();
  try {
    let refused = null; // { sha, text } of a write GitHub turned down
    for (let attempt = 0; attempt < 3; attempt++) {
      const remote = await readRemoteLibrary();
      const u = lib.uncertain;
      if (u) {
        lib.uncertain = null;
        // The earlier save whose reply was lost: if GitHub holds what it sent, it went through.
        if (remote.sha !== u.sha && JSON.stringify(remote.beams) === u.merged) adoptSavedBase(remote, Date.now(), u.ops, -1);
        lib.touched = new Set();
      }
      // Refused although the file has not changed: not a race, so retrying cannot help.
      if (refused && remote.sha === refused.sha) throw new Error(refused.text);
      const seq = lib.editSeq;
      const ops = lib.pending.slice();
      const conflicts = pendingConflicts(remote.beams);
      if (conflicts.length) {
        // Read through the API, so current: savedAt stops the live site's older copy replacing it.
        lib.base = { revision: remote.revision, updated: remote.updated, beams: remote.beams, savedAt: Date.now() };
        lib.source = "github";
        compactPending();
        const names = conflicts.map((c) => c.name).join(", ");
        lib.message = {
          tone: "danger",
          text: `Not saved. Someone else changed ${conflicts.length === 1 ? "this beam" : "these beams"} on GitHub after you edited ${conflicts.length === 1 ? "it" : "them"} here: ${names}. Choose which version to keep below, then save again.`,
        };
        return;
      }
      const merged = applyBeamOps(remote.beams, ops);
      const diff = remote.deleted ? beamDiff([], merged) : beamDiff(remote.beams, merged);
      if (!diff.count && !remote.deleted) {
        adoptSavedBase(remote, Date.now(), ops, seq);
        lib.message = { tone: "ok", text: "GitHub already has these beams. Nothing to save." };
        return;
      }
      const next = { revision: remote.revision + 1, updated: new Date().toISOString(), beams: merged };
      // Beams nobody edited are written back exactly as they were in the file.
      const written = beamFileDoc({ ...next, beams: merged.map((b) => remote.rawOf.get(b) ?? b) }, remote.extra);
      let putRes = null;
      let lost = null;
      try {
        putRes = await fetch(GH_CONTENTS_URL, {
          method: "PUT",
          headers: ghHeaders(true),
          body: JSON.stringify({
            message: remote.deleted ? `Beam library: re-create beams.json (${merged.length} beam${merged.length === 1 ? "" : "s"})\n\nbeams.json was missing from the repository; written again from the CBA app's copy.` : libraryCommitMessage(diff),
            content: utf8ToBase64(`${JSON.stringify(written, null, 2)}\n`),
            branch: BEAM_REPO.branch,
            ...(remote.sha ? { sha: remote.sha } : {}),
          }),
        });
      } catch (e) {
        lost = e;
      }
      if (lost || putRes.status >= 500) {
        // The write may have been committed with its reply lost. If GitHub now holds exactly what
        // was sent, it was: carry on as after a save, so edits made meanwhile are handled as such.
        let check = null;
        try {
          check = await readRemoteLibrary();
        } catch {
          /* still unreachable */
        }
        if (check && check.sha !== remote.sha && JSON.stringify(check.beams) === JSON.stringify(merged)) {
          adoptSavedBase(check, Date.now(), ops, seq);
          lib.message = { tone: "ok", text: `Saved to GitHub as revision ${check.revision}. The live site picks it up in about a minute.`, link: GH_HISTORY_URL, linkText: "File history" };
          return;
        }
        // Still unknown: check at the next read of GitHub (next save or reload).
        lib.uncertain = { merged: JSON.stringify(merged), sha: remote.sha, ops };
        if (lost) throw lost;
      }
      if (putRes.status === 409 || putRes.status === 422) {
        refused = { sha: remote.sha, text: await ghErrorText(putRes) };
        continue; // probably changed under us: read again
      }
      if (!putRes.ok) throw new Error(await ghErrorText(putRes));
      const out = await putRes.json().catch(() => ({}));
      adoptSavedBase(next, Date.now(), ops, seq);
      const summary = [
        diff.added.length ? `${diff.added.length} added` : "",
        diff.changed.length ? `${diff.changed.length} updated` : "",
        diff.removed.length ? `${diff.removed.length} removed` : "",
      ].filter(Boolean).join(", ");
      const later = lib.pending.length ? ` ${lib.pending.length} later change${lib.pending.length === 1 ? " is" : "s are"} still to save.` : "";
      lib.missing = false;
      lib.message = {
        tone: "ok",
        text: `Saved to GitHub as revision ${next.revision} (${summary}). The live site picks it up in about a minute.${later}`,
        link: out?.commit?.html_url || GH_HISTORY_URL,
        linkText: "View commit",
      };
      return;
    }
    throw new Error("beams.json kept changing on GitHub while saving. Press Reload, then save again.");
  } catch (e) {
    const offline = e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(String(e?.message));
    lib.message = {
      tone: "danger",
      text: offline
        ? lib.uncertain
          ? "Couldn't reach GitHub to confirm the save. Your edits are kept in this browser; press Save to GitHub again when the connection is back."
          : "Couldn't reach GitHub. Check the connection and try again; your edits are still saved in this browser."
        : String(e?.message || e),
    };
  } finally {
    lib.saving = false;
    if (!lib.uncertain) lib.touched = null;
    persistLibrary();
    applyLibrary();
    // Not render(): a field being typed in meanwhile would lose its text and focus.
    renderWhenIdle();
    if (!ui.renderQueued) focusFirst(["beams-save"], ["new-beam"]);
  }
}

function downloadBeamFile() {
  const doc = beamFileDoc({ revision: lib.base.revision, updated: new Date().toISOString(), beams: effectiveBeams() });
  downloadBlob(`${JSON.stringify(doc, null, 2)}\n`, "application/json", "beams.json");
}

// Points the model's elements and default section from one section name to another, and drops
// the saved copy under the old name.
function renameModelSections(m, renames) {
  let next = m;
  for (const [from, to] of renames) {
    if (from === to) continue;
    const defs = { ...(next.sectionDefs || {}) };
    delete defs[from];
    next = {
      ...next,
      sectionDefs: defs,
      defaultSection: next.defaultSection === from ? to : next.defaultSection,
      elements: next.elements.map((el) => (el.section === from ? { ...el, section: to } : el)),
    };
  }
  return next;
}

// Adds, replaces or removes beams in this browser; they reach GitHub on "Save to GitHub". The
// model's saved copies of the beams changed here follow the new values.
function commitBeamOps(ops, renames = []) {
  noteTouched(ops.flatMap((op) => [opName(op), op.from]));
  lib.pending.push(...ops);
  lib.editSeq++;
  compactPending();
  persistLibrary();
  setSectionLibrary(effectiveBeams());
  const accept = new Set(ops.filter((op) => op.op === "upsert").map((op) => op.beam.name));
  setModelQuietly(syncSectionDefs(renameModelSections(model, renames), accept));
}

// Another tab saved, edited or discarded library changes: take them over, so the two tabs never
// overwrite each other's unsaved edits in storage.
function onLibraryStorage(ev) {
  if (ev.key !== null && ev.key !== BEAM_CACHE_KEY && ev.key !== BEAM_PENDING_KEY) return;
  const before = lib.pending.map(opName);
  readLibraryStorage();
  noteTouched([...before, ...lib.pending.map(opName)]);
  lib.editSeq++;
  // In memory only: this tab did nothing, so it must not write its model (see applyLibrary).
  applyLibrary();
  renderWhenIdle();
}

/* ---- Beam form (Beams tab) --------------------------------------------------------------- */

// "1,943" or "48,200": a comma followed by exactly three digits is a thousands separator in one
// convention and a decimal comma in another. Such a value is never guessed at.
function isAmbiguousNumber(v) {
  return /^-?[1-9]\d{0,2},\d{3}$/.test(String(v ?? "").trim().replace(/\s+/g, ""));
}

// Reads a typed or pasted number. Spaces group thousands. decimal is the decimal mark ("." or
// ","), when known for the whole table; otherwise it is worked out from the value itself, and
// an ambiguous value (see isAmbiguousNumber) gives NaN.
function parseNum(v, decimal = null) {
  if (v === null || v === undefined) return NaN;
  const s = String(v).trim().replace(/\s+/g, "").replace(/^\+/, "");
  if (!s) return NaN;
  const commas = (s.match(/,/g) || []).length;
  const dots = (s.match(/\./g) || []).length;
  let dec = decimal;
  if (!dec) {
    if (commas && dots) dec = s.lastIndexOf(",") > s.lastIndexOf(".") ? "," : ".";
    else if (commas > 1) dec = ".";
    else if (dots > 1) dec = ",";
    else if (commas === 1) {
      if (isAmbiguousNumber(s)) return NaN;
      dec = ",";
    } else dec = ".";
  }
  const group = dec === "," ? "." : ",";
  const parts = s.split(dec);
  if (parts.length > 2) return NaN;
  const [whole, frac] = parts;
  if (whole.includes(group) && !(group === "," ? /^-?\d{1,3}(,\d{3})+$/ : /^-?\d{1,3}(\.\d{3})+$/).test(whole)) return NaN;
  const text = whole.split(group).join("") + (frac !== undefined ? `.${frac}` : "");
  if (!/^-?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(text)) return NaN;
  const n = Number(text);
  return Number.isFinite(n) ? n : NaN;
}
// "1.808" read where a decimal point would make no sense (a section property in mm units) is
// as ambiguous as "1,808", when nothing else shows the decimal mark.
function isAmbiguousDot(v) {
  return /^-?[1-9]\d{0,2}\.\d{3}$/.test(String(v ?? "").trim().replace(/\s+/g, ""));
}
function ambiguityProblem(label, raw) {
  const s = String(raw).trim().replace(/\s+/g, "");
  const sep = s.includes(",") ? "," : ".";
  return `${label}: "${s}" could mean ${s.replace(sep, "")} or ${s.replace(",", ".")}. Type it without the thousands separator${sep === "," ? ", or with a decimal point" : ""}.`;
}
function sig(v, digits = 6) {
  return Number.isFinite(v) ? Number(v.toPrecision(digits)) : v;
}
function todayIso() {
  return new Date().toISOString().slice(0, 10);
}
function closeTo(a, b, rel = 1e-4) {
  return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) <= rel * Math.max(Math.abs(a), Math.abs(b), 1e-12);
}

// Filled in when the user leaves Source empty; editing such a beam starts with Source empty
// again, so the text follows how the values were obtained.
const AUTO_SOURCES = ["Calculated from dimensions (nominal gross section)", "Entered by user", "Pasted from a table"];

// typed: the property fields holding the user's own values (typed now, or stored values the
// calculation does not give). With "Enter my own values" the others follow the calculation, so a
// later change of dimensions or material never leaves stale values. typedNow and rawTyped: the
// property and dimension fields typed in since the form opened, whose decimal mark the user chose.
function editBase(name) {
  const op = lib.pending.find((o) => "base" in o && lower(o.from ?? opName(o)) === lower(name));
  return op ? op.base : beamNamed(lib.base.beams, name);
}

function newBeamDraft(fromName) {
  const b = fromName ? effectiveBeams().find((x) => x.name === fromName) : null;
  if (!b) {
    return {
      mode: "add", from: null, original: null, base: null, shape: "lipped", raw: {}, rawTyped: {}, dims: {}, props: {}, typed: {}, typedNow: {}, override: false,
      name: "", nameTouched: false, material: "Steel", source: "", notes: "",
    };
  }
  const spec = shapeSpec(b.shape);
  const shape = spec && b.shape !== "manual" && b.dims ? b.shape : "manual";
  const calc = shape === "manual" ? null : sectionFromShape(shape, b.dims);
  const density = BEAM_DENSITY[b.material];
  const calcMass = calc?.ok && density ? calc.A * 1e-6 * density : null;
  // Every stored value must match the calculation for the form to open in calculated mode;
  // otherwise a supplier's mass or depth would be replaced by the calculated one on saving.
  const matches = calc?.ok && ["A", "I", "Z", "Av"].every((k) => closeTo(calc[k], b[k]))
    && (b.h === null || b.h === undefined || closeTo(calc.h, b.h))
    && (b.mass === null || b.mass === undefined || closeTo(calcMass, b.mass, 1e-3));
  const raw = {};
  for (const [k, v] of Object.entries(b.dims || {})) raw[k] = String(v);
  const str = (v) => (v === null || v === undefined ? "" : String(v));
  const props = { A: str(b.A), I: str(b.I), Z: str(b.Z), Av: str(b.Av), h: str(b.h), mass: str(b.mass) };
  // The user's own values are the stored ones the calculation does not give (a supplier's mass,
  // say); the rest follow the dimensions when they are changed.
  const typed = {};
  if (!calc?.ok) for (const [k, v] of Object.entries(props)) typed[k] = v !== "";
  else {
    for (const k of ["A", "I", "Z", "Av", "h"]) typed[k] = props[k] !== "" && !closeTo(calc[k], b[k]);
    const autoMass = density ? (typed.A ? b.A : calc.A) * 1e-6 * density : NaN;
    typed.mass = props.mass !== "" && !closeTo(autoMass, b.mass, 1e-3);
  }
  return {
    // base: the GitHub version this edit starts from, fixed now, so a colleague's change that
    // arrives while the form is open is still caught as a conflict when saving.
    mode: "edit", from: b.name, original: b, base: editBase(b.name), shape, raw, rawTyped: {}, dims: { ...(b.dims || {}) }, props, typed, typedNow: {},
    override: shape === "manual" || !matches,
    name: b.name, nameTouched: true, material: b.material || "Other", source: AUTO_SOURCES.includes(b.source) ? "" : b.source || "", notes: b.notes || "",
  };
}

const PROP_FIELDS = [
  { k: "A", label: "A", unit: "mm²" },
  { k: "I", label: "I", unit: "mm⁴" },
  { k: "Z", label: "Z", unit: "mm³" },
  { k: "Av", label: "Av", unit: "mm²" },
  { k: "h", label: "h", unit: "mm" },
  { k: "mass", label: "Mass", unit: "kg/m" },
];

// One decimal mark for the whole form, worked out as for a pasted table: "36.920.000" typed in
// one field means "5.383" in another is 5383, and "2,5" means "1.250" is 1250.
// Only what the user typed counts: values the app filled in itself (an edited beam's stored
// dimensions, calculated properties) are written with a decimal point and read that way.
function draftDecimalMark(d) {
  const own = d.override || d.shape === "manual";
  const typedDims = Object.entries(d.raw || {}).filter(([k]) => d.rawTyped?.[k]).map(([, v]) => v);
  const typedProps = own ? PROP_FIELDS.filter(({ k }) => d.typedNow?.[k]).map(({ k }) => d.props[k]) : [];
  return tableDecimalMark([...typedDims, ...typedProps], null);
}
// A form value as a number: typed values with the form's decimal mark, the app's own with ".".
function draftNum(d, v, typed, mark = draftDecimalMark(d)) {
  return parseNum(v, typed ? mark : ".");
}
function syncDraftDims(d) {
  const mark = draftDecimalMark(d);
  for (const [k, v] of Object.entries(d.raw || {})) d.dims[k] = draftNum(d, v, d.rawTyped?.[k], mark);
}

// Fills the property fields the user has not typed in from the calculation; the mass from the
// area actually used. Only with "Enter my own values" on a calculated shape.
function refreshAutoProps(d) {
  if (!d || !d.override || d.shape === "manual") return;
  const calc = sectionFromShape(d.shape, d.dims);
  const density = BEAM_DENSITY[d.material];
  const typedA = d.typed.A ? draftNum(d, d.props.A, d.typedNow?.A) : NaN;
  for (const { k } of PROP_FIELDS) {
    if (d.typed[k]) continue;
    let v = calc.ok ? calc[k] : NaN;
    if (k === "mass") {
      const area = Number.isFinite(typedA) ? typedA : calc.ok ? calc.A : NaN;
      v = density && Number.isFinite(area) ? area * 1e-6 * density : NaN;
    }
    d.props[k] = Number.isFinite(v) ? String(sig(v, 6)) : "";
  }
}

// Everything the form would add: { beam, problems, calc, own, values }.
function draftResult(draft) {
  const spec = shapeSpec(draft.shape);
  const calc = draft.shape === "manual" ? null : sectionFromShape(draft.shape, draft.dims);
  const own = draft.override || draft.shape === "manual";
  const problems = [];
  const mark = draftDecimalMark(draft);
  if (spec && !mark) for (const [k, label] of spec.dims) if (draft.rawTyped?.[k] && isAmbiguousNumber(draft.raw[k])) problems.push(ambiguityProblem(label, draft.raw[k]));
  if (!own && calc && !calc.ok) problems.push(...calc.problems);
  // A backstop for unit slips in the dimensions: beams in this app are not metres deep.
  if (calc?.ok && Math.max(...Object.values(draft.dims).filter(Number.isFinite)) > 3000) problems.push("A dimension is over 3 m. Dimensions are in mm.");
  const density = BEAM_DENSITY[draft.material];
  const calcMass = calc?.ok && density ? calc.A * 1e-6 * density : null;
  const values = {};
  for (const { k, label } of PROP_FIELDS) {
    const c = calc?.ok ? (k === "mass" ? calcMass : calc[k]) : null;
    if (!own) values[k] = c;
    else {
      // A section property in mm units with a lone "d.ddd" ("1.808") is as ambiguous as "1,808".
      if (!mark && draft.typedNow?.[k] && (isAmbiguousNumber(draft.props[k]) || (SECTION_KEYS.includes(k) && isAmbiguousDot(draft.props[k])))) problems.push(ambiguityProblem(label, draft.props[k]));
      const typed = draftNum(draft, draft.props[k], draft.typedNow?.[k], mark);
      values[k] = Number.isFinite(typed) ? typed : k === "h" ? c : NaN;
    }
  }
  // A blank mass comes from the area actually used, not the calculated one.
  if (own && !Number.isFinite(values.mass) && Number.isFinite(values.A) && density) values.mass = values.A * 1e-6 * density;
  if (own) {
    for (const k of ["A", "I", "Z"]) if (!(values[k] > 0)) problems.push(`${k} must be a number greater than zero.`);
    if (!(values.Av >= 0)) problems.push("Av must be a number, zero or more.");
    if (!problems.length) problems.push(...beamPlausibility({ ...values, material: draft.material }));
  }
  const name = String(draft.name || "").replace(/\s+/g, " ").trim();
  if (!name) problems.push("Give the beam a name.");
  else if (name.length > BEAM_NAME_MAX) problems.push(`Keep the name to ${BEAM_NAME_MAX} characters.`);
  else if (name.toLowerCase() === "custom") problems.push('"Custom" is reserved for the model\'s own properties.');
  else if (effectiveBeams().some((b) => b.name.toLowerCase() === name.toLowerCase() && b.name !== draft.from)) problems.push(`There is already a beam called "${name}".`);
  let beam = null;
  if (!problems.length) {
    const dims = {};
    if (calc?.ok) for (const [k] of spec.dims) dims[k] = draft.dims[k];
    // Editing keeps what the form does not show: hand-added fields and who added the beam.
    const kept = draft.original ? { ...beamExtras(draft.original), ...(draft.original.addedBy ? { addedBy: draft.original.addedBy } : {}) } : {};
    beam = normaliseBeam({
      ...kept,
      name,
      shape: calc?.ok ? draft.shape : "manual",
      ...(calc?.ok ? { dims } : {}),
      material: draft.material,
      h: Number.isFinite(values.h) ? sig(values.h) : null,
      mass: Number.isFinite(values.mass) ? sig(values.mass, 4) : null,
      A: sig(values.A), I: sig(values.I), Z: sig(values.Z), Av: sig(values.Av),
      source: draft.source || (own ? AUTO_SOURCES[1] : AUTO_SOURCES[0]),
      notes: draft.notes,
      updated: todayIso(),
    });
    if (!beam) problems.push("These values cannot be used.");
  }
  return { beam, problems, calc, own, values };
}

const SHAPE_NOTES = {
  i: "Root fillets included. Av = h × tw, the full-depth web area used for τ = V/Av.",
  channel: "Parallel flanges with root fillets; toe radii and flange taper are ignored. Bending about the major axis only. Av = h × tw.",
  lipped: "Gross section with rounded bends. Thin cold-formed walls can buckle locally, so stresses on the gross Z can be unconservative; check the effective section to the design code. Av = h × t.",
  rhs: "Inside corner radius = ro − t. Typical ro: about 2t for cold-formed (EN 10219, t ≤ 6 mm), 1.5t for hot-finished (EN 10210). Av = 2 × h × t.",
  chs: "Av = 2A/π (EN 1993-1-1, 6.2.6).",
  rect: "Bending about the depth h. Av = A (average shear).",
  manual: "Copy the major-axis values from the supplier's table. Mind the units: tables often give cm², cm⁴ and cm³.",
};

const DIM_HINTS = {
  lipped: { h: "e.g. 150", b: "e.g. 65", c: "e.g. 20", t: "e.g. 2.0", ri: "about t to 1.5t" },
  rhs: { ro: "about 2t (EN 10219)" },
  i: { r: "0 if unknown" },
  channel: { r: "0 if unknown" },

function beamPreviewSvg(shape, dims, calc) {
  if (shape === "manual" || !calc?.ok) {
    const msg = shape === "manual" ? "No drawing for direct entry" : "Enter the dimensions";
    return `<svg viewBox="0 0 160 160" class="beam-svg" role="img" aria-label="${esc(msg)}"><text x="80" y="84" text-anchor="middle" class="beam-svg-empty">${esc(msg)}</text></svg>`;
  }
  const rings = sectionOutline(shape, dims, 6);
  const pts = rings.flat();
  const xs = pts.map((p) => p[0]);
  const ys = pts.map((p) => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const s = 128 / Math.max(maxX - minX, maxY - minY, 1e-9);
  const ox = (160 - (maxX - minX) * s) / 2;
  const oy = (160 - (maxY - minY) * s) / 2;
  const pt = ([x, y]) => `${(ox + (x - minX) * s).toFixed(2)},${(oy + (maxY - y) * s).toFixed(2)}`;
  const d = rings.map((r) => `M${r.map(pt).join("L")}Z`).join("");
  const yAxis = (oy + (maxY - calc.yc) * s).toFixed(2);
  return `<svg viewBox="0 0 160 160" class="beam-svg" role="img" aria-label="Cross-section drawing">
    <path d="${d}" fill-rule="evenodd" class="beam-shape"/>
    <line x1="2" x2="158" y1="${yAxis}" y2="${yAxis}" class="beam-axis"/>
  </svg>`;
}

function beamCalcHtml(draft, res) {
  const { calc, own, values } = res;
  const showCalc = draft.shape !== "manual";
  const rows = PROP_FIELDS.map(({ k, label, unit }) => {
    const c = calc?.ok ? (k === "mass" ? (BEAM_DENSITY[draft.material] ? calc.A * 1e-6 * BEAM_DENSITY[draft.material] : null) : calc[k]) : null;
    const used = values[k];
    let delta = "";
    if (own && showCalc && Number.isFinite(c) && Number.isFinite(used) && c !== 0) {
      const pct = ((used - c) / c) * 100;
      const off = Math.abs(pct) > 5;
      delta = `<td class="num${off ? " off" : ""}">${pct >= 0 ? "+" : ""}${esc(formatNum(pct, 1))} %</td>`;
    } else if (own && showCalc) delta = `<td class="num subtle">—</td>`;
    const digits = k === "mass" ? 3 : k === "h" ? 2 : k === "I" || k === "Z" ? 0 : 1;
    return `<tr>
      <td>${esc(label)} <span class="subtle">${esc(unit)}</span></td>
      ${showCalc ? `<td class="num">${esc(formatNum(c ?? NaN, digits))}</td>` : ""}
      ${own ? `<td class="num">${esc(formatNum(used ?? NaN, digits))}</td>${delta}` : ""}
    </tr>`;
  }).join("");
  const head = `<tr><th>Property</th>${showCalc ? "<th>Calculated</th>" : ""}${own ? `<th>Used</th>${showCalc ? "<th>vs calc.</th>" : ""}` : ""}</tr>`;
  return `<table class="data tight beam-props"><thead>${head}</thead><tbody>${rows}</tbody></table>
    <p class="hint">${esc(SHAPE_NOTES[draft.shape] || "")}${calc?.ok ? ` Bending axis ${esc(formatNum(calc.yc, 2))} mm above the underside.` : ""}</p>`;
}

function beamProblemsHtml(res) {

// Live update while typing: only the results, drawing and messages are redrawn, so the field
