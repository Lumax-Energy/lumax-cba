function solveLinearSystem(K, f) {
  const n = f.length;
  if (n === 0) return [];
  const a = Array.from({ length: n }, (_, i) => {
    const row = K[i].slice();
    row.push(f[i]);
    return row;
  });
  for (let k = 0; k < n; k++) {
    let piv = k;
    let max = Math.abs(a[k][k]);
    for (let i = k + 1; i < n; i++) {
      const v = Math.abs(a[i][k]);
      if (v > max) {
        max = v;
        piv = i;
      }
    }
    if (max < 1e-18) throw new Error("singular");
    if (piv !== k) {
      const tmp = a[k];
      a[k] = a[piv];
      a[piv] = tmp;
    }
    const diag = a[k][k];
    for (let i = k + 1; i < n; i++) {
      const factor = a[i][k] / diag;
      if (factor === 0) continue;
      for (let j = k; j <= n; j++) a[i][j] -= factor * a[k][j];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = a[i][n];
    for (let j = i + 1; j < n; j++) s -= a[i][j] * x[j];
    const diag = a[i][i];
    if (Math.abs(diag) < 1e-18) throw new Error("singular");
    x[i] = s / diag;
  }
  return x;
}

function elementStiffness(L, E, I) {
  const a = (12 * E * I) / L ** 3;
  const b = (6 * E * I) / L ** 2;
  const c = (4 * E * I) / L;
  const d = (2 * E * I) / L;
  return [
    [a, b, -a, b],
    [b, c, -b, d],
    [-a, -b, a, -b],
    [b, d, -b, c],
  ];
}
function eqPoint(Pdown, xi, L) {
  const P = -Pdown;
  const N1 = 1 - 3 * xi ** 2 + 2 * xi ** 3;
  const N2 = L * (xi - 2 * xi ** 2 + xi ** 3);
  const N3 = 3 * xi ** 2 - 2 * xi ** 3;
  const N4 = L * (xi ** 3 - xi ** 2);
  return [P * N1, P * N2, P * N3, P * N4];

    (M * (-6 * xi + 6 * xi ** 2)) / L,
    M * (1 - 4 * xi + 3 * xi ** 2),
    (M * (6 * xi - 6 * xi ** 2)) / L,

  const p3 = (s) => s ** 3 - s ** 4 / 2;
  const p4 = (s) => -(s ** 3) / 3 + s ** 4 / 4;

    -wDown * L * (p1(xi2) - p1(xi1)),
    -wDown * L ** 2 * (p2(xi2) - p2(xi1)),
    -wDown * L * (p3(xi2) - p3(xi1)),
    -wDown * L ** 2 * (p4(xi2) - p4(xi1)),

}
function add4(a, b) {

  a[1] += b[1];
  a[2] += b[2];
  a[3] += b[3];

function loadApplies(load, x0, x1, isFirst) {
  if (!load.active) return false;
  if (!(Number.isFinite(load.magnitude) && load.magnitude !== 0)) return false;

    const x = load.x1;
    const eps0 = isFirst ? 1e-9 : 0;
    return x > x0 - eps0 && x <= x1 + 1e-9;
  }
  return load.x2 > x0 && load.x1 < x1 && load.x2 > load.x1;

function validateLoad(load, totalLength) {
  if (!load.active) return null;

    if (!Number.isFinite(load.x1) || !Number.isFinite(load.x2)) return `${load.id}: coordinates missing`;
    if (load.x2 <= load.x1) return `${load.id}: UDL x2 must be greater than x1`;

function macaulay(el, c, x, wSelf, includeSW, rightLimit) {
  let dV = 0, dM = 0, dS = 0, dD = 0;
  // rightLimit = true evaluates the limit from inside the element, so a point load or
  // moment sitting exactly at x is included. Used at the very start of the beam, where
  // there is no preceding element to carry the other face of the discontinuity.
  const past = rightLimit ? (a) => x >= a : (a) => x > a;
  for (const m of el.mapped) {
    if (m.load.case !== c) continue;
    const r1 = Math.max(x - m.a, 0);
    const r2 = Math.max(x - m.b, 0);

      const P = m.load.magnitude * 1000;
      if (past(m.a)) dV += -P;
      dM += -P * r1;
      dS += (-P * r1 * r1) / 2;
      dD += (-P * r1 * r1 * r1) / 6;
    } else if (m.load.type === "Moment") {
      const M = m.load.magnitude * 1000;
      if (past(m.a)) dM += -M;
      dS += -M * r1;
      dD += (-M * r1 * r1) / 2;
    } else {
      const w = m.load.magnitude * 1000;
      dV += -w * (r1 - r2);
      dM += (-w * (r1 * r1 - r2 * r2)) / 2;
      dS += (-w * (r1 ** 3 - r2 ** 3)) / 6;
      dD += (-w * (r1 ** 4 - r2 ** 4)) / 24;

    dM += (-wSelf * x * x) / 2;

function analyze(model) {

  for (let i = 0; i < nEl; i++) {
    const L = Math.max(elements[i]?.length ?? 0, 0);
    nodeX.push(nodeX[i] + L);
    const sec = resolveSection(elements[i]?.section || model.defaultSection, custom);
    sectionAt.push({ I: sec.I, Z: sec.Z, A: sec.A, Av: sec.Av, name: sec.name });

  if (model.nElements > 24) warnings.push(`Model declares ${model.nElements} elements; only the first 24 are analysed.`);

    if ((elements[i]?.length ?? 0) <= 0) warnings.push(`Element ${i + 1} has non-positive length.`);
    if (sectionAt[i].I <= 0) warnings.push(`Element ${i + 1} has I ≤ 0.`);
    if (sectionAt[i].Z <= 0) warnings.push(`Element ${i + 1} has Z ≤ 0 — bending stress is reported as zero there.`);
    if (sectionAt[i].Av <= 0) warnings.push(`Element ${i + 1} has Av ≤ 0 — shear stress is reported as zero there.`);
  }

    if (!ld.active || !Number.isFinite(ld.magnitude) || ld.magnitude === 0) continue;

      warnings.push(`${ld.id}: UDL runs from ${formatNum(ld.x1, 3)} to ${formatNum(ld.x2, 3)} m; only the part on the beam (0 to ${formatNum(totalLength, 3)} m) is applied.`);
    }

  const emptySelected = {
    id: model.selectedComboId,
    name: model.combinations.find((c) => c.id === model.selectedComboId)?.name ?? "",
    factors: emptyCaseMap(0),
    V: [], M: [], v: [], slopeDeg: [], tau: [], sigmaTop: [], sigmaBot: [], extrema: [],
  };
  const fail = (status) => ({
    ok: false, status, solverReady: false, supportStable, invalidLoads, warnings, totalLength,
    E: E_mpa, density, nElements: nEl, nNodes, nodeX, stations: [], reactions: [],
    selected: emptySelected, comboResults: [], envelope: [],
    equilibrium: LOAD_CASES.map((c) => ({ case: c, applied: 0, reactions: 0, residual: 0, ok: true })),
    continuity: [],
    deflectionCheck: { longestSpan: 0, limitN: model.deflectionLimitN, allowableMm: 0, maxAbsMm: 0, utilisation: 0, spans: [], governingLabel: "—", status: "N/A" },
    sectionAt, defaultI: resolveSection(model.defaultSection, custom).I,
  });
  if (!supportStable) return fail("UNSTABLE SUPPORTS");
  if (totalLength <= 0 || warnings.some((w) => w.includes("I ≤ 0") || w.includes("non-positive"))) return fail("INVALID GEOMETRY");

  const nDof = nNodes * 2;
  const K = Array.from({ length: nDof }, () => new Array(nDof).fill(0));
  const F = { G: new Array(nDof).fill(0), Q1: new Array(nDof).fill(0), Q2: new Array(nDof).fill(0), "W+": new Array(nDof).fill(0), "W-": new Array(nDof).fill(0), O: new Array(nDof).fill(0) };
  const elems = [];
  for (let e = 0; e < nEl; e++) {
    const L = elements[e].length;
    const x0 = nodeX[e];
    const x1 = nodeX[e + 1];
    const I = sectionAt[e].I * 1e-12;
    const Z = sectionAt[e].Z * 1e-9;
    const A = sectionAt[e].A * 1e-6;
    const Av = sectionAt[e].Av * 1e-6;
    const ke = elementStiffness(L, E, I);
    const dofs = [2 * e, 2 * e + 1, 2 * e + 2, 2 * e + 3];
    for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) K[dofs[a]][dofs[b]] += ke[a][b];
    const f = { G: zeros4(), Q1: zeros4(), Q2: zeros4(), "W+": zeros4(), "W-": zeros4(), O: zeros4() };
    const mapped = [];
    for (const ld of model.loads) {
      if (!loadApplies(ld, x0, x1, e === 0)) continue;
      let fe, a = 0, b = 0;
      if (ld.type === "UDL") {

        b = a;
        fe = eqPoint(ld.magnitude * 1000, a / L, L);

        b = a;
        fe = eqMoment(ld.magnitude * 1000, a / L, L);

      mapped.push({ load: ld, a, b });
    }
    const wSelf = density * (sectionAt[e].A * 1e-6) * G_ACCEL;
    if (model.includeSelfWeight) add4(f.G, eqUdl(wSelf, 0, 1, L));
    for (const c of LOAD_CASES) for (let a = 0; a < 4; a++) F[c][dofs[a]] += f[c][a];
    elems.push({
      L, x0, x1, E, I, Z, A, Av, name: sectionAt[e].name, ke, f,
      q: { G: zeros4(), Q1: zeros4(), Q2: zeros4(), "W+": zeros4(), "W-": zeros4(), O: zeros4() },
      dofs, mapped,
    });
  }
  const constrained = [];
  for (const s of supports) {
    constrained.push(s === "Pinned" || s === "Roller" || s === "Fixed");
    constrained.push(s === "Fixed");
  }
  const free = [];
  for (let i = 0; i < nDof; i++) if (!constrained[i]) free.push(i);
  let solverReady = true;
  const U = { G: new Array(nDof).fill(0), Q1: new Array(nDof).fill(0), Q2: new Array(nDof).fill(0), "W+": new Array(nDof).fill(0), "W-": new Array(nDof).fill(0), O: new Array(nDof).fill(0) };
  try {
    if (free.length === 0) throw new Error("singular");
    const Kff = free.map((i) => free.map((j) => K[i][j]));
    for (const c of LOAD_CASES) {
      const ff = free.map((i) => F[c][i]);
      const uf = solveLinearSystem(Kff, ff);
      for (let k = 0; k < free.length; k++) U[c][free[k]] = uf[k];
    }
  } catch {
    solverReady = false;
  }
  if (!solverReady) return fail("SOLVER ERROR");
  const R = { G: new Array(nDof).fill(0), Q1: new Array(nDof).fill(0), Q2: new Array(nDof).fill(0), "W+": new Array(nDof).fill(0), "W-": new Array(nDof).fill(0), O: new Array(nDof).fill(0) };
  for (const c of LOAD_CASES) {
    for (let i = 0; i < nDof; i++) {
      let s = 0;
      for (let j = 0; j < nDof; j++) s += K[i][j] * U[c][j];

    }
  }
  for (const el of elems) {
    for (const c of LOAD_CASES) {
      const ue = el.dofs.map((d) => U[c][d]);
      const q = zeros4();
      for (let a = 0; a < 4; a++) {
        let s = 0;
        for (let b = 0; b < 4; b++) s += el.ke[a][b] * ue[b];
        q[a] = s - el.f[c][a];
      }
      el.q[c] = q;
    }
  }

  const selectedCombo = comboById.get(model.selectedComboId) ?? model.combinations[0] ?? {
    id: "none", name: "None", class: "User", factors: emptyCaseMap(0), notes: "",
  };
  const combos = model.combinations.filter((c) => LOAD_CASES.some((k) => (c.factors[k] ?? 0) !== 0));
  const refineCombos = combos.slice();
  if (!refineCombos.some((c) => c.id === selectedCombo.id)) refineCombos.push(selectedCombo);

  const nStat = model.stationsPerElement;
  const stations = [];
  for (let e = 0; e < nEl; e++) {
    const el = elems[e];
    const wSelf = density * el.A * G_ACCEL;
    const makeRec = (xi) => {
      const xloc = xi * el.L;
      const rec = {
        elementIndex: e, station: 0, xi, x: el.x0 + xloc,
        V: emptyCaseMap(), M: emptyCaseMap(), v: emptyCaseMap(), theta: emptyCaseMap(),
        side: xi <= EPS ? "left" : xi >= 1 - EPS ? "right" : "interior",
      };
      // At the very start of the beam there is no element to the left, so report the
      // limit from inside the beam; anywhere else the two faces sit on adjacent stations.
      const rightLimit = e === 0 && xi <= EPS;
      for (const c of LOAD_CASES) {
        const q = el.q[c];
        const { dV, dM, dS, dD } = macaulay(el, c, xloc, wSelf, model.includeSelfWeight, rightLimit);
        const V = q[0] + dV;
        const M = -q[1] + q[0] * xloc + dM;
        const th0 = U[c][el.dofs[1]];
        const v0 = U[c][el.dofs[0]];
        const EI = el.E * el.I;
        const th = th0 + (-q[1] * xloc + (q[0] * xloc * xloc) / 2 + dS) / EI;
        const v = v0 + th0 * xloc + ((-q[1] * xloc * xloc) / 2 + (q[0] * xloc ** 3) / 6 + dD) / EI;
        rec.V[c] = V / 1000;
        rec.M[c] = M / 1000;
        rec.v[c] = v * 1000;
        rec.theta[c] = th;
      }
      return rec;
    };
    // Combined rotation only, skipping cases the combination does not use — this is the
    // inner loop of the deflection-peak search, so it is worth keeping narrow.
    const thetaAt = (xi, f) => {
      const xloc = xi * el.L;
      let th = 0;
      for (const c of LOAD_CASES) {
        const g = f[c] ?? 0;
        if (g === 0) continue;
        const q = el.q[c];
        const { dS } = macaulay(el, c, xloc, wSelf, model.includeSelfWeight);
        th += g * (U[c][el.dofs[1]] + (-q[1] * xloc + (q[0] * xloc * xloc) / 2 + dS) / (el.E * el.I));
      }
      return th;
    };
    const xiSet = Array.from({ length: nStat }, (_, i) => i / (nStat - 1));
    for (const m of el.mapped) {
      if (m.load.type === "UDL") {
        if (m.a > EPS && m.a < el.L - EPS) xiSet.push(m.a / el.L - 1e-12, m.a / el.L + 1e-12);
        if (m.b > EPS && m.b < el.L - EPS) xiSet.push(m.b / el.L - 1e-12, m.b / el.L + 1e-12);
      } else if (m.a > EPS && m.a < el.L - EPS) {
        xiSet.push(m.a / el.L - 1e-12, m.a / el.L + 1e-12);
      }
    }
    let xis = uniqueSorted(xiSet.map((x) => Math.min(1, Math.max(0, x))));
    let recs = xis.map(makeRec);
    // Peak refinement. Between two neighbouring stations the combined shear is linear, so
    // its zero is the exact location of a stationary bending moment; the zero of the
    // combined rotation is the exact location of a stationary deflection. Without these
    // the reported extrema are only as good as the station spacing.
    const extra = [];
    for (const combo of refineCombos) {
      const f = combo.factors;
      const Vs = recs.map((r) => combine(r.V, f));
      const Ts = recs.map((r) => combine(r.theta, f));
      for (let i = 0; i + 1 < recs.length; i++) {
        const xa = recs[i].xi;
        const xb = recs[i + 1].xi;
        if (xb - xa < 1e-9) continue;
        if ((Vs[i] > 0 && Vs[i + 1] < 0) || (Vs[i] < 0 && Vs[i + 1] > 0)) {
          const t = Vs[i] / (Vs[i] - Vs[i + 1]);
          if (t > 0 && t < 1) extra.push(xa + t * (xb - xa));
        }
        if ((Ts[i] > 0 && Ts[i + 1] < 0) || (Ts[i] < 0 && Ts[i + 1] > 0)) {
          let lo = xa, hi = xb, flo = Ts[i];
          for (let k = 0; k < 30; k++) {
            const mid = (lo + hi) / 2;
            const fm = thetaAt(mid, f);
            if (fm === 0) { lo = mid; hi = mid; break; }
            if (flo < 0 === fm < 0) { lo = mid; flo = fm; } else hi = mid;
          }
          const t = (lo + hi) / 2;
          if (t > xa && t < xb) extra.push(t);
        }
      }
    }
    if (extra.length) {
      xis = uniqueSorted(xis.concat(extra.filter((t) => t > EPS && t < 1 - EPS)));
      recs = xis.map(makeRec);
    }
    recs.forEach((rec, idx) => {
      rec.station = idx;
      stations.push(rec);
    });
  }
  const reactions = supports
    .map((support, i) => ({ node: i + 1, x: nodeX[i], support, vertical: emptyCaseMap(), moment: emptyCaseMap() }))
    .filter((r) => r.support !== "Free")
    .map((r) => {
      const i = r.node - 1;
      for (const c of LOAD_CASES) {
        r.vertical[c] = R[c][2 * i] / 1000;
        r.moment[c] = R[c][2 * i + 1] / 1000;
      }
      return r;
    });
  const equilibrium = LOAD_CASES.map((c) => {
    let applied = 0;
    for (let i = 0; i < nDof; i += 2) applied += F[c][i] / 1000;
    let react = 0;
    for (let i = 0; i < nDof; i += 2) react += R[c][i] / 1000;
    const residual = applied + react;
    return { case: c, applied, reactions: react, residual, ok: Math.abs(residual) <= 1e-4 * (1 + Math.abs(applied)) };
  });
  const continuity = elems.map((el) => {
    let vRec = 0, vNod = 0;
    for (const c of LOAD_CASES) {
      const f = selectedCombo.factors[c] ?? 0;
      if (f === 0) continue;
      const q = el.q[c];
      const wSelf = density * el.A * G_ACCEL;
      const { dD } = macaulay(el, c, el.L, wSelf, model.includeSelfWeight);
      const th0 = U[c][el.dofs[1]];
      const v0 = U[c][el.dofs[0]];
      const EI = el.E * el.I;
      const v = v0 + th0 * el.L + ((-q[1] * el.L * el.L) / 2 + (q[0] * el.L ** 3) / 6 + dD) / EI;
      vRec += v * f;
      vNod += U[c][el.dofs[2]] * f;
    }
    const diffMm = (vRec - vNod) * 1000;
    return { element: elems.indexOf(el) + 1, diffMm, ok: Math.abs(diffMm) < 1e-6 };
  });
  const xOf = (i) => stations[i]?.x ?? 0;
  const verticalXs = nodeX.filter((_, i) => {
    const s = supports[i];
    return s === "Pinned" || s === "Roller" || s === "Fixed";
  });
  let longestSpan = 0;
  for (let i = 1; i < verticalXs.length; i++) longestSpan = Math.max(longestSpan, verticalXs[i] - verticalXs[i - 1]);
  // Each span is checked against its own length. Comparing the worst deflection anywhere
  // on the beam against the longest span mixes up unrelated quantities: an overhang tip
  // would be judged against a span it has nothing to do with.
  const segments = [];
  for (let i = 1; i < verticalXs.length; i++) {
    segments.push({ kind: "Span", x0: verticalXs[i - 1], x1: verticalXs[i] });
  }
  if (verticalXs.length) {
    const first = verticalXs[0];
    const last = verticalXs[verticalXs.length - 1];
    if (first > EPS) segments.push({ kind: "Cantilever", x0: 0, x1: first });

  }
  // Diagrams, extrema and deflection check for one combination. The selected combination
  // and every combination in the all-combinations view go through this same path, so both
  // views report identical numbers for the same combination.
  const comboResult = (combo) => {
    const Vsel = stations.map((s) => combine(s.V, combo.factors));
    const Msel = stations.map((s) => combine(s.M, combo.factors));
    const vsel = stations.map((s) => combine(s.v, combo.factors));
    const thsel = stations.map((s) => -combine(s.theta, combo.factors) * (180 / Math.PI));
    const tau = stations.map((s, i) => {
      const Av_mm2 = elems[s.elementIndex].Av * 1e6;
      return Av_mm2 > 0 ? Math.abs((Vsel[i] * 1000) / Av_mm2) : 0;
    });

      const Z_mm3 = elems[s.elementIndex].Z * 1e9;
      return Z_mm3 > 0 ? -(Msel[i] * 1e6) / Z_mm3 : 0;
    });
    const sigmaBot = stations.map((s, i) => {
      const Z_mm3 = elems[s.elementIndex].Z * 1e9;
      return Z_mm3 > 0 ? (Msel[i] * 1e6) / Z_mm3 : 0;
    });
    const ext = (label, values, pick, unit) => {
      if (!values.length) return { label, value: 0, x: 0, combination: combo.name, unit, pick };
      if (pick === "max") {
        const { imax } = argExtrema(values);
        return { label, value: values[imax], x: xOf(imax), combination: combo.name, unit, pick };
      }
      if (pick === "min") {
        const { imin } = argExtrema(values);
        return { label, value: values[imin], x: xOf(imin), combination: combo.name, unit, pick };
      }
      let ibest = 0;
      for (let i = 1; i < values.length; i++) if (Math.abs(values[i]) > Math.abs(values[ibest])) ibest = i;
      return { label, value: values[ibest], x: xOf(ibest), combination: combo.name, unit, pick };
    };
    const extrema = [
      ext("Maximum positive shear", Vsel, "max", "kN"),
      ext("Maximum negative shear", Vsel, "min", "kN"),
      ext("Maximum sagging moment", Msel, "max", "kNm"),
      ext("Maximum hogging moment", Msel, "min", "kNm"),
      ext("Maximum upward deflection", vsel, "max", "mm"),
      ext("Maximum downward deflection", vsel, "min", "mm"),
      ext("Maximum clockwise slope", thsel, "max", "deg"),
      ext("Maximum counter-clockwise slope", thsel, "min", "deg"),
      ext("Maximum average shear stress", tau, "max", "MPa"),
      ext("Maximum absolute bending stress", sigmaTop.map((t, i) => Math.max(Math.abs(t), Math.abs(sigmaBot[i]))), "max", "MPa"),
    ];
    const spanChecks = segments
      .map((seg) => {
        const len = seg.x1 - seg.x0;
        let peak = 0;
        let peakX = seg.x0;
        for (let i = 0; i < stations.length; i++) {
          const x = stations[i].x;
          if (x < seg.x0 - 1e-9 || x > seg.x1 + 1e-9) continue;
          if (Math.abs(vsel[i]) > Math.abs(peak)) { peak = vsel[i]; peakX = x; }
        }
        const allow = len > 0 && model.deflectionLimitN > 0 ? (len * 1000) / model.deflectionLimitN : 0;
        return {
          kind: seg.kind, x0: seg.x0, x1: seg.x1, length: len,
          maxAbsMm: Math.abs(peak), peakMm: peak, peakX, allowableMm: allow,
          utilisation: allow > 0 ? Math.abs(peak) / allow : 0,
        };
      })
      .sort((a, b) => a.x0 - b.x0);
    const governing = spanChecks.reduce((a, b) => (b.utilisation > (a?.utilisation ?? -1) ? b : a), null);
    const maxAbsMm = governing ? governing.maxAbsMm : 0;
    const allowableMm = governing ? governing.allowableMm : 0;
    const utilisation = governing ? governing.utilisation : 0;
    return {
      id: combo.id, name: combo.name, class: combo.class, factors: combo.factors,
      V: Vsel, M: Msel, v: vsel, slopeDeg: thsel, tau, sigmaTop, sigmaBot, extrema,
      deflectionCheck: {
        longestSpan, limitN: model.deflectionLimitN, allowableMm, maxAbsMm, utilisation,
        spans: spanChecks,
        governingLabel: governing ? `${governing.kind} ${formatNum(governing.x0, 3)}–${formatNum(governing.x1, 3)} m` : "—",

  // its own results.
  const comboResults = combos.map((c) => (c === selectedCombo ? selected : comboResult(c)));
  const envVmax = [], envVmin = [], envMmax = [], envMmin = [];
  const envVmaxC = [], envVminC = [], envMmaxC = [], envMminC = [];
  const envVup = [], envVdn = [], envVupC = [], envVdnC = [], envSig = [], envSigC = [];
  for (let i = 0; i < stations.length; i++) {
    let vmax = -Infinity, vmin = Infinity, mmax = -Infinity, mmin = Infinity;
    let vup = -Infinity, vdn = Infinity, sig = -Infinity;
    let cvmax = "", cvmin = "", cmmax = "", cmmin = "", cvup = "", cvdn = "", csig = "";
    for (const combo of combos) {
      const V = combine(stations[i].V, combo.factors);
      const M = combine(stations[i].M, combo.factors);
      const v = combine(stations[i].v, combo.factors);
      const Z_mm3 = elems[stations[i].elementIndex].Z * 1e9;
      const sAbs = Z_mm3 > 0 ? Math.abs((M * 1e6) / Z_mm3) : 0;
      if (V > vmax) { vmax = V; cvmax = combo.name; }
      if (V < vmin) { vmin = V; cvmin = combo.name; }
      if (M > mmax) { mmax = M; cmmax = combo.name; }
      if (M < mmin) { mmin = M; cmmin = combo.name; }
      if (v > vup) { vup = v; cvup = combo.name; }
      if (v < vdn) { vdn = v; cvdn = combo.name; }
      if (sAbs > sig) { sig = sAbs; csig = combo.name; }
    }
    envVmax.push(vmax); envVmin.push(vmin);
    envMmax.push(mmax); envMmin.push(mmin);
    envVup.push(vup); envVdn.push(vdn); envSig.push(sig);
    envVmaxC.push(cvmax); envVminC.push(cvmin);
    envMmaxC.push(cmmax); envMminC.push(cmmin);
    envVupC.push(cvup); envVdnC.push(cvdn); envSigC.push(csig);
  }
  const envItem = (label, values, names, pick, unit) => {
    if (!values.length || !Number.isFinite(values[0])) return { label, value: 0, x: 0, combination: "—", governing: "—", unit };
    const { imax, imin } = argExtrema(values);
    const i = pick === "max" ? imax : imin;
    return { label, value: values[i], x: xOf(i), combination: names[i], governing: names[i], unit };
  };
  const envelope = [
    envItem("Maximum shear", envVmax, envVmaxC, "max", "kN"),
    envItem("Minimum shear", envVmin, envVminC, "min", "kN"),
    envItem("Maximum moment", envMmax, envMmaxC, "max", "kNm"),
    envItem("Minimum moment", envMmin, envMminC, "min", "kNm"),
    envItem("Maximum deflection", envVup, envVupC, "max", "mm"),
    envItem("Minimum deflection", envVdn, envVdnC, "min", "mm"),
    envItem("Maximum absolute bending stress", envSig, envSigC, "max", "MPa"),
  ];
  const status = invalidLoads.length > 0 ? "INVALID LOAD INPUT" : equilibrium.every((e) => e.ok) ? "OK" : "EQUILIBRIUM CHECK";
  return {
    ok: status === "OK" || status === "INVALID LOAD INPUT",
    status, solverReady, supportStable, invalidLoads, warnings, totalLength,
    E: E_mpa, density, nElements: nEl, nNodes, nodeX, stations, reactions,
    selected, comboResults, envelope, equilibrium, continuity,
    deflectionCheck: selected.deflectionCheck,
    sectionAt, defaultI: resolveSection(model.defaultSection, custom).I,
  };
}

const STORAGE_KEY = "cba-model-v1";
const STORAGE_KEY_LEGACY = "spanline-model-v1";
const TABS = [
  { id: "geometry", label: "Geometry" },
  { id: "loads", label: "Loads" },
  { id: "combos", label: "Combinations" },
  { id: "results", label: "Results" },
  { id: "qa", label: "QA" },
];
const CASE_LANE = { G: 0, Q1: 1, Q2: 2, "W+": 0, "W-": 1, O: 2 };
const ALL_COMBOS = "__all__";
// Rows past the eighth reuse the eight hues with a dash pattern, so no two rows share a style.
const COMBO_DASHES = ["", "7 4", "2 3", "10 3 2 3"];
const STATION_FIELDS = [
  { value: "V", label: "Shear V (kN)", digits: 3 },
  { value: "M", label: "Moment M (kNm)", digits: 3 },
  { value: "v", label: "Deflection δ (mm)", digits: 3 },
  { value: "slopeDeg", label: "Slope θ (deg)", digits: 4 },
  { value: "tau", label: "Shear stress τ (MPa)", digits: 3 },
  { value: "sigmaTop", label: "σ top (MPa)", digits: 3 },
  { value: "sigmaBot", label: "σ bottom (MPa)", digits: 3 },
];

const ui = {
  tab: "results",
  probeX: null,
  showInactive: false,
  hover: {},
  stationField: "M",
};

let model = excelExample();

function hydrate() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY_LEGACY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.elements) || !Array.isArray(parsed.loads)) return;
    const base = excelExample();
    const zero = LOAD_CASES.reduce((acc, k) => ((acc[k] = 0), acc), {});
    model = resizeElements(
      withUniqueComboIds({
        ...base,
        ...parsed,
        combinations: (parsed.combinations ?? base.combinations).map((c) => ({
          ...c,
          factors: { ...zero, ...c.factors },
        })),
      }),
      parsed.nElements ?? base.nElements,
    );
  } catch {
    /* keep default */
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(model));
  } catch {
    /* ignore */
  }
}

function esc(s) {
  return String(s)
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}

function badge(text, tone) {
  return `<span class="badge ${tone || "muted"}">${esc(text)}</span>`;
}

function iconDownload() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`;
}
function iconUpload() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>`;
}
function iconReset() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`;
}
function iconPlus() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`;
}
function iconTrash() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`;
}

function options(list, selected) {
  return list
    .map((v) => {
      const val = typeof v === "object" ? v.value : v;
      const lab = typeof v === "object" ? v.label : v;
      return `<option value="${esc(val)}"${String(val) === String(selected) ? " selected" : ""}>${esc(lab)}</option>`;
    })
    .join("");
}

function magUnit(type) {
  if (type === "UDL") return "kN/m";
  if (type === "Moment") return "kNm";
  return "kN";
}

function combinedReaction(r, factors) {
  let V = 0;
  let M = 0;
  for (const c of LOAD_CASES) {
    V += r.vertical[c] * (factors[c] ?? 0);
    M += r.moment[c] * (factors[c] ?? 0);
  }
  return { V, M };
}

function seriesFrom(result, field) {
  return result.stations.map((s, i) => ({ x: s.x, y: result.selected[field][i] ?? 0 }));
}

function envelopeTrace(stations, combos, field, pick) {
  return stations.map((s) => {
    let best = pick === "max" ? -Infinity : Infinity;
    for (const c of combos) {
      let v = 0;
      for (const k of LOAD_CASES) v += s[field][k] * (c.factors[k] ?? 0);
      if (pick === "max") best = Math.max(best, v);
      else best = Math.min(best, v);
    }
    return { x: s.x, y: Number.isFinite(best) ? best : 0 };
  });
}

function nearest(points, x) {
  if (!points.length) return null;
  let best = points[0];
  let bestD = Math.abs(best.x - x);
  for (const p of points) {
    const d = Math.abs(p.x - x);
    if (d < bestD) {
      best = p;
      bestD = d;
    }
  }
  return best;
}

function nearestIndex(xs, x) {
  let best = 0;
  for (let i = 1; i < xs.length; i++) if (Math.abs(xs[i] - x) < Math.abs(xs[best] - x)) best = i;
  return best;
}

function viewBoxSize(svg) {
  const [, , W, H] = svg.getAttribute("viewBox").split(" ").map(Number);
  return { W, H };
}

// Pointer x in viewBox units. The diagrams keep their aspect ratio, so on a wide screen the
// drawing sits centred with blank margins either side; scaling by the element width alone
// would put the pointer at the wrong station. The viewBox is read on every call because a
// resize across the phone breakpoint redraws the diagram at a different width.
function svgPointerX(svg, ev) {
  const { W, H } = viewBoxSize(svg);
  const rect = svg.getBoundingClientRect();
  const scale = Math.min(rect.width / W, rect.height / H) || 1;
  return (ev.clientX - rect.left - (rect.width - W * scale) / 2) / scale;
}

function isAllView(mod) {
  return mod.comboView === "all";
}

function activeCombos(mod) {
  return mod.combinations.filter((c) => LOAD_CASES.some((k) => (c.factors[k] ?? 0) !== 0));
}

function hiddenSet(mod) {
  return new Set(Array.isArray(mod.hiddenComboIds) ? mod.hiddenComboIds : []);
}

function shownComboResults(mod, result) {
  const hidden = hiddenSet(mod);
  return result.comboResults.filter((r) => !hidden.has(r.id));
}

// Colour follows the combination's row, not its rank among those shown, so hiding one
// never repaints the others.
function comboStyle(mod, id) {
  const i = Math.max(0, mod.combinations.findIndex((c) => c.id === id));
  return { color: `var(--combo-${(i % 8) + 1})`, dash: COMBO_DASHES[Math.floor(i / 8) % COMBO_DASHES.length] };
}

function comboKey(style) {
  const dash = style.dash ? ` stroke-dasharray="${style.dash}"` : "";
  return `<svg class="key" viewBox="0 0 20 8" aria-hidden="true"><line x1="1" y1="4" x2="19" y2="4" stroke="${style.color}" stroke-width="2.4"${dash}/></svg>`;
}

// The combination analyse() actually uses: it falls back to the first row when the stored id
// is missing or stale.
function effectiveComboId(mod) {
  return mod.combinations.some((c) => c.id === mod.selectedComboId) ? mod.selectedComboId : mod.combinations[0]?.id;
}

function comboSelectOptions(mod) {
  const all = isAllView(mod);
  const singles = options(mod.combinations.map((c) => ({ value: c.id, label: c.name })), all ? null : effectiveComboId(mod));
  // With no combination to show the browser would display the first option, "All
  // combinations", while the single view is active.
  const none = !all && effectiveComboId(mod) == null ? `<option value="" selected disabled>None</option>` : "";
  return `${none}<option value="${ALL_COMBOS}"${all ? " selected" : ""}>All combinations</option><optgroup label="Single combination">${singles}</optgroup>`;
}

// Rows are looked up by id everywhere (selection, Plot, legend, colours, edits), and data-id
// attributes are strings. A hand-edited file with a missing, numeric or repeated id gets
// unique string ids on load, so each row stays separately addressable.
function withUniqueComboIds(mod) {
  if (!Array.isArray(mod.combinations)) return mod;
  const seen = new Set();
  const combinations = mod.combinations.map((c, i) => {
    const base = c.id == null || c.id === "" ? `c${i + 1}` : String(c.id);
    let id = base;
    for (let n = 2; seen.has(id); n++) id = `${base}-${n}`;
    seen.add(id);
    return id === c.id ? c : { ...c, id };
  });
  const selectedComboId = mod.selectedComboId == null ? mod.selectedComboId : String(mod.selectedComboId);
  const hiddenComboIds = Array.isArray(mod.hiddenComboIds) ? mod.hiddenComboIds.map(String) : mod.hiddenComboIds;
  return { ...mod, combinations, selectedComboId, hiddenComboIds };
}

function supportMark(x, y, type) {
  if (type === "Fixed") {
    const ticks = [-8, -4, 0, 4, 8]
      .map((dx) => `<line x1="${x + dx - 3}" y1="${y + 28}" x2="${x + dx + 3}" y2="${y + 18}" stroke="var(--color-muted)" stroke-width="1"/>`)
      .join("");
    return `<g><line x1="${x}" y1="${y + 3}" x2="${x}" y2="${y + 22}" stroke="var(--color-fg)" stroke-width="1.4"/>${ticks}</g>`;
  }
  const tri = `<polygon points="${x},${y + 4} ${x - 8},${y + 18} ${x + 8},${y + 18}" fill="none" stroke="var(--color-fg)" stroke-width="1.3"/>`;
  if (type === "Roller") {
    return `<g>${tri}<circle cx="${x - 5}" cy="${y + 22}" r="3" fill="none" stroke="var(--color-muted)" stroke-width="1.1"/><circle cx="${x + 5}" cy="${y + 22}" r="3" fill="none" stroke="var(--color-muted)" stroke-width="1.1"/></g>`;
  }
  return `<g>${tri}<line x1="${x - 10}" y1="${y + 18}" x2="${x + 10}" y2="${y + 18}" stroke="var(--color-muted)" stroke-width="1.1"/></g>`;
}

function schematicSvg(mod, result) {
  const n = result.nElements;
  const L = Math.max(result.totalLength, 1e-6);
  const W = 920;
  const H = 204;
  const padX = 36;
  const beamY = 92;
  const inner = W - padX * 2;
  const xAt = (x) => padX + (x / L) * inner;
  const loads = mod.loads.filter((l) => l.active && Number.isFinite(l.magnitude) && l.magnitude !== 0);
  const maxUdl = Math.max(0.001, ...loads.filter((l) => l.type === "UDL").map((l) => Math.abs(l.magnitude)));
  // In the all-combinations view each support is labelled with the largest and smallest
  // reaction over the shown combinations.
  const shown = isAllView(mod) ? shownComboResults(mod, result) : null;
  const reactionAt = new Map();
  for (const r of result.reactions) {
    if (!shown) {
      reactionAt.set(r.node, combinedReaction(r, result.selected.factors).V);
    } else if (shown.length) {
      const vals = shown.map((c) => combinedReaction(r, c.factors).V);
      reactionAt.set(r.node, { max: Math.max(...vals), min: Math.min(...vals) });
    }
  }
  // Max over min on two short lines, so labels stay as narrow as the single view's and do
  // not run into each other on closely spaced supports.
  const reactionLines = (Rv) => {
    if (typeof Rv === "number") return Math.abs(Rv) >= 1e-6 ? [formatNum(Rv, 2)] : [];
    if (Math.abs(Rv.max) < 1e-6 && Math.abs(Rv.min) < 1e-6) return [];
    return Math.abs(Rv.max - Rv.min) < 1e-6 ? [formatNum(Rv.max, 2)] : [formatNum(Rv.max, 2), formatNum(Rv.min, 2)];
  };

  const elLabels = result.nodeX
    .slice(0, n)
    .map((x0, i) => {
      const x1 = result.nodeX[i + 1];
      const cx = (xAt(x0) + xAt(x1)) / 2;
      return `<text x="${cx}" y="16" text-anchor="middle" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(mod.elements[i]?.description || "E" + (i + 1))} · ${esc(formatNum(x1 - x0, 2))} m</text>`;
    })
    .join("");

  const loadDraw = loads
    .map((ld) => {
      if (ld.type === "UDL") {
        const a = Math.max(0, ld.x1);
        const b = Math.min(L, ld.x2);
        const x1 = xAt(a);
        const x2 = xAt(b);
        const up = ld.magnitude < 0;
        const lane = CASE_LANE[ld.case] ?? 0;
        const h = 8 + (Math.abs(ld.magnitude) / maxUdl) * 14;
        const y0 = up ? beamY + 8 + lane * 3 : beamY - 8 - lane * 3;
        const y1 = up ? y0 + h : y0 - h;
        const fill = ld.case.startsWith("W") ? "var(--color-shear)" : "var(--color-moment)";
        const steps = Math.max(3, Math.min(24, Math.round((x2 - x1) / 28)));
        const pts = [];
        const lines = [];
        for (let i = 0; i <= steps; i++) {
          const x = x1 + ((x2 - x1) * i) / steps;
          pts.push(`${x},${y1}`);
          lines.push(`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${fill}" stroke-width="0.7"/>`);
        }
        return `<g opacity="0.85"><polygon points="${x1},${y0} ${pts.join(" ")} ${x2},${y0}" fill="${fill}" fill-opacity="0.18" stroke="${fill}" stroke-width="0.8"/>${lines.join("")}</g>`;
      }
      const x = xAt(Math.min(L, Math.max(0, ld.x1)));
      if (ld.type === "Moment") {
        const poly = ld.magnitude >= 0 ? "10,-14 6,-8 14,-10" : "-10,-14 -6,-8 -14,-10";
        return `<g transform="translate(${x} ${beamY})"><path d="M -10 -14 A 12 12 0 1 1 10 -14" fill="none" stroke="var(--color-moment)" stroke-width="1.4"/><polygon points="${poly}" fill="var(--color-moment)"/></g>`;
      }
      const down = ld.magnitude >= 0;
      const y1 = down ? beamY - 36 : beamY + 36;
      const arrow = down
        ? `${x},${beamY - 4} ${x - 4},${beamY - 12} ${x + 4},${beamY - 12}`
        : `${x},${beamY + 4} ${x - 4},${beamY + 12} ${x + 4},${beamY + 12}`;
      return `<g><line x1="${x}" y1="${y1}" x2="${x}" y2="${down ? beamY - 6 : beamY + 6}" stroke="var(--color-fg)" stroke-width="1.3"/><polygon points="${arrow}" fill="var(--color-fg)"/></g>`;
    })
    .join("");

  const nodes = result.nodeX
    .map((x, i) => {
      const px = xAt(x);
      const s = mod.supports[i] ?? "Free";
      const Rv = reactionAt.get(i + 1);
      const end = i === 0 || i === result.nodeX.length - 1;
      const rv = Rv != null ? reactionLines(Rv) : [];
      const rvTxt = rv
        .map((t, k) => `<text x="${px}" y="${beamY + 36 + k * 9}" text-anchor="middle" fill="var(--color-shear)" font-size="8" font-family="var(--font-mono)">${esc(t)}</text>`)
        .join("");
      const xTxt = end
        ? `<text x="${px}" y="${s === "Free" ? beamY + 28 : beamY + (rv.length > 1 ? 59 : 50)}" text-anchor="${i === 0 ? "start" : "end"}" fill="var(--color-muted)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(x, 2))}</text>`
        : "";
      return `<g><circle cx="${px}" cy="${beamY}" r="2.6" fill="var(--color-bg)" stroke="var(--color-beam)" stroke-width="1.2"/>${s !== "Free" ? supportMark(px, beamY, s) : ""}${rvTxt}${xTxt}</g>`;
    })
    .join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Beam elevation">
    <line x1="${padX}" y1="${beamY}" x2="${W - padX}" y2="${beamY}" stroke="var(--color-beam)" stroke-width="3.5" stroke-linecap="round"/>
    ${elLabels}${loadDraw}${nodes}
    <text x="${padX}" y="${H - 10}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">x = 0</text>
    <text x="${W - padX}" y="${H - 10}" text-anchor="end" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(L, 3))} m</text>
  </svg>`;
}

// The diagrams keep their aspect ratio, so on a phone a 920-wide drawing shrinks to a thin
// strip with unreadable labels. Below 640 px they are laid out on a narrower canvas instead.
function diagramWidth() {
  return window.innerWidth < 640 ? 460 : 920;
}

function forceDiagramHtml(id, title, unit, color, points, nodeX, envelopeMax, envelopeMin) {
  const W = diagramWidth();
  const H = 168;
  const pad = { l: 52, r: 16, t: 18, b: 28 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const ys = points.map((p) => p.y);
  const envYs = [...(envelopeMax ?? []).map((p) => p.y), ...(envelopeMin ?? []).map((p) => p.y)];
  const all = ys.concat(envYs);
  let min = Math.min(0, ...all);
  let max = Math.max(0, ...all);
  if (min === max) {
    min -= 1;
    max += 1;
  }
  const span = max - min;
  min -= span * 0.08;
  max += span * 0.08;
  const L = Math.max(points[points.length - 1]?.x ?? 1, 1e-6);
  const xAt = (x) => pad.l + (x / L) * innerW;
  const yAt = (y) => pad.t + ((max - y) / (max - min)) * innerH;
  const toPath = (pts) => {
    if (!pts.length) return "";
    return pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xAt(p.x).toFixed(2)} ${yAt(p.y).toFixed(2)}`).join(" ");
  };
  const areaPath = (pts) => {
    if (!pts.length) return "";
    const z = yAt(0);
    const body = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xAt(p.x).toFixed(2)} ${yAt(p.y).toFixed(2)}`).join(" ");
    const last = pts[pts.length - 1];
    const first = pts[0];
    return `${body} L ${xAt(last.x).toFixed(2)} ${z.toFixed(2)} L ${xAt(first.x).toFixed(2)} ${z.toFixed(2)} Z`;
  };
  const maxPt = points.reduce((a, b) => (b.y > a.y ? b : a), points[0] ?? { x: 0, y: 0 });
  const minPt = points.reduce((a, b) => (b.y < a.y ? b : a), points[0] ?? { x: 0, y: 0 });
  const hover = ui.hover[id];
  const probe = ui.probeX == null ? null : nearest(points, ui.probeX);
  const shown = hover ?? (probe ? { x: probe.x, y: probe.y } : null);
  const pinX = hover?.x ?? probe?.x;
  const nodeLines = nodeX
    .map(
      (x, i) =>
        `<line x1="${xAt(x)}" y1="${pad.t}" x2="${xAt(x)}" y2="${H - pad.b}" stroke="var(--color-border)" stroke-width="1"${i === 0 || i === nodeX.length - 1 ? "" : ' stroke-dasharray="2 4"'}/>`,
    )
    .join("");
  const env =
    envelopeMax && envelopeMin
      ? `<path d="${toPath(envelopeMax)}" fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="1"/><path d="${toPath(envelopeMin)}" fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="1"/>`
      : "";
  const pin =
    pinX != null
      ? `<line x1="${xAt(pinX)}" y1="${pad.t}" x2="${xAt(pinX)}" y2="${H - pad.b}" stroke="var(--color-fg)" stroke-opacity="0.45"/>${shown ? `<circle cx="${xAt(shown.x)}" cy="${yAt(shown.y)}" r="3.2" fill="${color}" stroke="var(--color-bg)" stroke-width="1"/>` : ""}`
      : "";
  const read = shown
    ? `x ${formatNum(shown.x, 3)} m · ${formatNum(shown.y, 3)} ${unit}`
    : `max ${formatNum(maxPt?.y ?? 0, 3)} · min ${formatNum(minPt?.y ?? 0, 3)}`;
  return `<div class="diagram" data-diagram="${esc(id)}">
    <div class="diagram-head">
      <div><h3>${esc(title)}</h3><span class="unit">${esc(unit)}</span></div>
      <p class="read" data-readout>${esc(read)}</p>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} diagram" data-diagram-svg="${esc(id)}">
      <line x1="${pad.l}" y1="${yAt(0)}" x2="${W - pad.r}" y2="${yAt(0)}" stroke="var(--color-border-strong)" stroke-width="1"/>
      ${nodeLines}${env}
      <path d="${areaPath(points)}" fill="${color}" fill-opacity="0.22"/>
      <path d="${toPath(points)}" fill="none" stroke="${color}" stroke-width="1.6"/>
      ${pin}
      <text x="4" y="${yAt(max) + 8}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(max, 2))}</text>
      <text x="4" y="${yAt(min)}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(min, 2))}</text>
    </svg>
  </div>`;
}

// One line per combination over a shared station list, with the envelope of the shown
// combinations as a faint band behind them. Hover and highlight are wired up in
// bindMultiDiagrams, which reads W and H back from the viewBox and must use the same padding.
function multiDiagramHtml(id, title, unit, xs, series, nodeX) {
  const W = diagramWidth();
  const H = 208;
  const pad = { l: 52, r: 16, t: 18, b: 28 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const hi = xs.map((_, i) => Math.max(...series.map((s) => s.ys[i])));
  const lo = xs.map((_, i) => Math.min(...series.map((s) => s.ys[i])));
  let min = Math.min(0, ...lo);
  let max = Math.max(0, ...hi);
  if (min === max) {
    min -= 1;
    max += 1;
  }
  const span = max - min;
  min -= span * 0.08;
  max += span * 0.08;
  const L = Math.max(xs[xs.length - 1] ?? 1, 1e-6);
  const xAt = (x) => pad.l + (x / L) * innerW;
  const yAt = (y) => pad.t + ((max - y) / (max - min)) * innerH;
  const pts = (ys) => ys.map((y, i) => `${xAt(xs[i]).toFixed(1)} ${yAt(y).toFixed(1)}`);
  const band = xs.length ? `M ${pts(hi).join(" L ")} L ${pts(lo).reverse().join(" L ")} Z` : "";
  const nodeLines = nodeX
    .map(
      (x, i) =>
        `<line x1="${xAt(x)}" y1="${pad.t}" x2="${xAt(x)}" y2="${H - pad.b}" stroke="var(--color-border)" stroke-width="1"${i === 0 || i === nodeX.length - 1 ? "" : ' stroke-dasharray="2 4"'}/>`,
    )
    .join("");
  const lines = series
    .map((s) => {
      const dash = s.style.dash ? ` stroke-dasharray="${s.style.dash}"` : "";
      return `<path class="series" data-combo="${esc(s.id)}" d="M ${pts(s.ys).join(" L ")}" fill="none" stroke="${s.style.color}" stroke-width="1.6" stroke-linejoin="round"${dash}/>`;
    })
    .join("");
  let pin = "";
  if (ui.probeX != null && xs.length) {
    const i = nearestIndex(xs, ui.probeX);
    const px = xAt(xs[i]).toFixed(1);
    pin =
      `<line x1="${px}" y1="${pad.t}" x2="${px}" y2="${H - pad.b}" stroke="var(--color-fg)" stroke-opacity="0.45"/>` +
      series
        .map((s) => `<circle class="series" data-combo="${esc(s.id)}" cx="${px}" cy="${yAt(s.ys[i]).toFixed(1)}" r="3" fill="${s.style.color}" stroke="var(--color-bg)" stroke-width="1"/>`)
        .join("");
  }
  let sMax = series[0];
  let sMin = series[0];
  let iMax = 0;
  let iMin = 0;
  for (const s of series) {
    for (let i = 0; i < xs.length; i++) {
      if (s.ys[i] > sMax.ys[iMax]) { sMax = s; iMax = i; }
      if (s.ys[i] < sMin.ys[iMin]) { sMin = s; iMin = i; }
    }
  }
  const read = `max ${formatNum(sMax.ys[iMax] ?? 0, 3)} ${sMax.name} · min ${formatNum(sMin.ys[iMin] ?? 0, 3)} ${sMin.name}`;
  return `<div class="diagram multi" data-diagram="${esc(id)}">
    <div class="diagram-head">
      <div><h3>${esc(title)}</h3><span class="unit">${esc(unit)}</span></div>
      <p class="read">${esc(read)}</p>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} diagram, all shown combinations" data-diagram-svg="${esc(id)}">
      <path d="${band}" fill="var(--color-fg)" fill-opacity="0.05"/>
      <line x1="${pad.l}" y1="${yAt(0)}" x2="${W - pad.r}" y2="${yAt(0)}" stroke="var(--color-border-strong)" stroke-width="1"/>
      ${nodeLines}${lines}${pin}
      <line data-cross x1="0" y1="${pad.t}" x2="0" y2="${H - pad.b}" stroke="var(--color-fg)" stroke-opacity="0.3" visibility="hidden"/>
      <text x="4" y="${yAt(max) + 8}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(max, 2))}</text>
      <text x="4" y="${yAt(min)}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(min, 2))}</text>
    </svg>
  </div>`;
}

function renderGeometry(mod, result) {
  // The custom properties are used by any element set to "Custom", not just when it is
  // the default, so the fields must stay editable in that case too.
  const isCustom =
    mod.defaultSection === "Custom" ||
    mod.elements.slice(0, mod.nElements).some((el) => (el.section || mod.defaultSection) === "Custom");
  const eVal = mod.material === "Custom" ? mod.customE : result.E;
  const dVal = mod.material === "Custom" ? mod.customDensity : result.density;
  const rows = mod.elements
    .slice(0, mod.nElements)
    .map((el, i) => {
      const sec = result.sectionAt[i];
      const endSupport =
        i === mod.nElements - 1
          ? `<select class="sel sm" data-act="support" data-index="${i + 1}">${options(SUPPORT_TYPES, mod.supports[i + 1])}</select>`
          : `<span class="subtle">→</span>`;
      return `<tr>
        <td class="mono">${i + 1}</td>
        <td><input class="field sm" data-act="element" data-index="${i}" data-field="description" value="${esc(el.description)}"></td>
        <td class="w-24"><input class="field sm" type="number" step="0.001" min="0.01" data-act="element" data-index="${i}" data-field="length" value="${esc(inputValue(el.length, 6))}"></td>
        <td class="w-36"><select class="sel sm" data-act="element" data-index="${i}" data-field="section">${options(SECTION_LIBRARY.map((s) => s.name), el.section)}</select></td>
        <td class="mono">${esc(formatNum(sec?.I ?? 0, 0))}</td>
        <td class="mono">${esc(formatNum(sec?.Z ?? 0, 0))}</td>
        <td class="mono">${esc(formatNum(result.nodeX[i] ?? 0, 3))}</td>
        <td class="mono">${esc(formatNum(result.nodeX[i + 1] ?? 0, 3))}</td>
        <td class="w-28"><select class="sel sm" data-act="support" data-index="${i}">${options(SUPPORT_TYPES, mod.supports[i])}</select></td>
        <td class="w-28">${endSupport}</td>
      </tr>`;
    })
    .join("");
  return `<div class="geo-grid">
    <section class="card">
      <h2>Model</h2>
      <p class="hint">Euler–Bernoulli beam, linear elastic. Units: m, kN, kNm, mm.</p>
      <div class="fields">
        <label class="label"><span>Elements</span><input class="field" type="number" min="1" max="24" data-act="patch" data-field="nElements" value="${esc(inputValue(mod.nElements, 0))}"></label>
        <label class="label"><span>Material</span><select class="sel" data-act="patch" data-field="material">${options(MATERIALS, mod.material)}</select></label>
        <label class="label"><span>E (MPa)</span><input class="field" type="number" data-act="patch" data-field="customE" value="${esc(inputValue(eVal, 0))}" ${mod.material !== "Custom" ? "disabled" : ""}></label>
        <label class="label"><span>Density (kg/m³)</span><input class="field" type="number" data-act="patch" data-field="customDensity" value="${esc(inputValue(dVal, 2))}" ${mod.material !== "Custom" ? "disabled" : ""}></label>
        <label class="label"><span>Default section</span><select class="sel" data-act="default-section">${options(SECTION_LIBRARY.map((s) => s.name), mod.defaultSection)}</select></label>
        <label class="label"><span>Stations / element</span><select class="sel" data-act="patch" data-field="stationsPerElement">${options([13, 26, 51], mod.stationsPerElement)}</select></label>
        <label class="label"><span>I (mm⁴)</span><input class="field" type="number" data-act="patch" data-field="customI" value="${esc(inputValue(mod.customI, 2))}" ${!isCustom ? "disabled" : ""}></label>
        <label class="label"><span>Z (mm³)</span><input class="field" type="number" data-act="patch" data-field="customZ" value="${esc(inputValue(mod.customZ, 2))}" ${!isCustom ? "disabled" : ""}></label>
        <label class="label"><span>A (mm²)</span><input class="field" type="number" data-act="patch" data-field="customA" value="${esc(inputValue(mod.customA, 4))}" ${!isCustom ? "disabled" : ""}></label>
        <label class="label"><span>Av (mm²)</span><input class="field" type="number" data-act="patch" data-field="customAv" value="${esc(inputValue(mod.customAv, 4))}" ${!isCustom ? "disabled" : ""}></label>
      </div>
      <label class="check"><input type="checkbox" data-act="patch-bool" data-field="includeSelfWeight" ${mod.includeSelfWeight ? "checked" : ""}> Include self-weight in case G</label>
      <p class="mono-note">Total length ${esc(formatNum(result.totalLength, 3))} m · ${result.nNodes} nodes</p>
    </section>
    <section class="card" style="min-width:0">
      <div class="row-head">
        <h2>Elements and supports</h2>
        <button class="btn" type="button" data-act="add-span">Add span</button>
      </div>
      <div class="scroll">
        <table class="data min-56">
          <thead><tr>
            <th>El</th><th>Description</th><th>L (m)</th><th>Section</th><th>I (mm⁴)</th><th>Z (mm³)</th><th>Start</th><th>End</th><th>Support i</th><th>Support j</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="hint">Nodes are placed automatically from element lengths. I and Z are resolved from the section library. Pinned and roller restrain vertical displacement; fixed also restrains rotation.</p>
    </section>
  </div>`;
}

function renderLoads(mod, result) {
  const rows = mod.loads
    .map((ld, i) => ({ ld, i }))
    .filter(({ ld }) => ui.showInactive || ld.active)
    .map(({ ld, i }) => {
      const inactive = ld.active ? "" : " opacity-50";
      return `<tr class="${inactive}">
        <td><input type="checkbox" data-act="load" data-index="${i}" data-field="active" data-type="bool" ${ld.active ? "checked" : ""} aria-label="${esc(ld.id)} active"></td>
        <td class="mono">${esc(ld.id)}</td>
        <td class="w-24"><select class="sel sm" data-act="load" data-index="${i}" data-field="case">${options(LOAD_CASES, ld.case)}</select></td>
        <td class="w-28"><select class="sel sm" data-act="load" data-index="${i}" data-field="type">${options(LOAD_TYPES, ld.type)}</select></td>
        <td class="w-24"><input class="field sm" type="number" step="0.001" data-act="load" data-index="${i}" data-field="x1" value="${esc(inputValue(ld.x1, 6))}"></td>
        <td class="w-24"><input class="field sm" type="number" step="0.001" data-act="load" data-index="${i}" data-field="x2" value="${esc(inputValue(ld.x2, 6))}" ${ld.type !== "UDL" ? "disabled" : ""}></td>
        <td class="w-40"><div class="mag"><input class="field sm" type="number" step="0.001" data-act="load" data-index="${i}" data-field="magnitude" value="${esc(inputValue(ld.magnitude, 6))}"><span class="unit">${esc(magUnit(ld.type))}</span></div></td>
        <td><input class="field sm" data-act="load" data-index="${i}" data-field="description" value="${esc(ld.description)}" placeholder="Optional note"></td>
        <td><button class="btn ghost icon" type="button" data-act="remove-load" data-index="${i}" aria-label="Remove ${esc(ld.id)}">${iconTrash()}</button></td>
      </tr>`;
    })
    .join("");
  const nActive = mod.loads.filter((l) => l.active).length;
  return `<section class="card">
    <div class="row-head">
      <div>
        <h2>Coordinate loads</h2>
        <p class="hint" style="max-width:42rem">Enter by global x. Point: kN downward positive. Moment: kNm counter-clockwise positive. UDL: kN/m downward positive between x1 and x2. Loads may sit inside an element — no manual split required.</p>
      </div>
      <div class="actions">
        <label class="mini-check"><input type="checkbox" data-act="show-inactive" ${ui.showInactive ? "checked" : ""}> Show inactive</label>
        <button class="btn" type="button" data-act="add-load">${iconPlus()} Add load</button>
      </div>
    </div>
    <div class="scroll">
      <table class="data min-56">
        <thead><tr><th>On</th><th>ID</th><th>Case</th><th>Type</th><th>x1 (m)</th><th>x2 (m)</th><th>Magnitude</th><th>Description</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="mono-note">${nActive} active · beam ${result.totalLength.toFixed(3)} m</p>
  </section>`;
}

function renderCombos(mod) {
  const hidden = hiddenSet(mod);
  const active = activeCombos(mod);
  const activeIds = new Set(active.map((c) => c.id));
  const nPlotted = active.filter((c) => !hidden.has(c.id)).length;
  const rows = mod.combinations
    .map((c) => {
      const selected = !isAllView(mod) && c.id === effectiveComboId(mod) ? " selected" : "";
      const factors = LOAD_CASES.map(
        (k) =>
          `<td class="w-24"><input class="field sm" type="number" step="0.05" data-act="combo-factor" data-id="${esc(c.id)}" data-factor="${esc(k)}" value="${esc(inputValue(c.factors[k], 4))}"></td>`,
      ).join("");
      const plot = activeIds.has(c.id)
        ? `<input class="plot-check" type="checkbox" data-act="plot-combo" data-id="${esc(c.id)}"${hidden.has(c.id) ? "" : " checked"} aria-label="Plot ${esc(c.name)} in the all-combinations view">`
        : `<input class="plot-check" type="checkbox" disabled title="All factors are zero — nothing to plot" aria-label="${esc(c.name)} has all-zero factors">`;
      return `<tr class="combo-row${selected}" data-act="select-combo" data-id="${esc(c.id)}">
        <td class="plot-cell"><label class="key-inline">${plot}${comboKey(comboStyle(mod, c.id))}</label></td>
        <td class="w-32"><input class="field sm" data-act="combo-field" data-id="${esc(c.id)}" data-field="name" value="${esc(c.name)}"></td>
        <td class="muted">${esc(c.class)}</td>
        ${factors}
        <td><input class="field sm" data-act="combo-field" data-id="${esc(c.id)}" data-field="notes" value="${esc(c.notes)}"></td>
      </tr>`;
    })
    .join("");
  const legend = LOAD_CASES.map((c) => `<li><p class="k">${esc(c)}</p><p class="hint">${esc(CASE_LEGEND[c])}</p></li>`).join("");
  return `<div class="combo-grid">
    <section class="card" style="min-width:0">
      <div class="row-head">
        <div>
          <h2>Load combinations</h2>
          <p class="hint">Factors are user-defined. Confirm ULS / SLS values against the project design basis. Click a row to analyse it on its own. Tick <b>Plot</b> to include a combination when <b>All combinations</b> is selected.</p>
        </div>
        <label class="label w-40">
          <span>Selected combination</span>
          <select class="sel" data-act="pick-combo">${comboSelectOptions(mod)}</select>
        </label>
      </div>
      <div class="scroll">
        <table class="data min-48">
          <thead><tr><th><span class="key-inline"><input class="plot-check" type="checkbox" data-act="plot-all"${active.length && nPlotted === active.length ? " checked" : ""}${nPlotted > 0 && nPlotted < active.length ? " data-indeterminate" : ""}${active.length ? "" : " disabled"} aria-label="Plot every combination">Plot</span></th><th>Name</th><th>Class</th>${LOAD_CASES.map((c) => `<th>${esc(c)}</th>`).join("")}<th>Notes</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>
    <aside class="card">
      <h2>Load cases</h2>
      <ul class="legend-list">${legend}</ul>
    </aside>
  </div>`;
}

function viewBar(mod, result) {
  const all = isAllView(mod);
  const seg = `<div class="seg" role="group" aria-label="Result view">
      <button type="button" class="${all ? "" : "on"}" data-act="view" data-view="single" aria-pressed="${all ? "false" : "true"}">Selected combination</button>
      <button type="button" class="${all ? "on" : ""}" data-act="view" data-view="all" aria-pressed="${all ? "true" : "false"}">All combinations</button>
    </div>`;
  if (!all) return `<div class="row-head" style="align-items:center">${seg}</div>`;
  const hidden = hiddenSet(mod);
  const nShown = result.comboResults.filter((r) => !hidden.has(r.id)).length;
  const nTotal = result.comboResults.length;
  const chips = result.comboResults
    .map((r) => {
      const on = !hidden.has(r.id);
      return `<button type="button" class="chip" data-act="toggle-combo" data-id="${esc(r.id)}" aria-pressed="${on ? "true" : "false"}" title="${esc(`${r.class} · ${factorsText(r.factors)}`)}">${comboKey(comboStyle(mod, r.id))}${esc(r.name)}</button>`;
    })
    .join("");
  return `<section class="card viewbar">
    <div class="row-head" style="align-items:center">
      ${seg}
      <div class="actions">
        <span class="mono-note" style="margin:0">${nShown} of ${nTotal} shown</span>
        <button class="btn" type="button" data-act="show-combos" data-show="all"${nShown === nTotal ? " disabled" : ""}>Show all</button>
        <button class="btn ghost" type="button" data-act="show-combos" data-show="none"${nShown === 0 ? " disabled" : ""}>Hide all</button>
      </div>
    </div>
    <div class="chips">${chips}</div>
    <p class="hint" style="margin:0">Click a combination to hide or show it; hover it to pick it out on every diagram. Combinations whose factors are all zero are not listed.</p>
  </section>`;
}

function renderResultsAll(mod, result) {
  const bar = viewBar(mod, result);
  const shown = shownComboResults(mod, result);
  if (!shown.length) {
    let why = "Every combination is hidden. Click one above, or Show all.";
    if (!result.stations.length) why = `The model cannot be analysed (${result.status}). See the QA tab.`;
    else if (!result.comboResults.length) why = "Every combination has all-zero factors. Enter factors on the Combinations tab.";
    return `<div class="space-y">${bar}<section class="card"><h2>Nothing to plot</h2><p class="hint">${esc(why)}</p></section></div>`;
  }
  const xs = result.stations.map((s) => s.x);
  const keyed = (r) => `<span class="key-inline">${comboKey(comboStyle(mod, r.id))}${esc(r.name)}</span>`;
  const probeOn = (x) => ui.probeX != null && Math.abs(x - ui.probeX) < 1e-9;

  // For each extremum, the shown combination that governs it. These are the envelope
  // extrema of the shown set, and the cells highlighted in the per-combination table.
  const governing = shown[0].extrema.map((_, k) => {
    let best = shown[0];
    for (const r of shown) {
      const e = r.extrema[k];
      const b = best.extrema[k];
      if (e.pick === "min" ? e.value < b.value : e.value > b.value) best = r;
    }
    return best;
  });
  const cards = governing
    .map((r, k) => {
      const e = r.extrema[k];
      return `<button class="ext-card${probeOn(e.x) ? " on" : ""}" type="button" data-act="probe" data-x="${e.x}">
        <p class="k">${esc(e.label)}</p>
        <p class="v">${esc(formatNum(e.value, 3))}<span>${esc(e.unit)}</span></p>
        <p class="x key-inline">x = ${esc(formatNum(e.x, 3))} m · ${comboKey(comboStyle(mod, r.id))}${esc(r.name)}</p>
      </button>`;
    })
    .join("");

  let pin = `<p class="hint">Click a diagram, extrema card or table value to pin a station and read every combination there.</p>`;
  if (ui.probeX != null) {
    let best = Infinity;
    for (const x of xs) best = Math.min(best, Math.abs(x - ui.probeX));
    const idx = xs.map((_, i) => i).filter((i) => Math.abs(xs[i] - ui.probeX) <= best + 1e-12);
    const faceName = (s) => `${s.side === "right" ? "end" : s.side === "left" ? "start" : "inside"} of El ${s.elementIndex + 1}`;
    const faces = idx.length > 1 ? ` · ${idx.map((i) => faceName(result.stations[i])).join(" / ")}` : "";
    const cell = (r, field, d) => `<td class="num r nw">${esc(idx.map((i) => formatNum(r[field][i], d)).join(" / "))}</td>`;
    const rows = shown
      .map((r) => `<tr><td>${keyed(r)}</td>${cell(r, "V", 3)}${cell(r, "M", 3)}${cell(r, "v", 3)}${cell(r, "slopeDeg", 4)}${cell(r, "tau", 3)}${cell(r, "sigmaTop", 3)}</tr>`)
      .join("");
    pin = `<section class="card">
      <div class="row-head" style="align-items:center">
        <h2>Pinned x = ${esc(formatNum(ui.probeX, 3))} m${esc(faces)}</h2>
        <button class="btn ghost" type="button" data-act="clear-probe">Clear pin</button>
      </div>
      <div class="scroll">
        <table class="data tight">
          <thead><tr><th>Combination</th><th class="r">V (kN)</th><th class="r">M (kNm)</th><th class="r">δ (mm)</th><th class="r">θ (deg)</th><th class="r">τ (MPa)</th><th class="r">σ top (MPa)</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>`;
  }

  const diagram = (id, title, unit, field) =>
    multiDiagramHtml(id, title, unit, xs, shown.map((r) => ({ id: r.id, name: r.name, style: comboStyle(mod, r.id), ys: r[field] })), result.nodeX);

  const EXT_HEAD = ["V max", "V min", "M sag", "M hog", "δ up", "δ down", "θ cw", "θ ccw", "τ max", "|σ| max"];
  const extHead = shown[0].extrema.map((e, k) => `<th class="r">${esc(EXT_HEAD[k] ?? e.label)} (${esc(e.unit)})</th>`).join("");
  const extRows = shown
    .map((r) => {
      const cells = r.extrema
        .map((e, k) => `<td class="num r pick${governing[k] === r ? " gov" : ""}" data-act="probe" data-x="${e.x}" title="x = ${esc(formatNum(e.x, 3))} m">${esc(formatNum(e.value, 3))}</td>`)
        .join("");
      return `<tr><td>${keyed(r)}</td><td class="muted">${esc(r.class)}</td>${cells}</tr>`;
    })
    .join("");

  const comboHead = shown.map((r) => `<th class="r">${keyed(r)}</th>`).join("");
  const reactRows = (part, only) =>
    result.reactions
      .filter((rx) => !only || only(rx))
      .map((rx) => {
        const vals = shown.map((r) => combinedReaction(rx, r.factors)[part]);
        const cells = vals.map((v) => `<td class="num r">${esc(formatNum(v, 3))}</td>`).join("");
        return `<tr class="clickable" data-act="probe" data-x="${rx.x}">
          <td class="num">${esc(formatNum(rx.x, 3))}</td><td>${esc(rx.support)}</td>${cells}
          <td class="num r">${esc(formatNum(Math.max(...vals), 3))}</td><td class="num r">${esc(formatNum(Math.min(...vals), 3))}</td>
        </tr>`;
      })
      .join("");
  const fixedRows = reactRows("M", (rx) => rx.support === "Fixed");
  const reactTable = (rows) => `<div class="scroll">
      <table class="data tight">
        <thead><tr><th>x (m)</th><th>Support</th>${comboHead}<th class="r">Max</th><th class="r">Min</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  const deflRows = shown
    .map((r) => {
      const dc = r.deflectionCheck;
      const gov = dc.spans.reduce((a, b) => (b.utilisation > (a?.utilisation ?? -1) ? b : a), null);
      const tone = dc.status === "PASS" ? "ok" : dc.status === "FAIL" ? "danger" : "muted";
      return `<tr${gov ? ` class="clickable" data-act="probe" data-x="${gov.peakX}"` : ""}>
        <td>${keyed(r)}</td><td class="muted">${esc(r.class)}</td><td class="nw">${esc(dc.governingLabel)}</td>
        <td class="num r">${esc(formatNum(gov ? gov.peakMm : 0, 3))}</td>
        <td class="num r">${esc(formatNum(dc.allowableMm, 2))}</td>
        <td class="num r">${esc(formatNum(dc.utilisation, 3))}</td>
        <td>${badge(dc.status, tone)}</td>
      </tr>`;
    })
    .join("");

  const sf = STATION_FIELDS.find((f) => f.value === ui.stationField) ?? STATION_FIELDS[1];
  const stRows = result.stations
    .map((s, i) => {
      const cells = shown.map((r) => `<td class="num r">${esc(formatNum(r[sf.value][i], sf.digits))}</td>`).join("");
      return `<tr class="clickable${probeOn(s.x) ? " on" : ""}" data-act="probe" data-x="${s.x}">
        <td class="num">${esc(formatNum(s.x, 3))}</td><td class="num">${s.elementIndex + 1}</td>
        <td class="muted">${s.side === "interior" ? "—" : esc(s.side)}</td>${cells}
      </tr>`;
    })
    .join("");

  const nHidden = result.comboResults.length - shown.length;
  const hiddenNote = nHidden
    ? `<p class="hint" style="margin:0;color:var(--color-warn)">${nHidden} combination${nHidden > 1 ? "s are" : " is"} hidden. The governing values below leave ${nHidden > 1 ? "them" : "it"} out.</p>`
    : "";
  return `<div class="space-y">
    ${bar}
    <div style="display:grid;gap:0.5rem">${hiddenNote}<div class="extrema">${cards}</div></div>
    ${pin}
    ${diagram("V", "Shear", "kN", "V")}
    ${diagram("M", "Bending moment (sagging +)", "kNm", "M")}
    ${diagram("v", "Deflection (up +)", "mm", "v")}
    ${diagram("slope", "Slope (clockwise +)", "deg", "slopeDeg")}
    ${diagram("tau", "Average shear stress", "MPa", "tau")}
    ${diagram("sigma", "Bending stress, top fibre", "MPa", "sigmaTop")}
    <section class="card">
      <h2>Extrema by combination</h2>
      <p class="hint">Highlighted values govern across the shown combinations — they are the values on the cards above. Click a value to pin its station.</p>
      <div class="scroll">
        <table class="data tight min-64">
          <thead><tr><th>Combination</th><th>Class</th>${extHead}</tr></thead>
          <tbody>${extRows}</tbody>
        </table>
      </div>
    </section>
    <section class="card">
      <h2>Support reactions — all combinations</h2>
      <p class="hint">Vertical reaction, kN, positive upward. Max and min are taken over the shown combinations.</p>

const FOCUS_ATTRS = ["data-act", "data-id", "data-view", "data-show", "data-tab", "data-preset", "data-field", "data-index", "data-factor", "data-x"];

// render() replaces every element, which would drop keyboard focus to the top of the page.
// Buttons, selects and checkboxes keep focus while they act, so put it back on their
// replacement. Text fields are left alone: they commit on blur, when focus is already moving.
// Controls can share every attribute (the two combination selects, extrema cards at the same
// x), so the position among identical controls is part of the key.
function sameControls(key) {
  return [...document.querySelectorAll("[data-act]")].filter((el) => FOCUS_ATTRS.every((a, i) => el.getAttribute(a) === key[i]));
}

function focusedControl() {
  const el = document.activeElement;
  if (!el || !el.hasAttribute?.("data-act")) return null;
  if (!(el.tagName === "BUTTON" || el.tagName === "SELECT" || (el.tagName === "INPUT" && el.type === "checkbox"))) return null;
  const key = FOCUS_ATTRS.map((a) => el.getAttribute(a));
  return { key, index: sameControls(key).indexOf(el) };
}

function restoreFocus(focus) {
  if (!focus) return;
  const matches = sameControls(focus.key);
  (matches[focus.index] ?? matches[0])?.focus({ preventScroll: true });
}
