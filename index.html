/* ---- Paste a supplier's table ------------------------------------------------------------- */

// Column names, compared without case, spaces, dots, commas and dashes. Names that section
// tables use for different things are left out on purpose: Zx and Sx (elastic in one country's
// tables, plastic in another's), W (also the weight per metre) and d (often the straight web
// depth, not the overall depth).
const PASTE_HEADERS = {
  name: ["name", "section", "designation", "profile", "size", "serialsize"],
  A: ["a", "area", "ag"],
  I: ["i", "ix", "iy", "ixx", "iyy", "imajor"],
  Z: ["z", "zel", "ze", "zex", "zey", "wel", "wely", "welx", "wyel", "wxel"],
  Av: ["av", "avz", "avy", "shear area"],
  h: ["h", "depth"],
  mass: ["mass", "kg/m", "weight", "m", "massperm"],
  material: ["material"],
  source: ["source"],
};
const AMBIGUOUS_Z_HEADERS = ["zx", "zy", "sx", "sy", "w", "wx", "wy", "s"];

// Units in brackets are dropped from the column's name ("A (cm2)" is A) and read separately (see
// headerUnits); a plastic or elastic qualifier is kept, so "W (pl)" is not taken for the elastic
// modulus.
function headerName(raw) {
  return String(raw)
    .toLowerCase()
    .replace(/\s+/g, " ")
    .replace(/\(([^)]*)\)|\[([^\]]*)\]/g, (_, a, b) => {
      const c = a ?? b;
      return /pl/.test(c) ? "pl" : /\bel|elastic/.test(c) ? "el" : "";
    })
    .replace(/[\s_.,-]+/g, "")
    .trim();
}
function headerKey(raw) {
  const h = headerName(raw);
  for (const [key, names] of Object.entries(PASTE_HEADERS)) if (names.some((n) => n.replace(/[\s_.,-]+/g, "") === h)) return key;
  return null;
}
// The text in a column title's brackets; units rows under the titles are added to it.
function bracketText(raw) {
  return [...String(raw).toLowerCase().matchAll(/\(([^)]*)\)|\[([^\]]*)\]/g)].map((m) => m[1] ?? m[2]).join(" ");
}
const SUPERSCRIPT_DIGITS = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "⁻": "-" };
function plainUnits(text) {
  return String(text || "").toLowerCase().replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]/g, (c) => SUPERSCRIPT_DIGITS[c]);
}
// The words of a unit text, split at spaces, brackets and punctuation ("[cm]" is "cm").
function unitWords(text) {
  return plainUnits(text).split(/[\s()[\]{},;:]+/).map((w) => w.replace(/\.$/, "")).filter(Boolean);
}
// The power of ten a unit text multiplies by: "×10^3", "x 10³", "10^6 mm4", or "mm2 x 102" and
// "103 mm2" where a superscript was lost in copying.
function unitMultiplier(text) {
  // Separate multiplication signs and unit names, so "mm²×10²" and "103mm2" split into tokens.
  const tokens = plainUnits(text)
    .replace(/[x×*·⋅∙´]/g, " x ")
    .replace(/(mm|cm)(\^?\d)?/g, " $1$2 ")
    .split(/[\s()[\]{},;:/]+/)
    .filter(Boolean);
  for (const t of tokens) {
    let m = t.match(/^10(?:\^|\*\*|e)?(-?[1-9])$/);
    if (m) return Number(m[1]);
    m = t.match(/^1(0{2,6})$/);
    if (m) return m[1].length;
  }
  return 0;
}
// The factor to the app's units (mm² for A and Av, mm⁴ for I, mm³ for Z) that a unit text gives
// for column k: null when it gives none, NaN for inches.
function statedFactor(text, k) {
  const t = plainUnits(text).replace(/\s+/g, "");
  const mm = /mm/.test(t), cm = /cm/.test(t);
  if (!mm && !cm) {
    const words = unitWords(text);
    const inchWord = (w) => /^(in|inch|inches)(\^?-?\d)?$/.test(w);
    return words.some(inchWord) && words.every((w) => inchWord(w) || /^[x×]?(10(\^?-?\d)?)?$/.test(w)) ? NaN : null;
  }
  if (mm && cm) return null;
  const pow = { A: 2, Av: 2, I: 4, Z: 3 }[k];
  return (cm ? 10 ** pow : 1) * 10 ** unitMultiplier(text);
}
function unitsWithFactor(k, f) {
  return Object.keys(PASTE_UNITS).filter((u) => Math.abs(PASTE_UNITS[u].f[k] - f) <= 1e-9 * f);
}
// Factor to mm for a unit text given for h; null for inches or feet; 1 when it gives none.
function lengthFactorOf(text) {
  const words = unitWords(text);
  if (words.includes("mm")) return 1;
  if (words.includes("cm")) return 10;
  if (words.includes("m")) return 1000;
  const imperial = (w) => /^(in|inch|inches|ft|feet)$/.test(w);
  if (words.length && words.every(imperial)) return null;
  return 1;
}

// Where a double quote opens a quoted cell: at the start of a cell, and not as a lone ditto mark
// (a '"' followed by the delimiter or the end of the line).
function opensQuote(t, i, delim, atStart) {
  return t[i] === '"' && atStart && i + 1 < t.length && t[i + 1] !== delim && t[i + 1] !== "\n" && t[i + 1] !== "\r";
}

// The delimiter of the first row: a tab, else a semicolon, else a comma, counted outside quoted
// cells (a wrapped first title is quoted and holds a line break).
function detectDelimiter(text) {
  const t = String(text || "");
  const n = { "\t": 0, ";": 0, ",": 0 };
  let quoted = false;
  let atStart = true;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (quoted) {
      if (ch === '"' && t[i + 1] === '"') i++;
      else if (ch === '"') quoted = false;
      continue;
    }
    if (ch === "\n" || ch === "\r") {
      if (n["\t"] + n[";"] + n[","]) break;
      atStart = true;
      continue;
    }
    if (ch in n) {
      n[ch]++;
      atStart = true;
      continue;
    }
    // Any delimiter may follow, so a quote at the start of a cell is judged against the tab.
    if (opensQuote(t, i, "\t", atStart) && t[i + 1] !== "," && t[i + 1] !== ";") {
      quoted = true;
      continue;
    }
    if (ch !== " ") atStart = false;
  }
  return n["\t"] ? "\t" : n[";"] ? ";" : ",";
}

// Splits pasted text into rows of cells at the delimiter, respecting double quotes: a quoted cell
// keeps its delimiters ("C 150, galv", "83,560,000") and its line breaks (a wrapped header or
// note copied from a spreadsheet). A lone '"' (a ditto mark) is text, and so is a quote that is
// never closed. Blank rows are dropped.
function parseDelimited(text, delim) {
  const t = String(text || "");
  const literal = new Set();
  for (;;) {
    const rows = [];
    let row = [];
    let cur = "";
    let quoted = false;
    let openedAt = -1;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (quoted) {
        if (ch === '"' && t[i + 1] === '"') {
          cur += '"';
          i++;
        } else if (ch === '"') quoted = false;
        else cur += ch;
      } else if (!literal.has(i) && opensQuote(t, i, delim, !cur.trim())) {
        quoted = true;
        openedAt = i;
        cur = "";
      } else if (ch === delim) {
        row.push(cur.trim());
        cur = "";
      } else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && t[i + 1] === "\n") i++;
        row.push(cur.trim());
        rows.push(row);
        row = [];
        cur = "";
      } else cur += ch;
    }
    if (quoted) {
      literal.add(openedAt);
      continue;
    }
    row.push(cur.trim());
    rows.push(row);
    return rows.filter((r) => r.some((c) => c !== ""));
  }
}

// The table's decimal mark, from the values that can only be read one way: "28,5" or "0,750"
// (a comma that cannot group thousands), "1,234,567" (commas that must), and so on. Cells that
// are not numbers ("n.a.", "-") say nothing. A semicolon-separated file implies a decimal comma
// unless its values say otherwise.
function tableDecimalMark(cells, delim) {
  let dot = 0, comma = 0;
  for (const raw of cells) {
    const s = String(raw ?? "").replace(/\s+/g, "");
    if (!/^[-+]?[\d.,]*\d[\d.,]*(e[-+]?\d+)?$/i.test(s)) continue;
    const commas = (s.match(/,/g) || []).length;
    const dots = (s.match(/\./g) || []).length;
    if (commas && dots) {
      if (s.lastIndexOf(".") > s.lastIndexOf(",")) dot++;
      else comma++;
    } else if (commas > 1) dot++;
    else if (dots > 1) comma++;
    else if (/e[-+]?\d+$/i.test(s)) {
      if (commas) comma++;
      else if (dots) dot++;
    } else if (commas === 1 && !isAmbiguousNumber(s)) comma++;
    else if (dots === 1 && !isAmbiguousDot(s)) dot++;
  }
  if (dot && !comma) return ".";
  if (comma && !dot) return ",";
  if (!dot && !comma && delim === ";") return ",";
  return null;
}

const PASTE_UNITS = {
  mm: { label: "mm², mm⁴, mm³", f: { A: 1, Av: 1, I: 1, Z: 1 } },
  cm: { label: "cm², cm⁴, cm³", f: { A: 1e2, Av: 1e2, I: 1e4, Z: 1e3 } },
  kmm: { label: "10³ mm², 10⁶ mm⁴, 10³ mm³", f: { A: 1e3, Av: 1e3, I: 1e6, Z: 1e3 } },
};
const NUM_KEYS = ["A", "I", "Z", "Av", "h", "mass"];
const SECTION_KEYS = ["A", "I", "Z", "Av"];

// Parses rows pasted from a spreadsheet (tab separated) or a CSV. The first row names the
// columns; Name, A, I and Z are required. Units are read from the titles' brackets and from
// units rows under the titles ("mm2" then "x10^2"). units: a key of PASTE_UNITS for A, Av, I and
// Z; a table whose stated units contradict it is refused with the right ones named. h is in mm
// unless its units say cm or m; the mass is in kg/m. Every row is checked for physical
// consistency (see beamPlausibility), which catches unit slips and misread separators.
function parseBeamTable(text, units, material) {
  const src = String(text || "");
  const delim = detectDelimiter(src);
  const table = parseDelimited(src, delim);
  if (table.length < 2) return { beams: [], errors: ["Paste a header row and at least one beam."], notes: [], header: [] };
  const titles = table[0].map((t) => t.replace(/\s+/g, " "));
  const keys = titles.map(headerKey);
  const header = keys.slice();
  const notes = [];
  // The first column of each kind is used; say so when there are more, and which are ignored.
  keys.forEach((k, j) => {
    const first = k ? keys.indexOf(k) : j;
    if (first !== j) {
      notes.push(`Columns "${titles[first]}" and "${titles[j]}" both look like ${k === "name" ? "the name" : k}; using "${titles[first]}".`);
      header[j] = null;
    }
  });
  const ignored = titles.filter((t, j) => t && !keys[j]);
  if (ignored.length) notes.push(`Columns not used: ${ignored.join(", ")}.`);
  const missingCols = ["name", "A", "I", "Z"].filter((k) => !header.includes(k));
  if (missingCols.length) {
    const zHint = missingCols.includes("Z") && titles.some((t) => AMBIGUOUS_Z_HEADERS.includes(headerName(t)))
      ? " Zx, Sx and W are not read as Z, because tables use them for different moduli; name the elastic section modulus column Wel or Z."
      : "";
    return { beams: [], errors: [`The header row needs columns for ${missingCols.join(", ")}. Found: ${titles.join(", ")}.${zHint}`], notes, header };
  }
  // Units rows: rows right under the titles whose A, I and Z cells are unit text rather than
  // numbers ("mm2", "x10^2", "[cm4]"), whatever their name cell says ("Units", "-").
  const col = (k) => header.indexOf(k);
  const isUnitCell = (c) => {
    const v = String(c ?? "").trim();
    return v !== "" && !Number.isFinite(parseNum(v)) && /mm|cm|in|10|\^|[x×]|[²³⁴]/i.test(v);
  };
  let unitRows = 0;
  while (unitRows < 3 && table[1 + unitRows] && ["A", "I", "Z"].every((k) => isUnitCell(table[1 + unitRows][col(k)]))) unitRows++;
  const unitText = titles.map((t, j) => [bracketText(t), ...table.slice(1, 1 + unitRows).map((r) => r[j] ?? "")].join(" ").trim());
  const body = table.slice(1 + unitRows);
  const errors = [];
  const label = (u) => PASTE_UNITS[u].label;
  const stated = header.map((k, j) => (SECTION_KEYS.includes(k) ? { k, j, f: statedFactor(unitText[j], k) } : null)).filter((c) => c && c.f !== null);
  if (stated.some((c) => Number.isNaN(c.f))) return { beams: [], errors: ["The table gives inch units. Convert it to mm or cm first."], notes, header };
  let fitting = Object.keys(PASTE_UNITS);
  for (const c of stated) {
    const u = unitsWithFactor(c.k, c.f);
    if (!u.length) return { beams: [], errors: [`The units of column "${titles[c.j]}" (${unitText[c.j]}) are none the app reads. Use mm², mm⁴, mm³, cm², cm⁴, cm³, or 10³ mm², 10⁶ mm⁴, 10³ mm³.`], notes, header };
    fitting = fitting.filter((x) => u.includes(x));
  }
  if (stated.length && !fitting.length) return { beams: [], errors: [`The units given for A, I and Z do not belong to one system (${stated.map((c) => `${titles[c.j]}: ${unitText[c.j]}`).join("; ")}).`], notes, header };
  const statedUnits = stated.length ? fitting : null;
  if (statedUnits && !statedUnits.includes(units)) {
    const named = statedUnits.map(label).join(" or ");
    return {
      beams: [], notes, header,
      errors: [`The table gives ${named}, but the units are set to ${label(units)}.`],
      unitHint: `The table's units are ${named}: switch the units to ${named}.`,
    };
  }
  const hFactor = lengthFactorOf(unitText[col("h")]);
  if (header.includes("h") && hFactor === null) return { beams: [], errors: ["The depth h is not in mm, cm or m. Convert that column first."], notes, header };
  if (header.includes("mass") && unitWords(unitText[col("mass")]).some((w) => /^(lbs?|lb\/ft|plf)$/.test(w))) return { beams: [], errors: ["The mass is not in kg/m. Convert that column first."], notes, header };
  const rows = body.map((cells, i) => {
    const row = {};
    header.forEach((k, j) => {
      if (k) row[k] = cells[j];
    });
    // Cells beyond the titles: usually unquoted thousands separators in a CSV ("83,560,000").
    const extra = cells.slice(titles.length).filter((c) => c !== "").length;
    return { row, extra, count: cells.length, label: `Row ${i + 2 + unitRows}${row.name ? ` (${String(row.name).replace(/\s+/g, " ")})` : ""}` };
  });
  const decimal = tableDecimalMark(rows.flatMap(({ row }) => NUM_KEYS.map((k) => row[k])), delim);
  // Raw numbers (table units), with the problems that do not depend on the units.
  const parsed = rows.map(({ row, label: rowLabel, extra, count }) => {
    const errs = [];
    const raw = {};
    if (extra) errs.push(`${rowLabel}: has ${count} cells but the header has ${titles.length}. In a CSV, numbers with thousands separators must be in quotes.`);
    for (const k of NUM_KEYS) {
      const cell = row[k];
      if (cell === undefined || String(cell).trim() === "") continue;
      // With no decimal mark known, "1,808", and for a section property "1.808", could be
      // either; never guessed.
      if (!decimal && (isAmbiguousNumber(cell) || (SECTION_KEYS.includes(k) && isAmbiguousDot(cell)))) {
        errs.push(`${rowLabel}: ${ambiguityProblem(k, cell)}`);
        continue;
      }
      const v = parseNum(cell, decimal);
      if (Number.isFinite(v)) raw[k] = k === "h" ? v * hFactor : v;
      else if (["A", "I", "Z"].includes(k)) errs.push(`${rowLabel}: ${k} "${cell}" is not a number.`);
    }
    return { row, label: rowLabel, raw, errs, material: matchMaterial(row.material) || material };
  });
  const convert = (raw, u) => {
    const f = PASTE_UNITS[u]?.f || PASTE_UNITS.mm.f;
    return { A: raw.A * f.A, I: raw.I * f.I, Z: raw.Z * f.Z, Av: (raw.Av ?? 0) * f.Av, h: raw.h ?? null, mass: raw.mass ?? null };
  };
  const implausible = (p, u) => (["A", "I", "Z"].every((k) => p.raw[k] > 0) ? beamPlausibility({ ...convert(p.raw, u), material: p.material }) : []);
  const beams = [];
  const seen = new Set();
  for (const p of parsed) {
    const { row, raw, errs } = p;
    if (errs.length) {
      errors.push(...errs);
      continue;
    }
    const v = convert(raw, units);
    const beam = normaliseBeam({
      name: row.name, shape: "manual", material: p.material,
      A: v.A, I: v.I, Z: v.Z, Av: v.Av, h: v.h, mass: v.mass,
      source: row.source || AUTO_SOURCES[2], updated: todayIso(),
    });
    const bad = beam ? implausible(p, units) : [];
    if (!beam) errors.push(`${p.label}: needs a name and numbers greater than zero for A, I and Z.`);
    else if (bad.length) errors.push(...bad.map((x) => `${p.label}: ${x}`));
    else if (seen.has(beam.name.toLowerCase())) errors.push(`${p.label}: the name appears twice; only the first is used.`);
    else {
      seen.add(beam.name.toLowerCase());
      beams.push(beam);
    }
  }
  // A likely unit slip, when the table does not state its units: rows that do not fit these units
  // but all fit other ones; or sections whose depth (about 2·I/Z) is implausible. mm and cm cannot
  // be told apart from the property ratios alone, so the depth is the remaining clue.
  const readable = parsed.filter((p) => !p.errs.length && ["A", "I", "Z"].every((k) => p.raw[k] > 0));
  let unitHint = "";
  if (!statedUnits && readable.some((p) => implausible(p, units).length)) {
    const fits = Object.keys(PASTE_UNITS).filter((u) => u !== units && readable.every((p) => !implausible(p, u).length));
    if (fits.length === 1) unitHint = `These values do not fit ${label(units)}, but they all fit ${label(fits[0])}. If that is the table's unit, switch the units to ${label(fits[0])}.`;
    else if (fits.length) unitHint = `These values do not fit ${label(units)}. They fit ${fits.map(label).join(" and also ")}: check which units the table uses.`;
  }
  // Depth, about 2·I/Z, row by row: read in mm, no beam section here is under 40 mm deep; read in
  // cm or 10³ units, none is over 1.2 m. Such rows suggest the other unit, whether or not the
  // table states its units (it may be mislabelled), and whatever other rows do.
  const depthOf = (b) => (2 * b.I) / b.Z;
  const odd = beams.filter((b) => (units === "mm" ? depthOf(b) < 40 : depthOf(b) > 1200));
  if (odd.length) {
    const shown = `${odd.slice(0, 3).map((b) => `${b.name} ${formatNum(depthOf(b), 0)} mm`).join(", ")}${odd.length > 3 ? ` and ${odd.length - 3} more` : ""}`;
    const other = units === "mm" ? "cm" : "mm";
    unitHint = [unitHint, `${odd.length === beams.length ? "These sections" : "Some sections"} would be very ${units === "mm" ? "shallow" : "deep"} (2·I/Z: ${shown}). If the table is in ${other}², ${other}⁴ and ${other}³, switch the units to ${label(other)}.`].filter(Boolean).join(" ");
  }
  return { beams, errors, notes, header, unitHint };
}

function pasteCardHtml() {
  const r = ui.pasteResult;
  let result = "";
  if (r) {
    const names = new Set(effectiveBeams().map((b) => b.name.toLowerCase()));
    const replacing = r.beams.filter((b) => names.has(b.name.toLowerCase())).length;
    const rows = r.beams
      .slice(0, 8)
      .map((b) => `<tr><td>${esc(b.name)}</td><td class="num">${esc(formatNum(b.A, 1))}</td><td class="num">${esc(formatNum(b.I, 0))}</td><td class="num">${esc(formatNum(b.Z, 0))}</td><td class="num">${esc(formatNum(b.Av, 1))}</td><td class="num">${esc(formatNum(b.h ?? NaN, 1))}</td><td class="num">${esc(formatNum((2 * b.I) / b.Z, 0))}</td><td>${names.has(b.name.toLowerCase()) ? badge("Replaces", "warn") : badge("New", "ok")}</td></tr>`)
      .join("");
    result = `
      ${r.unitHint ? `<p class="note warn">${esc(r.unitHint)}</p>` : ""}
      ${r.errors.length ? `<ul class="warn-list">${r.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
      ${r.notes?.length ? `<p class="hint">${r.notes.map(esc).join(" ")}</p>` : ""}
      ${r.beams.length ? `<div class="scroll"><table class="data tight"><thead><tr><th>Name</th><th>A (mm²)</th><th>I (mm⁴)</th><th>Z (mm³)</th><th>Av (mm²)</th><th>h (mm)</th><th title="Twice I/Z: the depth of a section symmetric about its bending axis. A quick check of the units.">≈ depth 2I/Z (mm)</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      ${r.beams.length > 8 ? `<p class="hint">…and ${r.beams.length - 8} more.</p>` : ""}
      <div class="actions form-actions"><button class="btn primary" type="button" data-act="paste-apply">Add ${r.beams.length} beam${r.beams.length === 1 ? "" : "s"}${replacing ? ` (${replacing} replace existing)` : ""}</button></div>` : ""}`;
  }
  return `<section class="card span-2">
    <div class="row-head">
      <div><h2>Paste from a spreadsheet</h2><p class="hint">Copy rows from a supplier's section table, including the header row. Needs columns Name, A, I and Z (the elastic modulus); Av, h (mm), mass (kg/m), material and source are optional.</p></div>
      <button class="btn ghost" type="button" data-act="paste-toggle">Close</button>
    </div>
    <div class="fields">
      <label class="label"><span>Units of A, I, Z, Av</span><select class="sel" data-act="paste-units">${options(Object.entries(PASTE_UNITS).map(([value, u]) => ({ value, label: u.label })), ui.pasteUnits)}</select></label>
      <label class="label"><span>Material</span><select class="sel" data-act="paste-material">${options(BEAM_MATERIALS, ui.pasteMaterial)}</select></label>
    </div>
    <label class="label paste-box"><span>Rows</span><textarea class="field area" rows="6" spellcheck="false" data-act="paste-text" placeholder="Name&#9;A&#9;I&#9;Z&#9;Av&#10;C 150x65x20x2.0&#9;5.87&#9;203&#9;27.1&#9;3.0">${esc(ui.pasteText)}</textarea></label>
    <div class="actions form-actions"><button class="btn" type="button" data-act="paste-check">Check rows</button></div>
    ${result}
  </section>`;
}

/* ---- Beams tab ---------------------------------------------------------------------------- */

function libraryStatusText() {
  const n = effectiveBeams().length;
  const count = `${n} beam${n === 1 ? "" : "s"}`;
  if (lib.loading && lib.source === "none") return "Loading beams.json from GitHub…";
  if (lib.source === "github") {
    const when = lib.base.updated ? `, updated ${lib.base.updated.slice(0, 10)}` : "";
    return `${count} · beams.json revision ${lib.base.revision}${when}${lib.loading ? " · checking for updates…" : ""}`;
  }
  if (lib.source === "cache") return `${count} · copy saved in this browser${lib.loading ? " · checking GitHub…" : ""}`;
  return `${count} · not loaded from GitHub`;
}

function beamRowStatus(b, conflicts) {
  if (conflicts.some((c) => lower(c.name) === lower(b.name))) return badge("Changed on GitHub too", "danger");
  const onGh = lib.base.beams.find((x) => x.name === b.name);
  if (!onGh) return badge("Not on GitHub", "warn");
  if (!sameBeam(onGh, b)) return badge("Edited here", "warn");
  return badge("On GitHub", "ok");
}

// Sections the model uses that are saved with it but not in the library (by exact name).
function modelOnlySections(mod) {
  const defs = mod.sectionDefs || {};
  return sectionNamesUsed(mod).filter((n) => Object.prototype.hasOwnProperty.call(defs, n) && !SECTION_LIBRARY.some((s) => s !== CUSTOM_SECTION && s.name === n));
}
// Library beams the model uses whose A, I, Z or Av differ from the copy saved with the model.
function staleSectionNames(mod) {
  const defs = mod.sectionDefs || {};
  return sectionNamesUsed(mod).filter((n) => {
    const b = SECTION_LIBRARY.find((s) => s !== CUSTOM_SECTION && s.name === n);
    return b && Object.prototype.hasOwnProperty.call(defs, n) && sectionPropsDiffer(b, defs[n]).length;
  });
}
function beamSummary(b) {
  return b ? `A ${formatNum(b.A, 1)} · I ${formatNum(b.I, 0)} · Z ${formatNum(b.Z, 0)} · Av ${formatNum(b.Av, 1)}` : "deleted";
}

function conflictsHtml(conflicts) {
  if (!conflicts.length) return "";
  const rows = conflicts.map((c) => {
    const sameProps = c.theirs && c.mine && !sectionPropsDiffer(c.theirs, c.mine).length;
    return `<tr>
      <td class="nw"><span class="beam-name">${esc(c.name)}</span></td>
      <td>${esc(beamSummary(c.theirs))}</td>
      <td>${esc(beamSummary(c.mine))}${sameProps ? ' <span class="subtle">(same A, I, Z, Av; other details differ)</span>' : ""}</td>
      <td class="nw row-actions">
        <button class="btn sm-btn" type="button" data-act="conflict-theirs" data-name="${esc(c.name)}" aria-label="Keep the GitHub version of ${esc(c.name)}">Keep GitHub's</button>
        <button class="btn sm-btn" type="button" data-act="conflict-mine" data-name="${esc(c.name)}" aria-label="Keep your version of ${esc(c.name)}">Keep mine</button>
      </td>
    </tr>`;
  }).join("");
  return `<div class="conflicts">
    <p class="note danger">Someone else changed ${conflicts.length === 1 ? "a beam" : `${conflicts.length} beams`} on GitHub that ${conflicts.length === 1 ? "was" : "were"} also edited here. Choose which version to keep; nothing is saved until you do.</p>
    <div class="scroll"><table class="data tight"><thead><tr><th>Beam</th><th>On GitHub now</th><th>Yours</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function renderBeams(mod) {
  const beams = effectiveBeams();
  const diff = pendingDiff();
  const conflicts = pendingConflicts();
  const shapeLabel = (id) => (shapeSpec(id) || shapeSpec("manual")).label.replace(/ \(.*\)$/, "");
  const sorted = beams.slice().sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));
  const rows = sorted
    .map((b) => {
      const isDefault = mod.defaultSection === b.name;
      const confirming = ui.confirmDelete === b.name;
      return `<tr>
        <td class="nw"><span class="beam-name">${esc(b.name)}</span>${b.notes ? `<span class="subtle beam-note">${esc(b.notes)}</span>` : ""}</td>
        <td>${esc(shapeLabel(b.shape))}</td>
        <td>${esc(b.material || "—")}</td>
        <td class="num">${esc(formatNum(b.h ?? NaN, 1))}</td>
        <td class="num">${esc(formatNum(b.A, 1))}</td>
        <td class="num">${esc(formatNum(b.I, 0))}</td>
        <td class="num">${esc(formatNum(b.Z, 0))}</td>
        <td class="num">${esc(formatNum(b.Av, 1))}</td>
        <td class="num">${esc(formatNum(b.mass ?? NaN, 2))}</td>
        <td>${beamRowStatus(b, conflicts)}</td>
        <td class="nw row-actions">
          <button class="btn sm-btn" type="button" data-act="beam-use" data-name="${esc(b.name)}" ${isDefault ? "disabled" : ""} title="Make this the model's default section" aria-label="${isDefault ? `${esc(b.name)} is the default section` : `Use ${esc(b.name)} as the default section`}">${isDefault ? "Default" : "Use"}</button>
          <button class="btn sm-btn" type="button" data-act="beam-edit" data-name="${esc(b.name)}" aria-label="Edit ${esc(b.name)}">Edit</button>
          <button class="btn sm-btn${confirming ? " danger" : ""}" type="button" data-act="beam-delete" data-name="${esc(b.name)}" aria-label="${confirming ? "Confirm delete of" : "Delete"} ${esc(b.name)}">${confirming ? "Confirm delete" : "Delete"}</button>
        </td>
      </tr>`;
    })
    .join("");
  const removedRows = diff.removed.length
    ? `<p class="note">Deleted here, still on GitHub until you save: ${diff.removed.map((n) => `<span class="mono">${esc(n)}</span> <button class="btn ghost sm-btn" type="button" data-act="beam-restore" data-name="${esc(n)}" aria-label="Undo deleting ${esc(n)}">Undo</button>`).join(" ")}</p>`
    : "";
  const list = (names) => names.map((n) => `<span class="mono">${esc(n)}</span>`).join(", ");
  const carried = modelOnlySections(mod);
  // Same name as a library beam except for capitals: offer to point the model at the library's.
  const respell = carried.filter((n) => beamNamed(beams, n));
  const fromModel = carried.filter((n) => !beamNamed(beams, n));
  const fromModelNote = fromModel.length
    ? `<p class="note warn">This model carries ${fromModel.length === 1 ? "a section" : `${fromModel.length} sections`} that ${fromModel.length === 1 ? "is" : "are"} not in the library: ${list(fromModel)}. <button class="btn sm-btn" type="button" data-act="beams-from-model">Add to library</button></p>`
    : "";
  const respellNote = respell
    .map((n) => {
      const libName = beamNamed(beams, n).name;
      return `<p class="note warn">The model's section <span class="mono">${esc(n)}</span> matches the library's <span class="mono">${esc(libName)}</span> except for capitals; it is analysed with the copy saved with the model. <button class="btn sm-btn" type="button" data-act="beam-respell" data-name="${esc(n)}">Use the library's ${esc(libName)}</button></p>`;
    })
    .join("");
  // A missing name that only differs from a library beam in capitals or spaces is pointed at that
  // beam; any other gets a button that opens the form under its name.
  const missing = sectionNamesUsed(mod).filter((n) => resolveSection(n, {}, mod.sectionDefs).missing);
  const missingNote = missing.length
    ? `<p class="note danger">This model uses ${missing.length === 1 ? "a section" : `${missing.length} sections`} that ${missing.length === 1 ? "is" : "are"} in neither the library nor saved with the model: ${list(missing)}. Add ${missing.length === 1 ? "it" : "them"} with the right properties, or choose another section on the Geometry tab. ${missing
        .map((n) => {
          const near = beamNamed(beams, n);
          return near
            ? `<button class="btn sm-btn" type="button" data-act="beam-respell" data-name="${esc(n)}">Use the library's ${esc(near.name)}</button>`
            : `<button class="btn sm-btn" type="button" data-act="beam-add-named" data-name="${esc(n)}">Add ${esc(n)}</button>`;
        })
        .join(" ")}</p>`
    : "";
  const usedNames = new Set(sectionNamesUsed(mod));
  const unusedCopies = Object.keys(mod.sectionDefs || {}).filter((n) => !usedNames.has(n));
  const unusedNote = unusedCopies.length
    ? `<p class="note">Saved with this model but not used by it: ${list(unusedCopies)}. They stay selectable on the Geometry tab. <button class="btn ghost sm-btn" type="button" data-act="copies-remove">Remove ${unusedCopies.length === 1 ? "it" : "them"}</button></p>`
    : "";
  const stale = staleSectionNames(mod);
  const staleNote = stale.length
    ? `<p class="note warn">The library's values for ${list(stale)} differ from the ${stale.length === 1 ? "copy" : "copies"} saved with this model; the analysis uses the library's (the QA tab lists the differences). If the saved values are the right ones, edit the library beam instead. <button class="btn sm-btn" type="button" data-act="sections-accept">Use the library's values</button></p>`
    : "";
  // Announced through the page's single live region (see render), so not role="status" here.
  const msg = lib.message
    ? `<p class="note ${esc(lib.message.tone || "muted")}">${esc(lib.message.text)}${lib.message.link ? ` <a class="link" data-act="link" data-name="message" href="${esc(lib.message.link)}" target="_blank" rel="noopener">${esc(lib.message.linkText || "Open")}</a>` : ""}</p>`
    : "";
  const pendingParts = [
    diff.added.length ? `${diff.added.length} added` : "",
    diff.changed.length ? `${diff.changed.length} edited` : "",
    diff.removed.length ? `${diff.removed.length} deleted` : "",
  ].filter(Boolean).join(", ");
  const pendingNote = diff.count
    ? `<p class="note warn">${diff.count} change${diff.count === 1 ? "" : "s"} in this browser not on GitHub yet (${esc(pendingParts)}). <button class="btn ghost sm-btn${ui.confirmDiscard ? " danger" : ""}" type="button" data-act="beams-discard" ${lib.saving ? "disabled" : ""}>${ui.confirmDiscard ? "Confirm: discard them" : "Discard"}</button></p>`
    : "";
  const empty = `<div class="empty"><p>No beams in the library yet.</p><p class="hint">Add the sections you use. They are stored in beams.json in the ${esc(BEAM_REPO.owner)}/${esc(BEAM_REPO.repo)} repository, so everyone using CBA gets them.</p></div>`;
  const tokenTail = lib.token ? lib.token.slice(-4) : "";
  const ghCard = `<section class="card">
    <h2>GitHub</h2>
    <p class="hint">The library is <a class="link" data-act="link" data-name="file" href="${GH_FILE_URL}" target="_blank" rel="noopener">beams.json</a> in ${esc(BEAM_REPO.owner)}/${esc(BEAM_REPO.repo)}. "Save to GitHub" commits it to ${esc(BEAM_REPO.branch)}; every change is kept in the <a class="link" data-act="link" data-name="history" href="${GH_HISTORY_URL}" target="_blank" rel="noopener">file history</a>. Reading needs no token.</p>
    ${lib.token
      ? `<div class="token-row"><span class="mono-note" style="margin:0">Token set · ends …${esc(tokenTail)}${lib.remember ? " · remembered on this device" : " · forgotten when the page closes"}</span><button class="btn ghost sm-btn" type="button" data-act="gh-forget">Forget token</button></div>`
      : `<label class="label" style="margin-top:0.75rem"><span>GitHub token (needed to save)</span><input class="field" type="password" autocomplete="off" spellcheck="false" data-act="gh-token" placeholder="github_pat_… or ghp_…"></label>`}
    <label class="check"><input type="checkbox" data-act="gh-remember" ${lib.remember ? "checked" : ""}> Remember the token on this device</label>
    <details class="howto">
      <summary>How to get a token</summary>
      <ol>
        <li>Signed in to the ${esc(BEAM_REPO.owner)} GitHub account, open <a class="link" data-act="link" data-name="token" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Settings → Developer settings → Fine-grained tokens → Generate new token</a>.</li>
        <li>Repository access: <b>Only select repositories</b> → ${esc(BEAM_REPO.repo)}. Permissions → Repository → <b>Contents: Read and write</b>. Pick an expiry.</li>
        <li>Paste the token above. On your own GitHub account instead, you need collaborator access to ${esc(BEAM_REPO.repo)} and a classic token with the <b>public_repo</b> scope, because fine-grained tokens only reach repositories their owner controls.</li>
      </ol>
      <p class="hint">The token is sent only to api.github.com. A remembered token is kept in this browser's storage for lumax-energy.github.io, which the other Lumax pages on that address can also read; leave "Remember" off on shared computers.</p>
    </details>
  </section>`;
  return `<div class="beams-grid">
    <section class="card span-2">
      <div class="row-head">
        <div>
          <h2>Beam library</h2>
          <p class="hint" id="lib-status">${esc(libraryStatusText())}</p>
        </div>
        <div class="actions" id="lib-actions">
          <button class="btn" type="button" data-act="new-beam">${iconPlus()} Add beam</button>
          <button class="btn" type="button" data-act="paste-toggle">Paste table</button>
          <button class="btn" type="button" data-act="beams-reload" ${lib.loading || lib.saving ? 'aria-disabled="true"' : ""}>${iconReset()} Reload</button>
          <button class="btn" type="button" data-act="beams-download">${iconDownload()} beams.json</button>
          <button class="btn primary" type="button" data-act="beams-save" ${!lib.saving && ((!diff.count && !lib.missing && !lib.uncertain) || conflicts.length) ? "disabled" : ""} ${lib.saving ? 'aria-disabled="true"' : ""} ${conflicts.length ? 'title="Choose which version to keep first"' : ""}>${iconUpload()} ${lib.saving ? "Saving…" : diff.count ? `Save to GitHub (${diff.count})` : lib.missing || lib.uncertain ? "Save to GitHub" : "Saved to GitHub"}</button>
        </div>
      </div>
      <div id="lib-notes">${msg}${conflictsHtml(conflicts)}${pendingNote}${removedRows}${missingNote}${staleNote}${respellNote}${fromModelNote}${unusedNote}</div>
      ${beams.length ? `<div class="scroll"><table class="data min-64 beam-table">
        <thead><tr><th>Name</th><th>Shape</th><th>Material</th><th class="r">h (mm)</th><th class="r">A (mm²)</th><th class="r">I (mm⁴)</th><th class="r">Z (mm³)</th><th class="r">Av (mm²)</th><th class="r">kg/m</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>` : empty}
    </section>
    ${ui.beamDraft ? beamFormHtml(ui.beamDraft) : ""}
    ${ui.pasteOpen ? pasteCardHtml() : ""}
    ${ghCard}
    <section class="card">
      <h2>How the library is used</h2>
      <ul class="scope-list">
        <li>Sections are matched by name. The Geometry tab lists every library beam; "Custom" uses the model's own I, Z, A and Av.</li>
        <li>A model keeps a copy of the properties of the beams it uses. If a beam is later deleted or renamed in the library, the model still analyses with its copy and the QA tab says so.</li>
        <li>Properties are major-axis, for sections symmetric about the bending axis. Calculated values are nominal gross-section values; check them against the supplier or design-code tables before design use.</li>
        <li>Edits stay in this browser until saved to GitHub. Saving keeps the beams colleagues saved in the meantime; if someone changed or deleted a beam you also edited, nothing is saved until you choose which version to keep.</li>
      </ul>
    </section>
  </div>`;
}

// Re-renders now, unless a text field is being typed in: then after it loses focus, so an
// update arriving from the network never throws away half-typed input.
// Whether rebuilding the page now would take something from the user: a text field in use, a
// select being opened, or anything else focused in the page that render() cannot give focus back
// to. Buttons, links, checkboxes and closed selects with data-act get their focus back
// (restoreFocus).
function focusBusy(el) {
  const app = typeof document !== "undefined" ? document.getElementById("app") : null;
  if (!el || el === document.body || !app?.contains(el)) return false;
  // A select is busy only while its list may be open (being pressed); a closed one gets its
  // focus back like a button.
  if (el.tagName === "SELECT") return ui.pointerDown || !el.hasAttribute("data-act");
  const restorable = el.hasAttribute("data-act") && (el.tagName === "BUTTON" || el.tagName === "A" || (el.tagName === "INPUT" && (el.type === "checkbox" || el.type === "radio")));
  return !restorable;
}

// Re-renders now, unless the user is in a field (see focusBusy): then once they have left it and
// are not in another, so an update arriving from the network never throws away half-typed input,
// a caret position or an open list. Meanwhile the message is announced and the Beams tab's status
// line, buttons and messages are brought up to date in place.
function renderWhenIdle() {
  const el = typeof document !== "undefined" ? document.activeElement : null;
  if (!focusBusy(el)) {
    render();
    return;
  }
  announce(lib.message);
  refreshLibraryChrome();
  // Already waiting on this element. (If focus moved without its blur reaching us, as in a window
  // that is not focused, wait on the element that has focus now.)
  if (ui.renderQueued && ui.waitingOn === el) return;
  ui.renderQueued = true;
  waitForIdle(el);
}

function waitForIdle(el) {
  ui.waitingOn = el;
  el.addEventListener("blur", () => {
    const go = () => {
      if (!ui.renderQueued) return;
      const now = document.activeElement;
      if (focusBusy(now)) {
        waitForIdle(now);
        return;
      }
      const focus = focusedControl(true);
      render();
      restoreFocus(focus);
    };
    if (ui.pointerDown) afterPress(go);
    else setTimeout(go, 0);
  }, { once: true });
}

// The field blurs when a button is pressed to leave it, before the click: rebuilding the page then
// would remove the button under the pointer and lose the click. So wait until the press has ended
// in a click (or, if it does not, shortly after the release).
function afterPress(go) {
  let timer = 0;
  const finish = () => {
    document.removeEventListener("click", finish, true);
    document.removeEventListener("pointerup", released, true);
    document.removeEventListener("mouseup", released, true);
    clearTimeout(timer);
    setTimeout(go, 0);
  };
  const released = () => {
    clearTimeout(timer);
    timer = setTimeout(finish, 300);
  };
  document.addEventListener("click", finish, true);
  document.addEventListener("pointerup", released, true);
  document.addEventListener("mouseup", released, true);
  timer = setTimeout(finish, 30000);
}

// While a field holds the render: the header's status badge and summary line (the analysis may
// have changed with the library), and on the Beams tab its status line, buttons and messages,
// redrawn in place. None of them contain the field.
function refreshLibraryChrome() {
  if (typeof document === "undefined") return;
  const result = analyze(model);
  const badgeEl = document.querySelector(".header .badge");
  if (badgeEl) badgeEl.outerHTML = badge(result.status, statusTone(result));
  const meta = document.querySelector(".meta");
  if (meta) meta.innerHTML = metaHtml(result);
  if (ui.tab !== "beams") return;
  const active = document.activeElement;
  const fresh = document.createElement("template");
  fresh.innerHTML = renderBeams(model);
  for (const id of ["lib-status", "lib-actions", "lib-notes"]) {
    const live = document.getElementById(id);
    const next = fresh.content.getElementById(id);
    if (live && next && !live.contains(active)) live.innerHTML = next.innerHTML;
  }
}

let model = excelExample();

function hydrate() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY_LEGACY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.elements) || !Array.isArray(parsed.loads)) return;
    const base = excelExample();
    const zero = LOAD_CASES.reduce((acc, k) => ((acc[k] = 0), acc), {});
    model = resizeElements(
      withUniqueComboIds({
        ...base,
        ...withCustomNames(parsed),
        combinations: (parsed.combinations ?? base.combinations).map((c) => ({
          ...c,
          factors: { ...zero, ...c.factors },
        })),
      }),
      parsed.nElements ?? base.nElements,
    );
  } catch {
    /* keep default */
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(model));
  } catch {
    /* ignore */
  }
}

function esc(s) {
  return String(s)
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}

function badge(text, tone) {
  return `<span class="badge ${tone || "muted"}">${esc(text)}</span>`;
}

function iconDownload() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`;
}
function iconUpload() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>`;
}
function iconReset() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`;
}
function iconPlus() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`;
}
function iconTrash() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`;
}

function options(list, selected) {
  return list
    .map((v) => {
      const val = typeof v === "object" ? v.value : v;
      const lab = typeof v === "object" ? v.label : v;
      return `<option value="${esc(val)}"${String(val) === String(selected) ? " selected" : ""}>${esc(lab)}</option>`;
    })
    .join("");
}

function magUnit(type) {
  if (type === "UDL") return "kN/m";
  if (type === "Moment") return "kNm";
  return "kN";
}

function combinedReaction(r, factors) {
  let V = 0;
  let M = 0;
  for (const c of LOAD_CASES) {
    V += r.vertical[c] * (factors[c] ?? 0);
    M += r.moment[c] * (factors[c] ?? 0);
  }
  return { V, M };
}

function seriesFrom(result, field) {
  return result.stations.map((s, i) => ({ x: s.x, y: result.selected[field][i] ?? 0 }));
}

function envelopeTrace(stations, combos, field, pick) {
  return stations.map((s) => {
    let best = pick === "max" ? -Infinity : Infinity;
    for (const c of combos) {
      let v = 0;
      for (const k of LOAD_CASES) v += s[field][k] * (c.factors[k] ?? 0);
      if (pick === "max") best = Math.max(best, v);
      else best = Math.min(best, v);
    }
    return { x: s.x, y: Number.isFinite(best) ? best : 0 };
  });
}

function nearest(points, x) {
  if (!points.length) return null;
  let best = points[0];
  let bestD = Math.abs(best.x - x);
  for (const p of points) {
    const d = Math.abs(p.x - x);
    if (d < bestD) {
      best = p;
      bestD = d;
    }
  }
  return best;
}

function nearestIndex(xs, x) {
  let best = 0;
  for (let i = 1; i < xs.length; i++) if (Math.abs(xs[i] - x) < Math.abs(xs[best] - x)) best = i;
  return best;
}

function viewBoxSize(svg) {
  const [, , W, H] = svg.getAttribute("viewBox").split(" ").map(Number);
  return { W, H };
}

// Pointer x in viewBox units. The diagrams keep their aspect ratio, so on a wide screen the
// drawing sits centred with blank margins either side; scaling by the element width alone
// would put the pointer at the wrong station. The viewBox is read on every call because a
// resize across the phone breakpoint redraws the diagram at a different width.
function svgPointerX(svg, ev) {
  const { W, H } = viewBoxSize(svg);
  const rect = svg.getBoundingClientRect();
  const scale = Math.min(rect.width / W, rect.height / H) || 1;
  return (ev.clientX - rect.left - (rect.width - W * scale) / 2) / scale;
}

function isAllView(mod) {
  return mod.comboView === "all";
}

function activeCombos(mod) {
  return mod.combinations.filter((c) => LOAD_CASES.some((k) => (c.factors[k] ?? 0) !== 0));
}

function hiddenSet(mod) {
  return new Set(Array.isArray(mod.hiddenComboIds) ? mod.hiddenComboIds : []);
}

function shownComboResults(mod, result) {
  const hidden = hiddenSet(mod);
  return result.comboResults.filter((r) => !hidden.has(r.id));
}

// Colour follows the combination's row, not its rank among those shown, so hiding one
// never repaints the others.
function comboStyle(mod, id) {
  const i = Math.max(0, mod.combinations.findIndex((c) => c.id === id));
  return { color: `var(--combo-${(i % 8) + 1})`, dash: COMBO_DASHES[Math.floor(i / 8) % COMBO_DASHES.length] };
}

function comboKey(style) {
  const dash = style.dash ? ` stroke-dasharray="${style.dash}"` : "";
  return `<svg class="key" viewBox="0 0 20 8" aria-hidden="true"><line x1="1" y1="4" x2="19" y2="4" stroke="${style.color}" stroke-width="2.4"${dash}/></svg>`;
}

// The combination analyse() actually uses: it falls back to the first row when the stored id
// is missing or stale.
function effectiveComboId(mod) {
  return mod.combinations.some((c) => c.id === mod.selectedComboId) ? mod.selectedComboId : mod.combinations[0]?.id;
}

function comboSelectOptions(mod) {
  const all = isAllView(mod);
  const singles = options(mod.combinations.map((c) => ({ value: c.id, label: c.name })), all ? null : effectiveComboId(mod));
  // With no combination to show the browser would display the first option, "All
  // combinations", while the single view is active.
  const none = !all && effectiveComboId(mod) == null ? `<option value="" selected disabled>None</option>` : "";
  return `${none}<option value="${ALL_COMBOS}"${all ? " selected" : ""}>All combinations</option><optgroup label="Single combination">${singles}</optgroup>`;
}

// Rows are looked up by id everywhere (selection, Plot, legend, colours, edits), and data-id
// attributes are strings. A hand-edited file with a missing, numeric or repeated id gets
// unique string ids on load, so each row stays separately addressable.
function withUniqueComboIds(mod) {
  if (!Array.isArray(mod.combinations)) return mod;
  const seen = new Set();
  const combinations = mod.combinations.map((c, i) => {
    const base = c.id == null || c.id === "" ? `c${i + 1}` : String(c.id);
    let id = base;
    for (let n = 2; seen.has(id); n++) id = `${base}-${n}`;
    seen.add(id);
    return id === c.id ? c : { ...c, id };
  });
  const selectedComboId = mod.selectedComboId == null ? mod.selectedComboId : String(mod.selectedComboId);
  const hiddenComboIds = Array.isArray(mod.hiddenComboIds) ? mod.hiddenComboIds.map(String) : mod.hiddenComboIds;
  return { ...mod, combinations, selectedComboId, hiddenComboIds };
}

function supportMark(x, y, type) {
  if (type === "Fixed") {
    const ticks = [-8, -4, 0, 4, 8]
      .map((dx) => `<line x1="${x + dx - 3}" y1="${y + 28}" x2="${x + dx + 3}" y2="${y + 18}" stroke="var(--color-muted)" stroke-width="1"/>`)
      .join("");
    return `<g><line x1="${x}" y1="${y + 3}" x2="${x}" y2="${y + 22}" stroke="var(--color-fg)" stroke-width="1.4"/>${ticks}</g>`;
  }
  const tri = `<polygon points="${x},${y + 4} ${x - 8},${y + 18} ${x + 8},${y + 18}" fill="none" stroke="var(--color-fg)" stroke-width="1.3"/>`;
  if (type === "Roller") {
    return `<g>${tri}<circle cx="${x - 5}" cy="${y + 22}" r="3" fill="none" stroke="var(--color-muted)" stroke-width="1.1"/><circle cx="${x + 5}" cy="${y + 22}" r="3" fill="none" stroke="var(--color-muted)" stroke-width="1.1"/></g>`;
  }
  return `<g>${tri}<line x1="${x - 10}" y1="${y + 18}" x2="${x + 10}" y2="${y + 18}" stroke="var(--color-muted)" stroke-width="1.1"/></g>`;
}

function schematicSvg(mod, result) {
  const n = result.nElements;
  const L = Math.max(result.totalLength, 1e-6);
  const W = 920;
  const H = 204;
  const padX = 36;
  const beamY = 92;
  const inner = W - padX * 2;
  const xAt = (x) => padX + (x / L) * inner;
  const loads = mod.loads.filter((l) => l.active && Number.isFinite(l.magnitude) && l.magnitude !== 0);
  const maxUdl = Math.max(0.001, ...loads.filter((l) => l.type === "UDL").map((l) => Math.abs(l.magnitude)));
  // In the all-combinations view each support is labelled with the largest and smallest
  // reaction over the shown combinations.
  const shown = isAllView(mod) ? shownComboResults(mod, result) : null;
  const reactionAt = new Map();
  for (const r of result.reactions) {
    if (!shown) {
      reactionAt.set(r.node, combinedReaction(r, result.selected.factors).V);
    } else if (shown.length) {
      const vals = shown.map((c) => combinedReaction(r, c.factors).V);
      reactionAt.set(r.node, { max: Math.max(...vals), min: Math.min(...vals) });
    }
  }
  // Max over min on two short lines, so labels stay as narrow as the single view's and do
  // not run into each other on closely spaced supports.
  const reactionLines = (Rv) => {
    if (typeof Rv === "number") return Math.abs(Rv) >= 1e-6 ? [formatNum(Rv, 2)] : [];
    if (Math.abs(Rv.max) < 1e-6 && Math.abs(Rv.min) < 1e-6) return [];
    return Math.abs(Rv.max - Rv.min) < 1e-6 ? [formatNum(Rv.max, 2)] : [formatNum(Rv.max, 2), formatNum(Rv.min, 2)];
  };

  const elLabels = result.nodeX
    .slice(0, n)
    .map((x0, i) => {
      const x1 = result.nodeX[i + 1];
      const cx = (xAt(x0) + xAt(x1)) / 2;
      return `<text x="${cx}" y="16" text-anchor="middle" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(mod.elements[i]?.description || "E" + (i + 1))} · ${esc(formatNum(x1 - x0, 2))} m</text>`;
    })
    .join("");

  const loadDraw = loads
    .map((ld) => {
      if (ld.type === "UDL") {
        const a = Math.max(0, ld.x1);
        const b = Math.min(L, ld.x2);
        const x1 = xAt(a);
        const x2 = xAt(b);
        const up = ld.magnitude < 0;
        const lane = CASE_LANE[ld.case] ?? 0;
        const h = 8 + (Math.abs(ld.magnitude) / maxUdl) * 14;
        const y0 = up ? beamY + 8 + lane * 3 : beamY - 8 - lane * 3;
        const y1 = up ? y0 + h : y0 - h;
        const fill = ld.case.startsWith("W") ? "var(--color-shear)" : "var(--color-moment)";
        const steps = Math.max(3, Math.min(24, Math.round((x2 - x1) / 28)));
        const pts = [];
        const lines = [];
        for (let i = 0; i <= steps; i++) {
          const x = x1 + ((x2 - x1) * i) / steps;
          pts.push(`${x},${y1}`);
          lines.push(`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${fill}" stroke-width="0.7"/>`);
        }
        return `<g opacity="0.85"><polygon points="${x1},${y0} ${pts.join(" ")} ${x2},${y0}" fill="${fill}" fill-opacity="0.18" stroke="${fill}" stroke-width="0.8"/>${lines.join("")}</g>`;
      }
      const x = xAt(Math.min(L, Math.max(0, ld.x1)));
      if (ld.type === "Moment") {
        const poly = ld.magnitude >= 0 ? "10,-14 6,-8 14,-10" : "-10,-14 -6,-8 -14,-10";
        return `<g transform="translate(${x} ${beamY})"><path d="M -10 -14 A 12 12 0 1 1 10 -14" fill="none" stroke="var(--color-moment)" stroke-width="1.4"/><polygon points="${poly}" fill="var(--color-moment)"/></g>`;
      }
      const down = ld.magnitude >= 0;
      const y1 = down ? beamY - 36 : beamY + 36;
      const arrow = down
        ? `${x},${beamY - 4} ${x - 4},${beamY - 12} ${x + 4},${beamY - 12}`
        : `${x},${beamY + 4} ${x - 4},${beamY + 12} ${x + 4},${beamY + 12}`;
      return `<g><line x1="${x}" y1="${y1}" x2="${x}" y2="${down ? beamY - 6 : beamY + 6}" stroke="var(--color-fg)" stroke-width="1.3"/><polygon points="${arrow}" fill="var(--color-fg)"/></g>`;
    })
    .join("");

  const nodes = result.nodeX
    .map((x, i) => {
      const px = xAt(x);
      const s = mod.supports[i] ?? "Free";
      const Rv = reactionAt.get(i + 1);
      const end = i === 0 || i === result.nodeX.length - 1;
      const rv = Rv != null ? reactionLines(Rv) : [];
      const rvTxt = rv
        .map((t, k) => `<text x="${px}" y="${beamY + 36 + k * 9}" text-anchor="middle" fill="var(--color-shear)" font-size="8" font-family="var(--font-mono)">${esc(t)}</text>`)
        .join("");
      const xTxt = end
        ? `<text x="${px}" y="${s === "Free" ? beamY + 28 : beamY + (rv.length > 1 ? 59 : 50)}" text-anchor="${i === 0 ? "start" : "end"}" fill="var(--color-muted)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(x, 2))}</text>`
        : "";
      return `<g><circle cx="${px}" cy="${beamY}" r="2.6" fill="var(--color-bg)" stroke="var(--color-beam)" stroke-width="1.2"/>${s !== "Free" ? supportMark(px, beamY, s) : ""}${rvTxt}${xTxt}</g>`;
    })
    .join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Beam elevation">
    <line x1="${padX}" y1="${beamY}" x2="${W - padX}" y2="${beamY}" stroke="var(--color-beam)" stroke-width="3.5" stroke-linecap="round"/>
    ${elLabels}${loadDraw}${nodes}
    <text x="${padX}" y="${H - 10}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">x = 0</text>
    <text x="${W - padX}" y="${H - 10}" text-anchor="end" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(L, 3))} m</text>
  </svg>`;
}

// The diagrams keep their aspect ratio, so on a phone a 920-wide drawing shrinks to a thin
// strip with unreadable labels. Below 640 px they are laid out on a narrower canvas instead.
function diagramWidth() {
  return window.innerWidth < 640 ? 460 : 920;
}

function forceDiagramHtml(id, title, unit, color, points, nodeX, envelopeMax, envelopeMin) {
  const W = diagramWidth();
  const H = 168;
  const pad = { l: 52, r: 16, t: 18, b: 28 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const ys = points.map((p) => p.y);
  const envYs = [...(envelopeMax ?? []).map((p) => p.y), ...(envelopeMin ?? []).map((p) => p.y)];
  const all = ys.concat(envYs);
  let min = Math.min(0, ...all);
  let max = Math.max(0, ...all);
  if (min === max) {
    min -= 1;
    max += 1;
  }
  const span = max - min;
  min -= span * 0.08;
  max += span * 0.08;
  const L = Math.max(points[points.length - 1]?.x ?? 1, 1e-6);
  const xAt = (x) => pad.l + (x / L) * innerW;
  const yAt = (y) => pad.t + ((max - y) / (max - min)) * innerH;
  const toPath = (pts) => {
    if (!pts.length) return "";
    return pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xAt(p.x).toFixed(2)} ${yAt(p.y).toFixed(2)}`).join(" ");
  };
  const areaPath = (pts) => {
    if (!pts.length) return "";
    const z = yAt(0);
    const body = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xAt(p.x).toFixed(2)} ${yAt(p.y).toFixed(2)}`).join(" ");
    const last = pts[pts.length - 1];
    const first = pts[0];
    return `${body} L ${xAt(last.x).toFixed(2)} ${z.toFixed(2)} L ${xAt(first.x).toFixed(2)} ${z.toFixed(2)} Z`;
  };
  const maxPt = points.reduce((a, b) => (b.y > a.y ? b : a), points[0] ?? { x: 0, y: 0 });
  const minPt = points.reduce((a, b) => (b.y < a.y ? b : a), points[0] ?? { x: 0, y: 0 });
  const hover = ui.hover[id];
  const probe = ui.probeX == null ? null : nearest(points, ui.probeX);
  const shown = hover ?? (probe ? { x: probe.x, y: probe.y } : null);
  const pinX = hover?.x ?? probe?.x;
  const nodeLines = nodeX
    .map(
      (x, i) =>
        `<line x1="${xAt(x)}" y1="${pad.t}" x2="${xAt(x)}" y2="${H - pad.b}" stroke="var(--color-border)" stroke-width="1"${i === 0 || i === nodeX.length - 1 ? "" : ' stroke-dasharray="2 4"'}/>`,
    )
    .join("");
  const env =
    envelopeMax && envelopeMin
      ? `<path d="${toPath(envelopeMax)}" fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="1"/><path d="${toPath(envelopeMin)}" fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="1"/>`
      : "";
  const pin =
    pinX != null

      : "";
  const read = shown
    ? `x ${formatNum(shown.x, 3)} m · ${formatNum(shown.y, 3)} ${unit}`
    : `max ${formatNum(maxPt?.y ?? 0, 3)} · min ${formatNum(minPt?.y ?? 0, 3)}`;
  return `<div class="diagram" data-diagram="${esc(id)}">
    <div class="diagram-head">
      <div><h3>${esc(title)}</h3><span class="unit">${esc(unit)}</span></div>

    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} diagram" data-diagram-svg="${esc(id)}">
      <line x1="${pad.l}" y1="${yAt(0)}" x2="${W - pad.r}" y2="${yAt(0)}" stroke="var(--color-border-strong)" stroke-width="1"/>
      ${nodeLines}${env}
      <path d="${areaPath(points)}" fill="${color}" fill-opacity="0.22"/>
      <path d="${toPath(points)}" fill="none" stroke="${color}" stroke-width="1.6"/>
      ${pin}
      <text x="4" y="${yAt(max) + 8}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(max, 2))}</text>
      <text x="4" y="${yAt(min)}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(min, 2))}</text>
    </svg>
  </div>`;
}

// One line per combination over a shared station list, with the envelope of the shown
// combinations as a faint band behind them. Hover and highlight are wired up in
// bindMultiDiagrams, which reads W and H back from the viewBox and must use the same padding.
function multiDiagramHtml(id, title, unit, xs, series, nodeX) {
  const W = diagramWidth();
  const H = 208;
  const pad = { l: 52, r: 16, t: 18, b: 28 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const hi = xs.map((_, i) => Math.max(...series.map((s) => s.ys[i])));
  const lo = xs.map((_, i) => Math.min(...series.map((s) => s.ys[i])));
  let min = Math.min(0, ...lo);
  let max = Math.max(0, ...hi);
  if (min === max) {
    min -= 1;
    max += 1;
  }
  const span = max - min;
  min -= span * 0.08;
  max += span * 0.08;
  const L = Math.max(xs[xs.length - 1] ?? 1, 1e-6);
  const xAt = (x) => pad.l + (x / L) * innerW;
  const yAt = (y) => pad.t + ((max - y) / (max - min)) * innerH;
  const pts = (ys) => ys.map((y, i) => `${xAt(xs[i]).toFixed(1)} ${yAt(y).toFixed(1)}`);
  const band = xs.length ? `M ${pts(hi).join(" L ")} L ${pts(lo).reverse().join(" L ")} Z` : "";
  const nodeLines = nodeX
    .map(
      (x, i) =>
        `<line x1="${xAt(x)}" y1="${pad.t}" x2="${xAt(x)}" y2="${H - pad.b}" stroke="var(--color-border)" stroke-width="1"${i === 0 || i === nodeX.length - 1 ? "" : ' stroke-dasharray="2 4"'}/>`,
    )
    .join("");
  const lines = series
    .map((s) => {
      const dash = s.style.dash ? ` stroke-dasharray="${s.style.dash}"` : "";
      return `<path class="series" data-combo="${esc(s.id)}" d="M ${pts(s.ys).join(" L ")}" fill="none" stroke="${s.style.color}" stroke-width="1.6" stroke-linejoin="round"${dash}/>`;
    })
    .join("");
  let pin = "";
  if (ui.probeX != null && xs.length) {
    const i = nearestIndex(xs, ui.probeX);
    const px = xAt(xs[i]).toFixed(1);
    pin =
      `<line x1="${px}" y1="${pad.t}" x2="${px}" y2="${H - pad.b}" stroke="var(--color-fg)" stroke-opacity="0.45"/>` +
      series
        .map((s) => `<circle class="series" data-combo="${esc(s.id)}" cx="${px}" cy="${yAt(s.ys[i]).toFixed(1)}" r="3" fill="${s.style.color}" stroke="var(--color-bg)" stroke-width="1"/>`)
        .join("");
  }
  let sMax = series[0];
  let sMin = series[0];
  let iMax = 0;
  let iMin = 0;
  for (const s of series) {
    for (let i = 0; i < xs.length; i++) {
      if (s.ys[i] > sMax.ys[iMax]) { sMax = s; iMax = i; }
      if (s.ys[i] < sMin.ys[iMin]) { sMin = s; iMin = i; }
    }
  }
  const read = `max ${formatNum(sMax.ys[iMax] ?? 0, 3)} ${sMax.name} · min ${formatNum(sMin.ys[iMin] ?? 0, 3)} ${sMin.name}`;
  return `<div class="diagram multi" data-diagram="${esc(id)}">
    <div class="diagram-head">
      <div><h3>${esc(title)}</h3><span class="unit">${esc(unit)}</span></div>
      <p class="read">${esc(read)}</p>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} diagram, all shown combinations" data-diagram-svg="${esc(id)}">
      <path d="${band}" fill="var(--color-fg)" fill-opacity="0.05"/>
      <line x1="${pad.l}" y1="${yAt(0)}" x2="${W - pad.r}" y2="${yAt(0)}" stroke="var(--color-border-strong)" stroke-width="1"/>
      ${nodeLines}${lines}${pin}
      <line data-cross x1="0" y1="${pad.t}" x2="0" y2="${H - pad.b}" stroke="var(--color-fg)" stroke-opacity="0.3" visibility="hidden"/>
      <text x="4" y="${yAt(max) + 8}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(max, 2))}</text>
      <text x="4" y="${yAt(min)}" fill="var(--color-subtle)" font-size="9" font-family="var(--font-mono)">${esc(formatNum(min, 2))}</text>
    </svg>
  </div>`;
}

// Library beams in natural order after "Custom", then every section saved with the model that
// is not in the library (so one can be chosen again after switching away), then a missing
// name the element uses, so the select shows what the element really uses.
function sectionOptions(selected, mod) {
  const byName = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
  const names = SECTION_LIBRARY.slice(1).map((s) => s.name).sort(byName);
  const list = [{ value: "Custom", label: "Custom" }, ...names.map((n) => ({ value: n, label: n }))];
  const saved = Object.keys(mod?.sectionDefs || {}).filter((n) => !names.includes(n)).sort(byName);
  list.push(...saved.map((n) => ({ value: n, label: `${n} (saved copy)` })));
  const sel = selected || "Custom";
  if (!list.some((o) => o.value === sel)) list.push({ value: sel, label: `${sel} (missing)` });
  return options(list, sel);
}

  const rows = mod.combinations
    .map((c) => {
      const selected = !isAllView(mod) && c.id === effectiveComboId(mod) ? " selected" : "";
      const factors = LOAD_CASES.map(
        (k) =>
          `<td class="w-24"><input class="field sm" type="number" step="0.05" data-act="combo-factor" data-id="${esc(c.id)}" data-factor="${esc(k)}" value="${esc(inputValue(c.factors[k], 4))}"></td>`,
      ).join("");
      const plot = activeIds.has(c.id)
        ? `<input class="plot-check" type="checkbox" data-act="plot-combo" data-id="${esc(c.id)}"${hidden.has(c.id) ? "" : " checked"} aria-label="Plot ${esc(c.name)} in the all-combinations view">`
        : `<input class="plot-check" type="checkbox" disabled title="All factors are zero — nothing to plot" aria-label="${esc(c.name)} has all-zero factors">`;
      return `<tr class="combo-row${selected}" data-act="select-combo" data-id="${esc(c.id)}">

        <td class="muted">${esc(c.class)}</td>

function viewBar(mod, result) {
  const all = isAllView(mod);
  const seg = `<div class="seg" role="group" aria-label="Result view">
      <button type="button" class="${all ? "" : "on"}" data-act="view" data-view="single" aria-pressed="${all ? "false" : "true"}">Selected combination</button>
      <button type="button" class="${all ? "on" : ""}" data-act="view" data-view="all" aria-pressed="${all ? "true" : "false"}">All combinations</button>
    </div>`;
  if (!all) return `<div class="row-head" style="align-items:center">${seg}</div>`;
  const hidden = hiddenSet(mod);
  const nShown = result.comboResults.filter((r) => !hidden.has(r.id)).length;
  const nTotal = result.comboResults.length;
  const chips = result.comboResults
    .map((r) => {
      const on = !hidden.has(r.id);
      return `<button type="button" class="chip" data-act="toggle-combo" data-id="${esc(r.id)}" aria-pressed="${on ? "true" : "false"}" title="${esc(`${r.class} · ${factorsText(r.factors)}`)}">${comboKey(comboStyle(mod, r.id))}${esc(r.name)}</button>`;
    })
    .join("");
  return `<section class="card viewbar">
    <div class="row-head" style="align-items:center">

      <div class="actions">
        <span class="mono-note" style="margin:0">${nShown} of ${nTotal} shown</span>
        <button class="btn" type="button" data-act="show-combos" data-show="all"${nShown === nTotal ? " disabled" : ""}>Show all</button>
